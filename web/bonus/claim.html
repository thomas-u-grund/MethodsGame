<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claim Your Bonus Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="bonus.css">
<script src="config.js"></script>
</head>
<body>
<main style="max-width:560px">
  <div class="kicker">The Secret of the Lost Codebook</div>
  <h1 id="title">Claim your bonus point</h1>
  <p class="lede" id="sub">&nbsp;</p>

  <section class="card" id="form" hidden>
    <label for="num">Student number</label>
    <input id="num" autocomplete="off" inputmode="text">
    <label for="name">Full name</label>
    <input id="name" autocomplete="name">
    <label class="radio"><input type="checkbox" id="ok"> I played this part of the game myself. My student number and name go to my instructor with this claim.</label>
    <button id="send">Claim the point</button>
    <div id="msg" class="msg"></div>
  </section>
  <section class="card" id="done" hidden>
    <h2>Claimed.</h2>
    <p id="doneText"></p>
    <p class="small">You can close this tab and go back to the game.</p>
  </section>
</main>
<script>
(function(){
  var CFG = window.CB_BONUS || {}, $ = function(id){ return document.getElementById(id); };
  var q = new URLSearchParams(location.search), code = (q.get('course') || '').toUpperCase(), act = q.get('act') || '', key = q.get('key') || '';
  var ACT_NAME = { '1':'Act I: The Question', '2':'Act II: Theory', '3':'Act III: Data', '4':'Act IV: Evidence', '5':'Act V: The Annual Meeting', end:'the whole game' };
  function fail(t){ $('sub').textContent = t; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  if (!CFG.enabled) return fail('The bonus-point service is not switched on.');
  if (!code || !act || !key) return fail('This claim link is incomplete. Open it again from the game.');
  var done = 'cb_claimed_' + code + '_' + act;
  fetch(CFG.api + '/course/' + encodeURIComponent(code)).then(function(r){ return r.json(); }).then(function(r){
    if (!r.ok) return fail('This course link is not known. Ask your instructor for the right game link.');
    var c = r.course, dl = c.deadlines[act];
    $('sub').innerHTML = 'For <b>' + ACT_NAME[act] + '</b> in <b>' + esc(c.course_name) + '</b>, ' + esc(c.university) + (dl ? '. Claim by ' + dl + '.' : '.');
    try { if (localStorage.getItem(done)){ $('done').hidden = false; $('doneText').textContent = 'You have already claimed this point on this device.'; return; } } catch(e){}
    $('form').hidden = false;
  }).catch(function(){ fail('No connection. Please reload the page.'); });
  $('send').onclick = async function(){
    var m = $('msg');
    if (!$('ok').checked){ m.className = 'msg err'; m.textContent = 'Please tick the box first.'; return; }
    this.disabled = true;
    var res;
    try {
      res = await (await fetch(CFG.api + '/claim', { method:'POST', headers:{ 'content-type':'application/json' },
        body: JSON.stringify({ code: code, act: act, key: key, number: $('num').value, name: $('name').value }) })).json();
    } catch(e){ res = { ok:false, error:'No connection. Please try again.' }; }
    this.disabled = false;
    if (!res.ok){ m.className = 'msg err'; m.textContent = res.error; return; }
    try { localStorage.setItem(done, '1'); } catch(e){}
    $('form').hidden = true; $('done').hidden = false;
    $('doneText').textContent = 'Your point for ' + ACT_NAME[act] + ' is recorded. Your instructor gets the list after the deadline.';
  };
})();
</script>
</body>
</html>
