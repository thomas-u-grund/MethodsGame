<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claim Your Bonus Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="bonus.css">
<script src="config.js"></script>
</head>
<body>
<main style="max-width:560px">
  <div class="kicker">The Secret of the Lost Codebook</div>
  <h1 id="title">Claim your bonus point</h1>
  <p class="lede" id="sub">&nbsp;</p>

  <section class="card" id="form" hidden>
    <label for="num">Student number</label>
    <input id="num" autocomplete="off" inputmode="text">
    <label for="name">Full name</label>
    <input id="name" autocomplete="name">
    <label class="radio"><input type="checkbox" id="ok"> I played this part of the game myself. My student number and name go to my instructor with this claim.</label>
    <button id="send">Claim the point</button>
    <div id="msg" class="msg"></div>
  </section>
  <!-- from the game's last screen (2026-10-06): pick the course, type its password -->
  <section class="card" id="endForm" hidden>
    <label for="course">Your course</label>
    <select id="course"><option value="">Choose your course…</option></select>
    <label for="pw">Course password</label>
    <input id="pw" autocomplete="off" autocapitalize="characters" placeholder="from your instructor, like SWAN-4821">
    <label for="enum">Student number (Matrikelnummer)</label>
    <input id="enum" autocomplete="off" inputmode="text">
    <label for="ename">Full name</label>
    <input id="ename" autocomplete="name">
    <label class="radio"><input type="checkbox" id="eok"> I played the game myself. My student number and name go to my instructor with this claim.</label>
    <button id="esend">Claim my bonus points</button>
    <div id="emsg" class="msg"></div>
  </section>
  <section class="card" id="done" hidden>
    <h2>Claimed.</h2>
    <p id="doneText"></p>
    <p class="small">You can close this tab and go back to the game.</p>
  </section>
</main>
<script>
(function(){
  var CFG = window.CB_BONUS || {}, $ = function(id){ return document.getElementById(id); };
  var q = new URLSearchParams(location.search), code = (q.get('course') || '').toUpperCase(), act = q.get('act') || '', key = q.get('key') || '';
  var ACT_NAME = { '1':'Act I: The Question', '2':'Act II: Theory', '3':'Act III: Data', '4':'Act IV: Evidence', '5':'Act V: The Annual Meeting', end:'the whole game' };
  function fail(t){ $('sub').textContent = t; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  if (!CFG.enabled) return fail('The bonus-point service is not switched on.');
  if (q.get('from') === 'end') return fromEnd();
  if (!code || !act || !key) return fail('This claim link is incomplete. Open it again from the game.');
  var done = 'cb_claimed_' + code + '_' + act;
  fetch(CFG.api + '/course/' + encodeURIComponent(code)).then(function(r){ return r.json(); }).then(function(r){
    if (!r.ok) return fail('This course link is not known. Ask your instructor for the right game link.');
    var c = r.course, dl = c.deadlines[act];
    $('sub').innerHTML = 'For <b>' + ACT_NAME[act] + '</b> in <b>' + esc(c.course_name) + '</b>, ' + esc(c.university) + (dl ? '. Claim by ' + dl + '.' : '.');
    try { if (localStorage.getItem(done)){ $('done').hidden = false; $('doneText').textContent = 'You have already claimed this point on this device.'; return; } } catch(e){}
    $('form').hidden = false;
  }).catch(function(){ fail('No connection. Please reload the page.'); });
  // claiming from the game's last screen: the courses with an open deadline, the course password, the student number
  function fromEnd(){
    $('title').textContent = 'Claim your bonus points';
    if (!/^[0-9a-f]{32}$/.test(key)) return fail('This claim link is incomplete. Open it again from the end of the game.');
    var doneKey = 'cb_claimed_end_' + key;
    try { if (localStorage.getItem(doneKey)){ $('done').hidden = false; $('doneText').textContent = 'You have already claimed your points on this device.'; return; } } catch(e){}
    fetch(CFG.api + '/open-courses').then(function(r){ return r.json(); }).then(function(r){
      if (!r.ok) return fail('No connection. Please reload the page.');
      if (!r.courses.length) return fail('No course is taking claims at the moment.');
      $('sub').textContent = 'You finished the game. Choose your course, type the password your instructor gave you, and claim.';
      $('course').innerHTML += r.courses.map(function(c){
        return '<option value="' + esc(c.code) + '"' + (c.code === code ? ' selected' : '') + '>' + esc(c.course_name) + ' \u00b7 ' + esc(c.university) + (c.term ? ' \u00b7 ' + esc(c.term) : '') + '</option>'; }).join('');
      $('endForm').hidden = false;
    }).catch(function(){ fail('No connection. Please reload the page.'); });
    $('esend').onclick = async function(){
      var m = $('emsg');
      if (!$('course').value){ m.className = 'msg err'; m.textContent = 'Please choose your course.'; return; }
      if (!$('eok').checked){ m.className = 'msg err'; m.textContent = 'Please tick the box first.'; return; }
      this.disabled = true;
      var res;
      try {
        res = await (await fetch(CFG.api + '/claim-end', { method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ code: $('course').value, password: $('pw').value, key: key, number: $('enum').value, name: $('ename').value }) })).json();
      } catch(e){ res = { ok:false, error:'No connection. Please try again.' }; }
      this.disabled = false;
      if (!res.ok){ m.className = 'msg err'; m.textContent = res.error; return; }
      try { localStorage.setItem(doneKey, '1'); } catch(e){}
      $('endForm').hidden = true; $('done').hidden = false;
      $('doneText').textContent = 'Recorded for ' + res.course + ': ' + res.acts.join(', ') + '.' +
        (res.already.length ? ' Already claimed before: ' + res.already.join(', ') + '.' : '') + ' Your instructor gets the list after the deadline.';
    };
  }
  $('send').onclick = async function(){
    var m = $('msg');
    if (!$('ok').checked){ m.className = 'msg err'; m.textContent = 'Please tick the box first.'; return; }
    this.disabled = true;
    var res;
    try {
      res = await (await fetch(CFG.api + '/claim', { method:'POST', headers:{ 'content-type':'application/json' },
        body: JSON.stringify({ code: code, act: act, key: key, number: $('num').value, name: $('name').value }) })).json();
    } catch(e){ res = { ok:false, error:'No connection. Please try again.' }; }
    this.disabled = false;
    if (!res.ok){ m.className = 'msg err'; m.textContent = res.error; return; }
    try { localStorage.setItem(done, '1'); } catch(e){}
    $('form').hidden = true; $('done').hidden = false;
    $('doneText').textContent = 'Your point for ' + ACT_NAME[act] + ' is recorded. Your instructor gets the list after the deadline.';
  };
})();
</script>
</body>
</html>
