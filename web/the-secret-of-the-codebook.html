<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<title>The Secret of the Lost Codebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;700&display=swap">
<style>
  :root{
    --shell:#241A12;
    --wall:#2E4358;
    --wainscot:#16222C;
    --wainscot-light:#22323F;
    --floor-top:#8B5A34;
    --floor-bot:#5C3A20;
    --wood:#6B4226;
    --wood-dark:#3B2110;
    --wood-light:#9A6A45;
    --mustard:#E0A83E;
    --mustard-deep:#C68A2E;
    --cream:#EDF0F2;
    --cream-dim:#C3CBD1;
    --water:#557E70;
    --water-light:#8DBCA9;
    --wrong:#C0552F;
    --correct:#4F7A4E;
    --fake:#7A5A8A;
    --kira:#4A8B92;
    --ink:#2E2118;
    --ink-soft:#5C4A3A;
    --shadow: 0 18px 50px rgba(0,0,0,0.45);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--shell); color:var(--cream);
    font-family:'Source Sans 3', system-ui, sans-serif;
    height:100dvh; display:flex; justify-content:center; padding:24px; overflow-y:auto;
  }
  .stage{ width:100%; max-width:1800px; height:100%; min-height:0; display:flex; flex-direction:column; gap:12px; }
  #root{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  #root > .hud{ flex:0 0 auto; }
  #root > .game-frame, #root > .room-columns{ flex:1 1 auto; min-height:0; }

  /* ---- persistent top HUD ---- */
  .gamehud{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    padding-bottom:4px;
  }
  .gametitle{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; color:var(--cream);
    display:flex; align-items:center; gap:10px;
  }
  .gametitle .sub{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--cream-dim); }

  /* ---- room nameplate + local hud row (reused inside rooms) ---- */
  .hud{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .nameplate{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--cream-dim); border:1px solid rgba(240,228,200,0.25); border-radius:3px; padding:6px 12px;
  }
  .nameplate b{color:var(--cream); font-weight:700;}
  .backbtn{
    all:unset; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--cream-dim); border:1px solid rgba(240,228,200,0.25); border-radius:3px; padding:6px 12px;
  }
  .backbtn:hover{ color:var(--cream); border-color:rgba(240,228,200,0.5); }

  /* ---- shared game-frame / scene / panel chrome ---- */
  .game-frame{
    border-radius:6px; overflow:hidden; box-shadow:var(--shadow);
    border:6px solid var(--shell); outline:1px solid rgba(240,228,200,0.15);
    display:flex; flex-direction:column; min-height:0; background:var(--shell);
  }
  /* Full width, 16:9, exactly as measured -- the panel floats over its lower edge rather
     than taking space from it, so the art never shrinks and no hotspot moves. See 8l. */
  .scene-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:var(--wall);
    flex:0 0 auto; max-height:100%; min-height:0; overflow:hidden; }
  .scene-wrap svg{ display:block; width:100%; height:100%; }
  /* Anything drawn here covers the sprite layer, so a room with an fg must keep its
     characters out from behind it unless being hidden is the point. The Bureau's counter
     spans x 7-54%, which is why Tobi loiters on the right-hand side of that room. */
  .scene-fg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
             pointer-events:none; z-index:6; }
  .scene-wrap svg.passthrough{ pointer-events:none; }

  .hotspot{
    all:unset; position:absolute; cursor:pointer;
    border:1.5px dashed transparent; border-radius:3px;
    transition:border-color .1s, background .1s;
  }
  .hotspot:hover, .hotspot:focus-visible{ border-color:rgba(240,228,200,0.85); background:rgba(240,228,200,0.08); outline:none; }
  .hotspot.solved{ border-color:var(--correct); background:rgba(79,122,78,0.15); }

  .hint{
    position:absolute; left:12px; bottom:10px;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.04em;
    color:var(--cream); background:rgba(0,0,0,0.6); padding:6px 10px; border-radius:2px;
    opacity:0; transition:opacity .1s; pointer-events:none; max-width:75%;
  }
  .hint.show{ opacity:1; }

  /* The panel is cut into the bottom of the scene rather than sitting under it: translucent,
     blurred, and pointer-transparent everywhere except the buttons themselves, so hotspots
     in the lower part of the art stay clickable underneath it. */
  .game-frame{ position:relative; }
  .panel{
    position:absolute; left:0; right:0; bottom:0; z-index:15;
    background:rgba(237,240,242,0.76); backdrop-filter:blur(9px) saturate(.9); -webkit-backdrop-filter:blur(9px) saturate(.9);
    color:var(--ink);
    padding:14px 26px 16px; display:flex; flex-direction:column; gap:9px;
    border-top:3px solid var(--mustard-deep);
    min-height:70px; max-height:64%; overflow-y:auto;
    pointer-events:none;
  }
  /* Only the buttons themselves catch clicks, so the gaps and margins of the panel pass
     straight through to the art underneath. The list as a whole becomes interactive only
     when it actually scrolls, because then it needs the wheel. */
  .panel button.choice{ pointer-events:auto; }
  .panel .choices.is-scrollable{ pointer-events:auto; }
  /* How many replies there are. A player should never have to discover that a line had
     alternatives, and "1 reply" is information too -- it says this is the only way on. */
  .choices-count{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft); opacity:.75; margin-top:2px;
  }
  /* If the list still overflows on a very short window, say so rather than clipping in
     silence: the fade is only added when scrollHeight actually exceeds clientHeight. */
  .choices.is-scrollable{
    overflow-y:auto; -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
    mask-image:linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
  }
  /* ---- Monkey-Island-style in-scene caption (narration/speaker text overlaid on the art) ---- */
  .scene-caption{
    position:absolute; left:50%; top:3%; transform:translateX(-50%);
    width:min(640px, 72%); max-width:92%;
    background:rgba(237,240,242,0.99); color:var(--ink);
    border-radius:8px; padding:10px 18px 12px;
    box-shadow:0 10px 26px rgba(0,0,0,0.5); border:1px solid rgba(0,0,0,0.12);
    pointer-events:none; z-index:20;
    opacity:1; transition:opacity .18s ease;
  }
  .scene-caption.caption-dismissed{ opacity:0; }
  .scene-caption .speaker{ margin-bottom:2px; }
  .scene-caption .line{ font-size:clamp(.92rem, 1.6vw, 1.08rem); }
  .scene-caption::after{
    content:''; position:absolute; left:50%; margin-left:-11px; width:0; height:0;
    border-left:11px solid transparent; border-right:11px solid transparent;
  }
  .scene-caption.tail-down::after{ top:100%; border-top:14px solid rgba(237,240,242,0.99); }
  .scene-caption.tail-up::after{ bottom:100%; border-bottom:14px solid rgba(237,240,242,0.99); }
  /* narration (scene descriptions) is not speech: no bubble tail, quieter styling */
  .scene-caption.narration::after{ display:none; }
  .scene-caption.narration{ background:rgba(18,14,10,0.82); border-color:rgba(240,228,200,0.28); color:#F0E4C8; }
  .scene-caption.narration .speaker{ color:rgba(240,228,200,0.6); }
  .scene-caption.narration .line i{ color:rgba(240,228,200,0.75); }
  .scene-caption.narration .line b{ color:rgba(240,228,200,0.85); }
  @media (max-width:760px){
    .scene-caption{ width:92%; top:2%; }
  }
  .speaker{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--wrong); min-height:1em; }
  .speaker.win{ color:var(--correct); }
  .speaker.kira{ color:var(--kira); }
  .line{ font-family:'Fraunces', Georgia, serif; font-size:clamp(1rem, 2vw, 1.2rem); line-height:1.5; text-wrap:balance; }
  .line i{ color:var(--ink-soft); }
  .line b{ font-family:'JetBrains Mono', monospace; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .choices{ display:flex; flex-direction:column; gap:8px; }
  button.choice{
    all:unset; cursor:pointer; background:rgba(252,253,254,0.94);
    border:1px solid var(--cream-dim); border-radius:3px;
    padding:12px 16px; font-family:'Source Sans 3', sans-serif; font-size:.95rem; line-height:1.4; color:var(--ink);
    transition:border-color .12s, transform .12s, background .12s;
  }
  /* Tobi's photo moment: a flash, then the post. The player is never shown in this game,
     which makes the shot funnier -- he has framed it almost entirely on the window. */
  .cb-flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9998;
    animation:cb-flash-anim .5s ease-out forwards; }
  @keyframes cb-flash-anim{ 0%{opacity:0} 8%{opacity:1} 100%{opacity:0} }
  .cb-post-wrap{ position:fixed; inset:0; background:rgba(8,6,4,.72); z-index:9999;
    display:flex; align-items:center; justify-content:center; opacity:0; animation:cb-post-in .45s ease .35s forwards; }
  @keyframes cb-post-in{ to{opacity:1} }
  .cb-post{ width:min(340px,80vw); background:#fff; border-radius:12px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.6); font-family:'Helvetica Neue',Arial,sans-serif; color:#111;
    transform:translateY(14px); animation:cb-post-rise .45s ease .35s forwards; }
  @keyframes cb-post-rise{ to{transform:translateY(0)} }
  .cb-post .hd{ display:flex; align-items:center; gap:8px; padding:9px 11px; font-size:13px; font-weight:600; }
  .cb-post .av{ width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#f9a,#c4f,#5bf); }
  .cb-post .ph{ position:relative; aspect-ratio:1/1; overflow:hidden; background:#222; }
  .cb-post .ph img{ position:absolute; width:190%; height:190%; left:-58%; top:-34%; object-fit:cover;
    transform:rotate(-6deg); filter:brightness(1.12) saturate(1.1); }
  .cb-post .blob{ position:absolute; right:4%; bottom:-6%; width:34%; height:62%;
    background:#1b1510; border-radius:46% 46% 22% 22%; filter:blur(1.5px); opacity:.88; }
  .cb-post .body{ padding:9px 12px 14px; font-size:12.5px; line-height:1.45; }
  .cb-post .likes{ font-weight:700; margin-bottom:3px; }
  .cb-post .tags{ color:#3a6ea8; }
  .cb-post .dismiss{ display:block; width:100%; border:0; border-top:1px solid #eee; background:#fafafa;
    padding:10px; font:600 12px/1 'Helvetica Neue',Arial,sans-serif; color:#666; cursor:pointer; }
  .slip{ background:#E9E2C8; color:#2A1D10; border:2px solid #6B4226; border-radius:5px;
    padding:.7em .8em; font-family:Fraunces,Georgia,serif; box-shadow:0 6px 16px rgba(0,0,0,.45); }
  .slip-hd{ font-family:"JetBrains Mono",monospace; font-size:.72em; letter-spacing:.09em; font-weight:700;
    border-bottom:1px solid #B9A67F; padding-bottom:.3em; margin-bottom:.45em; }
  .slip-seal{ background:#7A2A20; color:#F3E7C8; padding:.05em .4em; border-radius:2px; margin-left:.4em; }
  .slip-row{ display:flex; gap:.6em; margin:.3em 0; align-items:baseline; }
  .slip-k{ font-family:"JetBrains Mono",monospace; font-size:.68em; letter-spacing:.06em; min-width:14em; }
  .slip-v{ flex:1; font-size:.92em; }
  .slip-v.weak{ color:#8A5A2A; font-style:italic; }
  .slip-foot{ margin-top:.5em; border-top:1px solid #B9A67F; padding-top:.35em;
    font-family:"JetBrains Mono",monospace; font-size:.7em; letter-spacing:.07em; }
  .slip-foot .c0{ color:#2F7D3A; } .slip-foot .c1{ color:#4A7A2A; }
  .slip-foot .c2{ color:#B07A18; } .slip-foot .c3{ color:#B3541E; } .slip-foot .c4{ color:#B3261E; }
  .slip-fine{ font-size:.62em; opacity:.6; margin-top:.2em; font-style:italic; }
  button.choice:hover{ border-color:var(--wainscot-light); background:#fff; }
  button.choice:focus-visible{ outline:2px solid var(--wainscot); outline-offset:2px; }
  button.choice:active{ transform:scale(0.99); }
  button.choice:disabled{ opacity:0.4; cursor:default; }
  button.choice .star{ color:var(--mustard-deep); font-weight:700; }
  .state-line{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:2px 0; }
  .state-line.win{ color:var(--correct); }
  .state-line.lose{ color:var(--wrong); }

  .continuebar{ display:flex; justify-content:flex-end; margin-top:4px; }
  button.continue{
    all:unset; cursor:pointer; background:var(--mustard); color:var(--ink); font-weight:700;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    padding:10px 18px; border-radius:3px;
  }
  button.continue:hover{ background:var(--mustard-deep); }

  /* ---- map screen: blueprint dossier map ---- */
  .intro{ font-family:'Fraunces',serif; font-size:1.02rem; line-height:1.6; color:var(--cream-dim); max-width:70ch; }
  .map-wrap{
    position:relative; width:100%; aspect-ratio:1672/941;
    border-radius:8px; overflow:hidden; box-shadow:var(--shadow);
    border:6px solid var(--shell); outline:1px solid rgba(160,210,230,0.15);
    background:#0A1826;
  }
  .map-wrap{ container-type:inline-size; }
  .map-sign{ background:url('map-sign.webp') center/100% 100% no-repeat; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); padding:0 .4em; box-sizing:border-box; }
  .map-sign{ position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none;
    font-family:'Fraunces', Georgia, serif; font-weight:600; color:#3b2414; font-size:1.25cqw; line-height:1.05;
    text-shadow:0 1px 0 rgba(255,245,220,.5); }
  .map-sign .map-stamp{ display:inline-block; margin-top:.15em; padding:.05em .3em; font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:.85em; letter-spacing:.08em; color:#b3261e; border:.14em solid #b3261e; border-radius:.15em; transform:rotate(-8deg); opacity:.9; }
  .map-wrap svg{ display:block; width:100%; height:100%; pointer-events:none; }
  button.campus-hotspot{
    all:unset; position:absolute; cursor:pointer; box-sizing:border-box;
    border-radius:8px; border:2px solid transparent; background:transparent;
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  button.campus-hotspot:disabled{ cursor:default; }
  .campus-hotspot.avail:hover, .campus-hotspot.avail:focus-visible{
    border-color:var(--mustard); background:rgba(224,168,62,0.10); box-shadow:0 0 16px rgba(224,168,62,0.25); outline:none;
  }
  .campus-hotspot.done:hover, .campus-hotspot.done:focus-visible{
    border-color:var(--correct); background:rgba(79,122,78,0.10); outline:none;
  }
  .campus-hotspot.locked:hover, .campus-hotspot.locked:focus-visible{
    border-color:rgba(240,228,200,0.3); background:rgba(240,228,200,0.05); outline:none;
  }

  /* ---- ambient scene animation ---- */
  @keyframes idleBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  @keyframes idleBobSlow{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2.5px); } }
  @keyframes blinkShow{ 0%,92%,100%{ opacity:0; } 95%{ opacity:1; } }
  @keyframes blinkHide{ 0%,92%,100%{ opacity:1; } 95%{ opacity:0; } }
  @keyframes lampSwing{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
  @keyframes wiggle{ 0%,100%{ transform:rotate(0deg) translateY(0); } 25%{ transform:rotate(-4deg) translateY(-2px); } 75%{ transform:rotate(4deg) translateY(-2px); } }
  @keyframes pulseGlow{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }
  @keyframes steamRise{ 0%{ transform:translateY(0) scale(1); opacity:0; } 15%{ opacity:0.55; } 85%{ opacity:0.25; } 100%{ transform:translateY(-22px) scale(1.3); opacity:0; } }
  @keyframes basementFlicker{ 0%,100%{ opacity:0.35; } 48%{ opacity:0.3; } 50%{ opacity:0.14; } 52%{ opacity:0.35; } 53%{ opacity:0.1; } 55%{ opacity:0.35; } }
  .anim-bob{ animation:idleBob 4.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  .anim-bob-slow{ animation:idleBobSlow 5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  .anim-blink{ animation:blinkShow 5s ease-in-out infinite; }
  .anim-blink-hide{ animation:blinkHide 4.6s ease-in-out infinite; }
  .anim-swing{ animation:lampSwing 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0%; }
  .anim-wiggle{ animation:wiggle 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  .anim-pulse{ animation:pulseGlow 2s ease-in-out infinite; }
  .anim-steam{ animation:steamRise 3.2s ease-in infinite; transform-box:fill-box; }
  .anim-flicker{ animation:basementFlicker 7s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .anim-bob,.anim-bob-slow,.anim-blink,.anim-blink-hide,.anim-swing,.anim-wiggle,.anim-pulse,.anim-steam,.anim-flicker{ animation:none; }
  }

  /* ---- professor: stand up + walk cycle ---- */
  #wp_professor{ transition:opacity .5s ease; }
  #wp_professorWalk{ opacity:0; transition:opacity .5s ease; }
  #wp_legL, #wp_legR{ transform-box:fill-box; transform-origin:50% 0%; }
  @keyframes legSwingL{ 0%,100%{ transform:rotate(-16deg); } 50%{ transform:rotate(16deg); } }
  @keyframes legSwingR{ 0%,100%{ transform:rotate(16deg); } 50%{ transform:rotate(-16deg); } }
  #wp_professorWalk.walking #wp_legL{ animation:legSwingL .55s ease-in-out infinite; }
  #wp_professorWalk.walking #wp_legR{ animation:legSwingR .55s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    #wp_professorWalk{ display:none !important; }
  }

  /* ---- kira: roll across the room ---- */
  @keyframes kiraRollBounce{ 0%,100%{ transform:translateY(0) rotate(0deg); } 25%{ transform:translateY(-5px) rotate(-3deg); } 50%{ transform:translateY(0) rotate(0deg); } 75%{ transform:translateY(-5px) rotate(3deg); } }
  .kira-rolling{ animation:kiraRollBounce .5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @media (prefers-reduced-motion: reduce){
    .kira-rolling{ animation:none; }
  }

  /* ---- player avatar: click-to-walk, with size-by-depth ---- */
  .pc-avatar{ position:absolute; width:7.4%; aspect-ratio:60/92; transform-origin:50% 100%; z-index:15; pointer-events:none; }
  .pc-flip{ width:100%; height:100%; }
  .pc-avatar.facing-left .pc-flip{ transform:scaleX(-1); }
  .pc-avatar svg{ width:100%; height:100%; display:block; overflow:visible; }
  .pc-avatar .pc-leg-l, .pc-avatar .pc-leg-r{ transform-box:fill-box; transform-origin:50% 0%; }
  .pc-avatar.walking .pc-leg-l{ animation:legSwingL .42s ease-in-out infinite; }
  .pc-avatar.walking .pc-leg-r{ animation:legSwingR .42s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .pc-avatar{ transition:none !important; }
    .pc-avatar.walking .pc-leg-l, .pc-avatar.walking .pc-leg-r{ animation:none; }
  }

  /* ---- shared progress pips (used by several rooms) ---- */
  .pips{ display:flex; gap:5px; }
  .pip{ width:13px; height:13px; border-radius:50%; background:rgba(240,228,200,0.12); border:2px solid rgba(240,228,200,0.3); }
  .pip.full{ background:var(--correct); border-color:var(--correct); }

  /* ---- the seven-second office ---- */
  .bubble-hud{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--cream-dim); }
  .drops{display:flex; gap:5px;}
  .drop{width:13px; height:13px;}
  .drop circle{fill:rgba(240,228,200,0.15); stroke:rgba(240,228,200,0.35); stroke-width:1.5;}
  .drop.full circle{fill:var(--mustard); stroke:var(--mustard);}
  .room-columns{ display:flex; gap:12px; align-items:stretch; min-height:0; }
  .room-columns .game-frame{ flex:1 1 auto; min-width:0; min-height:0; }
  .side-panel{
    flex:0 0 220px;
    background:var(--shell); border:1px solid rgba(240,228,200,0.18); border-radius:6px;
    padding:12px; display:flex; flex-direction:column; gap:10px; align-self:stretch;
  }
  .sentence-line{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--mustard); height:3.6em; overflow:hidden; padding-bottom:10px; border-bottom:1px dashed rgba(240,228,200,0.18); }
  .side-inv{ display:flex; flex-direction:column; gap:8px; padding-top:10px; border-top:1px dashed rgba(240,228,200,0.18); }
  .side-inv-label{ font-family:'JetBrains Mono', monospace; font-size:12px; line-height:1.35; letter-spacing:.08em; text-transform:uppercase; color:var(--cream-dim); height:2.7em; overflow:hidden; }
  .side-inv-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .side-inv-slot{

  .cc-label{
    position:absolute; display:flex; align-items:center; justify-content:center; text-align:center;
    pointer-events:none; box-sizing:border-box; overflow:visible; white-space:nowrap;
    font-family:'Fraunces', Georgia, serif; font-size:clamp(9px, 1.25vw, 15px); font-weight:700; letter-spacing:.06em;

  /* Engraved brass, screwed to the door -- the material the rest of the game is made of
     (the Bureau's wall of plaques, the Officer's pedestal, the contribution tag). The old
     label was a cream chip with a drop shadow and read as UI floating over the painting. */
  .cc-label span{
    position:relative;
    background:linear-gradient(170deg, #e3c477 0%, #c9a34a 34%, #a8863a 68%, #8a6f2e 100%);
    color:#2b1f0d;
    border:1px solid #6d5522; border-radius:2px;
    padding:0.34em 0.85em;
    box-shadow:inset 0 1px 0 rgba(255,244,205,.75), inset 0 -1px 0 rgba(0,0,0,.28),
               0 2px 5px rgba(0,0,0,.45);
    text-shadow:0 1px 0 rgba(255,240,200,.45);
  }
  /* two little screws, one at each end */
  .cc-label span::before, .cc-label span::after{
    content:''; position:absolute; top:50%; width:.3em; height:.3em; margin-top:-.15em;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f3e1a8, #8a6f2e 70%, #5d4a1d 100%);
    box-shadow:0 0 1px rgba(0,0,0,.6);
  }
  .cc-label span::before{ left:.28em; }
  .cc-label span::after{ right:.28em; }
  /* ---- The Hypotheses Accelerator, zoomed in (ROADMAP 8k) ------------------------
     Two needles move in opposite directions and Feldstrom only ever watches one of them:
     the grander the claim, the lower THINGS THIS FORBIDS and the happier he gets. The
     player cranks it because his reaction is funny, and the gauge they are not watching
     is quietly reporting that the claim now rules nothing out. */
  .acc{ position:absolute; inset:0; z-index:40; overflow:hidden; background:#140d06;
        opacity:0; transition:opacity .45s ease; }
  .acc.in{ opacity:1; }
  /* Purpose-painted close-up of the control face. This used to be workshop-bg.webp blown
     up 2.25x, which is why it looked soft and brown -- it was a crop of a painting drawn
     for a wide shot. The art is 1672x941, the same as every other full-frame asset, so it
     sits at 1:1 and only needs holding down under the overlay. */
  .acc-zoom{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
             filter:brightness(.58) saturate(.95); }
  .acc-vig{ position:absolute; inset:0;
            background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,.34) 0%, rgba(0,0,0,.30) 34%, rgba(0,0,0,.80) 100%); }
  .acc-body{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:1.1%; padding:2% 4%; }
  /* Feldstrom stands in the bottom-right corner of the zoom, so everything the player has
     to read stops short of him rather than running underneath. */
  .acc-feld, .acc-acts{ max-width:76%; margin-left:auto; margin-right:auto; padding-right:19%; box-sizing:border-box; }
  .acc-drums{ display:flex; gap:2.2%; width:100%; justify-content:center; }
  .acc-drum{ flex:1 1 0; max-width:30%; background:linear-gradient(175deg,#2a1e11,#17100a);
             border:1px solid #6d5522; border-radius:4px; padding:.5em .6em .6em;
             box-shadow:inset 0 1px 0 rgba(255,232,170,.18), 0 4px 12px rgba(0,0,0,.6); text-align:center; }
  .acc-drum .k{ font-family:'JetBrains Mono',monospace; font-size:clamp(7px,.72vw,11px);
                letter-spacing:.18em; text-transform:uppercase; color:#c9a34a; }
  .acc-drum .row{ display:flex; align-items:center; justify-content:space-between; gap:.3em; margin-top:.35em; }
  .acc-drum .v{ flex:1 1 auto; font-family:'Fraunces',Georgia,serif; font-weight:700;
                font-size:clamp(9px,1.05vw,17px); color:#F0E4C8; line-height:1.15; min-height:2.3em;
                display:flex; align-items:center; justify-content:center; }
  .acc-crank{ all:unset; cursor:pointer; width:1.7em; height:1.7em; border-radius:50%;
              background:radial-gradient(circle at 35% 30%,#e3c477,#a8863a 65%,#6d5522 100%);
              color:#2b1f0d; font-weight:700; font-size:clamp(9px,.9vw,14px); text-align:center;
              line-height:1.7em; box-shadow:0 2px 5px rgba(0,0,0,.5); flex:0 0 auto; }
  .acc-crank:hover{ filter:brightness(1.12); }
  /* ---- the machine has to look like it is running. Three moving parts, all cheap:
     the drum turns when you crank it, the FORBIDS gauge swings to its new reading, and
     the paper strip creeps out of the feed the whole time. ---- */
  @keyframes accSpin{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }
  .acc-crank.spun{ animation:accSpin .42s cubic-bezier(.2,.8,.3,1); }

  /* ---- living sprites ---------------------------------------------------------------
     Idle breathing, an occasional weight shift, and a talk curve while the character's
     voice clip plays. Everything uses the individual scale/translate/rotate properties so
     it composes with whatever inline transform the room gave the sprite.

     ROADMAP 8p. This used to read as machinery, and for four reasons, all of which were
     consequences of one shape: every motion was a single two-keyframe `alternate` loop on
     the whole sprite.

       1. NOTHING IS IN LOCKSTEP NOW. Every sprite gets a random negative delay and a small
          duration jitter, stamped once by CODEBOOK_STAMP_LIFE. Before that the Registrar,
          KIRA and the skeleton all inhaled on the same frame.
       2. THE TALK CURVE IS NOT A SINE. Two keyframes on `alternate` IS a sine wave, and the
          eye reads exact periodicity as a machine. It is seven uneven beats now, swinging
          both ways by different amounts, starting and ending neutral so the loop has no
          seam.
       3. IT FADES IN AND OUT. --cb-a is the amplitude and it transitions, so speech ramps
          up and settles instead of snapping to full lean and freezing mid-gesture.
       4. TALKING PIVOTS FROM THE SHOULDERS, not the soles. When a person speaks the head
          and shoulders move and the feet stay put; rocking the whole figure about its feet
          is what made it look like a cardboard cut-out on a stick.

     A character's manner is four dials, not its own block of keyframes: --tk-rot how far
     they lean, --tk-sc how much they swell, --tk-ri how much they rise, --tk-dur how fast.

     Do not enlarge the amplitudes. An earlier pass was "too hectic and fast" and every
     duration was halved in response; what was wrong this time is regularity, not speed. --- */
  @property --cb-a { syntax:'<number>'; inherits:false; initial-value:0; }
  [data-voice]{
    transform-origin:50% 100%;
    --cb-a:0; --tk-rot:.5deg; --tk-sc:.006; --tk-ri:.25%; --tk-dur:.9s;
    transition:--cb-a .18s ease;
    /* Two animations at once, on DISJOINT properties: the breath only ever touches scale
       and the weight shift only translate and rotate, so they compose instead of the
       second one cancelling the first. */

     is one flat painting of a seated woman WITH HER DESK IN IT, and she has no mouth frames
     to carry the talking. So the lean does not read as a person leaning: it rotates the desk
     too, about a pivot in the middle of her, which swings her head one way and her chair the

     room -- so there the dialogue never overlaps the art. body.cb-phone-p (portrait) puts it

<script>
(function(){
  var root = document.getElementById('root');
  var actLabel = document.getElementById('actLabel');
  var gameHud = document.getElementById('gameHud');
  var SAVE_KEY = 'codebook_save_v1';

  var GAME = loadGame();
  // 2026-09-20: the data act was renumbered II -> III when theory became its own Act II.
  // Rename the two flags that carried the old number so existing saves keep their progress.
  //
  // This has to run AT MOST ONCE, and never on a save that was made after the new Act II
  // shipped. Both names it renames are live again: the new Act II sets `act2IntroSeen` when
  // its interlude plays and `actIIDone` when its four rooms are finished. Re-running the
  // migration on a current save therefore deleted them -- so the Act II interlude replayed
  // every single session, and Act III's never played at all.
  if (!GAME.flags.actRenumberMigrated){
    // Anything only the new Act II can produce means this save is already in the new world.
    var newWorld = ['predictionSlip','slipSealed','libraryDone','hallDone','workshopDone','seminarDone']
      .some(function(k){ return GAME.flags[k] !== undefined; });
    if (!newWorld){
      [['actIIDone', 'actIIIDone'], ['act2IntroSeen', 'act3IntroSeen']].forEach(function(pair){
        if (GAME.flags[pair[0]] !== undefined){
          if (GAME.flags[pair[1]] === undefined) GAME.flags[pair[1]] = GAME.flags[pair[0]];
          delete GAME.flags[pair[0]];
        }
      });
    }
    GAME.flags.actRenumberMigrated = true;
    saveGame();
  }
  // ROADMAP 8o split the lecturer off the Professor. Before that one flag meant both "the
  // Professor is in his office" and "the lecturer has left the theatre". On an old save the
  // second meaning has to be copied across once, or a lecture you already derailed starts
  // over with the silhouette back at the lectern.
  if (GAME.flags.profAtOffice && GAME.flags.lecturerGone === undefined){
    GAME.flags.lecturerGone = true;
    saveGame();
  }
  // Saves from before the four-room Act II redesign finished Act II via the old Survey Lab;
  // treat that as the whole act done so Act III doesn't re-lock on them.
  if (GAME.flags.surveyDone && !GAME.flags.h27issued){
    ['ethicsDone', 'fieldworkDone', 'mensaDone', 'actIIIDone', 'h27issued'].forEach(function(k){ GAME.flags[k] = true; });
    saveGame();
  }
  function loadGame(){
    // a standalone page (tools/*/standalone.py) seeds its save here, not through storage,
    // which an artifact's sandbox may refuse
    if (window.CODEBOOK_SEED) return JSON.parse(JSON.stringify(window.CODEBOOK_SEED));
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return { inventory: [], flags: {} };
  }
  function saveGame(){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(GAME)); } catch(e){}
  }
  // THE FOLDER HOLDS THE PAPERWORK (ROADMAP 8zf). The documents the research produces -- the
  // slip, the reading list, the written mechanism, the records, the result, the plaque, the
  // tag -- are filed into the folder (GAME.filed) instead of taking an inventory slot each, and
  // Look At on the folder lists them by divider. Rooms are untouched: hasItem() looks in both
  // places and removeItem() takes from both, so every existing check still sees them. Filing
  // only happens once the player HAS the folder (Act I's question is carried in the hand).
  // None of these is ever selected and used on something; that is what makes them fileable.
  var FILED = { slip:'THEORY', readinglist:'THEORY', mechanismcard:'THEORY', altpaper:'THEORY',
                h27form:'DATA', questionnaire:'DATA', qsatisfaction:'DATA', qpolicy:'DATA', qlectures:'DATA', qsupport:'DATA',
                examrecords:'DATA', cleandata:'DATA',
                resultprint:'RESULT', interpretation:'RESULT', contribution:'PAPER' };
  window.CODEBOOK_FILED = FILED;
  if (!GAME.filed) GAME.filed = [];
  function fileable(id){ return !!FILED[id] && GAME.inventory.indexOf('folder') !== -1; }
  // Form H-27 is gone: Act III fills the folder's own DATA divider instead (ROADMAP 8zl).
  ['inventory', 'filed'].forEach(function(k){ GAME[k] = GAME[k].filter(function(x){ return x !== 'h27form'; }); });
  // The response-rate printout became evidence you put on the Bureau counter (ROADMAP 8zl,
  // BU1), so it is used on something now and lives in the hand, not the folder.
  if (GAME.filed.indexOf('rateprint') !== -1){ GAME.filed = GAME.filed.filter(function(x){ return x !== 'rateprint'; }); GAME.inventory.push('rateprint'); }
  // Saves from before the folder took the paperwork: move what belongs in it.
  if (GAME.inventory.indexOf('folder') !== -1){
    GAME.inventory.slice().forEach(function(id){
      if (FILED[id]){ GAME.inventory = GAME.inventory.filter(function(x){ return x !== id; });
                      if (GAME.filed.indexOf(id) === -1) GAME.filed.push(id); }
    });
  }
  // The Survey Lab used to hand over four separate question cards; it now hands over one
  // stapled questionnaire (ROADMAP 8zk). Old saves: swap the four for the one.
  (function(){
    var Q = ['qsatisfaction', 'qpolicy', 'qlectures', 'qsupport'], had = false;
    ['inventory', 'filed'].forEach(function(k){
      GAME[k] = GAME[k].filter(function(x){ if (Q.indexOf(x) !== -1){ had = true; return false; } return true; });
    });
    if (had && GAME.filed.indexOf('questionnaire') === -1 && GAME.inventory.indexOf('questionnaire') === -1)
      (GAME.inventory.indexOf('folder') !== -1 ? GAME.filed : GAME.inventory).push('questionnaire');
  })();
  function hasItem(id){ return GAME.inventory.indexOf(id) !== -1 || GAME.filed.indexOf(id) !== -1; }
  function addItem(id){
    if (!hasItem(id)){
      if (fileable(id)) GAME.filed.push(id); else GAME.inventory.push(id);
      if (window.CODEBOOK_RECEIVE) window.CODEBOOK_RECEIVE(id);
    }
    saveGame();
  }
  function removeItem(id){
    GAME.inventory = GAME.inventory.filter(function(x){ return x !== id; });
    GAME.filed = GAME.filed.filter(function(x){ return x !== id; });
    saveGame();
  }
  window.CODEBOOK_IS_FILED = function(id){ return GAME.filed.indexOf(id) !== -1; };
  // What an act leaves behind (ROADMAP 8zf). When an act ends, the objects nothing later in
  // the game asks for go: each list below is exactly the items whose last use (Use on, or a
  // hasItem() check) is in that act or earlier -- re-derive it if a later room starts using
  // one of them. The acts gate each other, so an act cannot end with one of its puzzles open.
  var SPENT_AT = [
    ['corridorDone', ['bingocard']],
    ['slipSealed',   ['chalk', 'blackink', 'stepladder', 'blankcard', 'grandphrase', 'swedebook']],
    ['actIIIDone',   ['mug', 'likertdie', 'hourglass', 'usb', 'stamp', 'magnifyingglass', 'raffle']],
    ['actIVDone',    ['worksheets', 'altcard', 'enrolreg', 'pseudolist', 'redacted', 'ticket', 'rateprint', 'drawerlabel']]
  ];
  function tidyInventory(){
    var before = GAME.inventory.length;
    SPENT_AT.forEach(function(r){
      if (GAME.flags[r[0]]) GAME.inventory = GAME.inventory.filter(function(x){ return r[1].indexOf(x) === -1; });
    });
    return GAME.inventory.length !== before;
  }
  tidyInventory();
  function setFlag(k){ GAME.flags[k] = true; tidyInventory(); saveGame(); }
  function hasFlag(k){ return !!GAME.flags[k]; }
  function clearFlag(k){ delete GAME.flags[k]; saveGame(); }

  var ITEM_LABELS = {
    question: 'A Precisely Worded Question', raffle: 'Lunch Raffle Drum',
    pen: 'A Chewed Pen', mug: 'A Mug of Fossilized Coffee', likertdie: 'A Likert-Scale Die',
    hourglass: 'A Cracked Hourglass', usb: 'A USB Drive', stamp: 'A Rubber Stamp',
    magnifyingglass: 'A Magnifying Glass', rubberduck: 'A Rubber Duck (“Z?”)', znameplate: 'A Brass “Z” Nameplate',
    bingocard: 'A Bingo Card', citationslip: 'Fabricated Citation',
    folder: 'Research Folder — Question Exists', blackink: 'A Bottle of Black Ink',
    h27form: 'Application H-27', calendarpage: 'Torn Calendar Page (“Last 4 Weeks”)',
    reminders: 'Reminder Postcards', ballotboxwrapped: 'Ballot Box, Discreetly Bagged',
    consentplain: 'Plain-Language Consent Form', redacted: 'Redacted Questionnaires',
    altquestionnaire: 'Paper Questionnaire', wrongsample: 'The Tote-Bag Sample',
    pseudolist: 'Official University List (pseudonymised)', lunchbag: 'Brown Paper Lunch Bag',
    voucher: 'Free Lunch Voucher', scissors: 'Single-Concept Scissors',
    examrecords: 'Exam Records (by question, numbered)',
    enrolreg: 'Enrolment Register \u2014 First-Year Methods, Winter Term',
    stepladder: 'Ceremonial Hook Pole', blankcard: 'Blank Catalogue Card', mechanismcard: 'A Written Mechanism',
    nobelproc: 'Nobel Notification Procedure', grandphrase: 'An Extremely Grand Phrase',
    accentcard: 'A Laminated Card of Swedish (Approx.)', swedebook: 'Swedish for Nobel Laureates',
    altpaper: 'M\u00fcller &amp; Singh (2023)', chalk: 'A Stub of Chalk',
    worksheets: 'The Professor\u2019s Worked-Example Sheets',
    readinglist: 'Reading List (three sources that survived)',
    altcard: 'ALTERNATIVE EXPLANATION card',
    rateprint: 'A Scoreboard Tile Reading 75',
    cleandata: 'A Tape Reel Marked DATA',
    resultprint: 'The Interval, On A Brass Slide',
    interpretation: 'A Brass Plaque, Engraved By You',
    contribution: 'A Brass Tag (&ldquo;A Boundary Condition&rdquo;)',
    ticket: 'Queue Ticket A73',
    drawerlabel: 'A Typed Drawer Label',
    slip: 'Prediction Slip (Form P-1)',
    // The four survey questions, carried out of the Survey Lab one at a time as each is
    // made fit for human administration. Together they ARE the instrument.
    qsatisfaction: 'Q1 \u2014 Satisfaction (separated)',
    qpolicy:       'Q2 \u2014 Attendance Policy (neutral)',
    qlectures:     'Q3 \u2014 Lectures Missed (last 4 weeks)',
    qsupport:      'Q4 \u2014 Support (5-point scale)',
    questionnaire: 'The Questionnaire (four healthy questions)'
  };
  var ITEM_ICONS = {
    question: 'icon-question.webp', raffle: 'icon-raffledrum.webp',
    pen: 'icon-pen.webp', mug: 'icon-mug.webp', likertdie: 'icon-likertdie.webp',
    hourglass: 'icon-hourglass.webp', usb: 'icon-usb.webp', stamp: 'icon-stamp.webp',
    magnifyingglass: 'icon-cc-magnifyingglass.webp', rubberduck: 'icon-cc-duck.webp', znameplate: 'icon-cc-znameplate.webp',
    bingocard: 'icon-bingocard.webp', blackink: 'icon-blackink.webp', folder: 'icon-folder.webp',
    h27form: 'icon-h27form.webp', calendarpage: 'icon-calendarpage.webp',
    reminders: 'icon-reminderpostcards.webp', ballotboxwrapped: 'icon-ballotbox-wrapped.webp',
    consentplain: 'icon-consentform-plain.webp', redacted: 'icon-redactedbundle.webp',
    altquestionnaire: 'icon-altquestionnaire.webp', wrongsample: 'icon-wrongsamplelist.webp',
    pseudolist: 'icon-pseudostudentlist.webp', lunchbag: 'icon-lunchbag.webp',
    voucher: 'icon-incentivevoucher.webp', scissors: 'icon-scissors.webp',
    stepladder: 'icon-stepladder.webp', blankcard: 'icon-blankcard.webp', mechanismcard: 'icon-mechanismcard.webp',
    nobelproc: 'icon-nobelproc.webp', grandphrase: 'icon-grandphrase.webp', swedebook: 'icon-swedebook.webp',
    altpaper: 'icon-altpaper.webp', chalk: 'icon-chalk.webp',
    worksheets: 'icon-worksheets.webp', examrecords: 'icon-examrecords.webp',
    enrolreg: 'icon-enrolreg.webp', slip: 'icon-slip.webp',
    readinglist: 'icon-readinglist.webp', altcard: 'icon-altcard.webp',
    citationslip: 'icon-citationslip.webp',
    qsatisfaction: 'icon-qcard-satisfaction.webp', qpolicy: 'icon-qcard-policy.webp',
    qlectures: 'icon-qcard-lectures.webp', qsupport: 'icon-qcard-support.webp', questionnaire: 'icon-qcard-support.webp',
    rateprint: 'icon-rateprint.webp', cleandata: 'icon-cleandata.webp',
    resultprint: 'icon-resultprint.webp', interpretation: 'icon-interpretation.webp',
    contribution: 'icon-contribution.webp', ticket: 'icon-ticket.webp',
    drawerlabel: 'icon-drawerlabel.webp', accentcard: 'icon-accentcard.webp'
  };
  // ---------------------------------------------------------------------------
  // LOOK AT, in the inventory. One line per item, in the player's voice.
  //
  // Two rules, because this is also the game's cheapest hint channel and the first place
  // a stuck player looks. (1) The hint is about the OBJECT, never the puzzle: say what the
  // thing is for in the world and let the player find where. (2) An item carries its line
  // for the whole game, so nothing may say "you will need this in X" -- by the time it is
  // read the item may already be spent. Where a description genuinely has to change, the
  // entry is a function of GAME and keys off the flag its own puzzle sets.
  // ---------------------------------------------------------------------------
  var ITEM_LOOK = {
    qsatisfaction: 'A discharged patient chart. <i>&ldquo;How satisfied are you with your studies?&rdquo;</i> One concept, one question mark. Its twin was given its own bed.',
    qpolicy: 'A discharged patient chart. <i>&ldquo;How, if at all, has the new attendance policy affected your student life?&rdquo;</i> Nothing on it is trying to talk the respondent into anything.',
    qlectures: 'A discharged patient chart. <i>&ldquo;During the last four weeks, how many of your scheduled lectures did you not attend?&rdquo;</i> A torn calendar page is still stapled to it like a splint.',
    qsupport: 'A discharged patient chart. <i>&ldquo;I support the new attendance policy.&rdquo;</i> Five ordered boxes underneath, with a middle. Somebody has rubbed out a sixth.',
    questionnaire: 'Four discharged patient charts, stapled together by a nurse who meant it: satisfaction with your studies, the attendance policy (neutrally), lectures missed in the last four weeks, and a five-point scale with a middle. Fit for human administration.',
    question: 'Twelve words. It took a morning, a whirlpool and a man in a rocking chair to get it down to twelve. Everything else in this building is downstream of it.',
    raffle: 'A drum of folded paper slips that does not care who you are. That is its entire virtue.',
    pen: 'Someone chewed the cap flat. It still writes, which in this department makes it a scientific instrument.',
    mug: 'The coffee has been through several phases and settled on geology. There are at least four layers. You could date them.',
    likertdie: 'Five faces, STRONGLY DISAGREE through STRONGLY AGREE, with a middle. Rolling it is, technically, a way of obtaining an opinion.',
    hourglass: 'Seven seconds, cracked, running very slightly fast. Long enough to read a good question. Long enough to be an uncomfortable pause.',
    usb: 'Masking tape: <b>PROF G &mdash; BEATS &mdash; ON LOAN</b>. Underneath, in the Professor&rsquo;s handwriting, <i>FINAL_v23</i>. Two people&rsquo;s most treasured files on one stick.',
    stamp: 'APPROVED, backwards, in rubber. It does not check anything. That is not what stamps are for.',
    magnifyingglass: 'For the small print, which in this department is where the correlation quietly stops being a cause.',
    rubberduck: 'Somebody has written <b>Z?</b> on it in marker. It floats there, being the thing you have not measured.',
    znameplate: 'One letter on a brass plate, waiting for a door. Z is whatever is causing both of the other two.',
    bingocard: 'METHODOLOGICALLY SPEAKING &middot; AS WE SHALL SEE &middot; THE LITERATURE IS DIVIDED. Four in a row and you may, morally, leave.',
    citationslip: 'A flawless citation to a paper that does not exist. Volume, issue, page range. Everything except having happened.',
    // The card Professor G dictated after the rap battle. (Older saves may hold the grand
    // sentence from the time it was written behind Weber: the description is the quiet test,
    // one of them says *because* and one of them says *concerning*.)
    mechanismcard: function(G){
      var d = (G.flags && G.flags.predictionSlip) || {};
      if (!d.mechanism) return 'A catalogue card with a sentence on it, in your own handwriting.';
      return 'A catalogue card in your own handwriting, dictated by a man in a hoodie:<br><br><i>&ldquo;' + d.mechanism + '&rdquo;</i><br><br>' +
        (d.mechanismSound
          ? 'It says <b>because</b>. Somebody could go and find out that it is wrong, which is the entire point of it.'
          : 'It is beautifully put, and it would be just as true of rainfall. Nothing could happen that would embarrass it.');
    },
    folder: function(G){
      var f = G.flags, has = [];
      has.push(f.corridorDone ? 'A question. Precisely worded.' : 'Nothing yet. That is the problem.');
      if (f.slipSealed) has.push('A theory, and a sealed slip saying what it predicts.');
      if (f.actIIIDone) has.push('Data, from people who agreed to give it.');
      if (f.actIVDone) has.push('A result, with an interval around it.');
      if (f.writingDone) has.push('Four sentences, and a claim no larger than the evidence.');
      var filed = (G.filed || []), by = {};
      filed.forEach(function(id){ var d = FILED[id]; (by[d] = by[d] || []).push(ITEM_LABELS[id] || id); });
      var dividers = ['THEORY', 'DATA', 'RESULT', 'PAPER'].filter(function(d){ return by[d]; }).map(function(d){
        return '<b>' + d + ':</b> ' + by[d].join(' &middot; ');
      });
      return 'Cardboard, soft at the corners, RESEARCH PROJECT on the tab. Inside:<br><br>&mdash; ' + has.join('<br>&mdash; ') +
        (dividers.length ? '<br><br><i>Filed behind the dividers:</i><br>' + dividers.join('<br>') : '');
    },
    blackink: 'Opaque, permanent and cheap: the three properties required to make a name go away.',
    h27form: 'Four boxes, each belonging to a different office, none of which will take responsibility for the other three.',
    calendarpage: 'The last four weeks, torn out and kept. A question about &ldquo;recently&rdquo; is not a question. A question about these twenty-eight days is.',
    reminders: 'Pre-printed, pre-stamped, faintly guilt-inducing. People answer the second time who ignored the first.',
    ballotboxwrapped: 'A sealed box in a bin bag. Nobody can see what you put into it, which is the only reason anybody puts anything into it.',
    consentplain: 'One page. No sentence longer than a breath. It says what you will do with the answers and what happens if someone stops.',
    redacted: 'Names inked out, numbers written in. The same people, minus the part that could be used against them.',
    altquestionnaire: 'Paper. No login, no link, no reminder mail into a folder nobody opens. Whoever is in the room can fill it in.',
    wrongsample: 'Forty names, all collected at one event, all carrying the same tote bag. They will answer beautifully and mean nothing.',
    pseudolist: 'Everyone enrolled, with the names replaced by numbers. You can draw from it without knowing who you drew.',
    lunchbag: 'Brown paper, folded twice at the top. Big enough to hide what is in it from the person carrying it.',
    voucher: 'One free lunch. Enough to get an answer out of somebody; not enough to buy the answer you wanted.',
    scissors: 'Ceremonial, blunt, and labelled. They cut a question containing two ideas into a question containing one.',
    examrecords: 'Marks broken down question by question, numbered rather than named. Whatever attendance does, it does it unevenly across these.',
    enrolreg: 'Everyone on first-year Methods this term. Dull, printed, and the only honest answer to &ldquo;who is this about?&rdquo;',

  var recvQueue = [], recvBusy = false;
  function visible(el){ return el && el.offsetParent !== null && el.getBoundingClientRect().width > 0; }

  // Shared scaffolding for the Act II verb-grid rooms: markup, verb grid, inventory,
  // hotspots and sprites. Each room supplies only its hotspot table and a click handler.
  // ---------------------------------------------------------------------------
  // STANDING CHARACTERS: feet on the floor, height from the room's depth ramp.
  //
  // Sprites used to be placed as a raw box picked by eye, so the soles landed wherever the
  // rectangle's bottom happened to fall -- which is how characters ended up standing on
  // furniture. A sprite may instead give foot:[x%, y%], the point its soles rest on, and the
  // engine works out how tall a person is at that depth from the room's ramp.
  //
  //   depth: { backY:66, backH:32, frontY:98, frontH:58 }
  //     at y=66% of the scene a person is 32% of scene height; at y=98% they are 58%.
  //
  // The positioning wrapper is separate from the animated element because the talk/walk
  // animations drive `transform`, which would otherwise clobber the centring translate.
  // ---------------------------------------------------------------------------
  var DEPTH_DEFAULT = { backY:66, backH:32, frontY:98, frontH:58 };
  // 8-PRIORITY part 3: a walkbox. `floor:[backY, frontY]` gives the depth band a character
  // may stand in; `walk:[[xAtBack, xAtBack2], [xAtFront, xAtFront2]]` narrows it to the part
  // of the floor that is actually floor, interpolated with depth. Without the x bounds a
  // sprite can sit at a perfectly legal height and still be standing on a bookcase, which
  // is the bug this whole section started from.
  window.CODEBOOK_WALK_X = function(o, footY){
    if (!o || !o.walk) return null;
    var f = o.floor || [ (o.depth || {}).backY || 66, (o.depth || {}).frontY || 98 ];
    var t = (footY - f[0]) / (f[1] - f[0]);
    t = Math.max(0, Math.min(1, t));
    return [ o.walk[0][0] + t * (o.walk[1][0] - o.walk[0][0]),
             o.walk[0][1] + t * (o.walk[1][1] - o.walk[0][1]) ];
  };
  window.CODEBOOK_IN_WALKBOX = function(o, footX, footY){
    var f = o.floor; if (!f) return true;
    if (footY < f[0] - 0.5 || footY > f[1] + 0.5) return false;
    var x = window.CODEBOOK_WALK_X(o, footY);
    return !x || (footX >= x[0] - 0.5 && footX <= x[1] + 0.5);
  };

  window.CODEBOOK_DEPTH_H = function(depth, footY){
    var d = depth || DEPTH_DEFAULT;
    var t = (footY - d.backY) / (d.frontY - d.backY);
    t = Math.max(0, Math.min(1, t));
    return d.backH + t * (d.frontH - d.backH);
  };

      var tSrc = window.CODEBOOK_TOBI_SRC ? window.CODEBOOK_TOBI_SRC(tobiId) : 'sprite-tobi.webp';
      var tH = window.CODEBOOK_DEPTH_H(o.depth, tFoot[1]) * window.CODEBOOK_TOBI_POSE_H(tSrc);
      sprites += '<div class="cb-foot" id="' + p + '_foot_tobi" style="position:absolute;pointer-events:none;' +
        'left:' + tFoot[0] + '%;top:' + (tFoot[1] - tH) + '%;height:' + tH + '%;width:max-content;' +
        'transform:translateX(-50%);' + (tHere ? '' : 'display:none;') + '">' +
        '<div id="' + p + '_spr_tobi" data-voice="tobi" style="height:100%;filter:drop-shadow(0 4px 7px rgba(0,0,0,0.55));">' +
        '<img src="' + tSrc +
        '" alt="" style="height:100%;width:auto;display:block;"></div></div>';
      spots += '<button class="hotspot" data-id="tobi" data-label="Tobi" style="left:' + (tFoot[0] - 4.5) +
        '%;top:' + (tFoot[1] - tH) + '%;width:9%;height:' + tH + '%;' + (tHere ? '' : 'display:none;') + '"></button>';
    }
    return '' +
      '<div class="hud"><div class="nameplate">' + o.act + ' &middot; <b>' + o.title + '</b></div>' +
      '<div class="nameplate" id="' + p + '_h27" style="letter-spacing:.06em"></div></div>' +
      '<div class="room-columns"><div class="game-frame">' +
      '<div class="scene-wrap" id="' + p + '_sceneWrap">' +
      '<img id="' + p + '_bg" src="' + o.bg + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">' +
      sprites +
      // 8-PRIORITY part 4: an optional cut-out of whatever is in FRONT of the characters,
      // drawn over the sprite layer so someone can stand behind a counter instead of being
      // parked beside it. Pointer-transparent, so the hotspots underneath still work.
      (o.fg ? '<img class="scene-fg" src="' + o.fg + '" alt="" aria-hidden="true">' : '') +
      (o.overlay || '') + spots +
      '<div class="hint" id="' + p + '_hint"></div></div>' +
      '<div class="panel"><div class="speaker" id="' + p + '_speaker"></div><div class="line" id="' + p + '_line"></div><div class="choices" id="' + p + '_choices"></div></div>' +
      '</div><div class="side-panel">' +
      '<div class="sentence-line" id="' + p + '_sentenceLine">Look At&hellip;</div><div class="verb-grid" id="' + p + '_verbGrid"></div>' +
      '<div class="side-inv"><div class="side-inv-label" id="' + p + '_sideInvLabel">Inventory</div><div class="side-inv-grid" id="' + p + '_sideInv"></div></div>' +
      '<div class="side-inv-preview"><div class="side-inv-preview-img" id="' + p + '_sideInvPreviewImg"></div><div class="side-inv-preview-name" id="' + p + '_sideInvPreviewName"></div></div>' +
      '</div></div>';
  };

  window.CODEBOOK_ADV_ROOM = function(ctx, o){
    var p = o.p;
    function el(s){ return document.getElementById(p + '_' + s); }
    var speakerEl = el('speaker'), lineEl = el('line'), choicesEl = el('choices'), hintEl = el('hint');
    var sentenceEl = el('sentenceLine'), verbGrid = el('verbGrid'), wrap = el('sceneWrap'), h27El = el('h27');
    var VERBS = [{id:'lookat', label:'Look At'}, {id:'talkto', label:'Talk To'}, {id:'pickup', label:'Pick Up'}, {id:'use', label:'Use'}];
    var FALLBACK = {
      lookat: 'Nothing more to see there.',
      talkto: 'It has nothing to say to you.',
      pickup: 'That&rsquo;s not coming with you.',
      use: 'You can&rsquo;t think what you&rsquo;d use that for.'
    };
    var nouns = { tobi: 'Tobi' };
    // Phones do the obvious thing on a tap (ROADMAP 8zs). What is obvious is read off the room's
    // own handler: a block that answers Talk To on a character means talk, one that answers
    // Pick Up means take, otherwise look. Rooms can override with a hotspot's `primary`.
    (function(){
      var src = String(o.onClick || '');
      (o.hotspots || []).concat([{ id:'tobi' }]).forEach(function(h){
        var btn = wrap && wrap.querySelector('.hotspot[data-id="' + h.id + '"]'); if (!btn) return;
        var v = h.primary;
        if (!v){
          var i = src.indexOf("id === '" + h.id + "'"), blk = '';
          if (i >= 0){ var j = src.indexOf("if (id === '", i + 10); blk = src.slice(i, j < 0 ? i + 4000 : j); }
          var person = h.id === 'tobi' || !!document.getElementById(p + '_spr_' + h.id) && /data-voice/.test(document.getElementById(p + '_spr_' + h.id).outerHTML);
          v = (person && /'talkto'/.test(blk)) ? 'talkto' : /'pickup'/.test(blk) ? 'pickup' : 'lookat';
        }
        btn.dataset.primary = v;
        // simple controls (8zx): the verbs this hotspot answers, read off the same block
        if (!btn.dataset.verbs){
          var i2 = src.indexOf("id === '" + h.id + "'"), b2 = '';
          if (i2 >= 0){ var j2 = src.indexOf("if (id === '", i2 + 10); b2 = src.slice(i2, j2 < 0 ? i2 + 4000 : j2); }
          var vs = ['lookat'];
          if (/'talkto'/.test(b2) || h.id === 'tobi') vs.push('talkto');
          // "Take" only where taking actually hands you something
          if (/'pickup'/.test(b2) && /api\.give\(|ctx\.addItem\(/.test(b2)) vs.push('pickup');
          else if (/'pickup'/.test(b2)) vs.push('use');
          if (/'use'/.test(b2)) vs.push('use');
          if (h.primary && vs.indexOf(h.primary) === -1) vs.push(h.primary);
          btn.dataset.verbs = vs.join(' ');
        }
      });
    })();
    o.hotspots.forEach(function(h){ nouns[h.id] = h.noun || h.label; });
    // Any sprite that declares `roll` gets the castor idle. Declared on the sprite rather
    // than called per room so a character cannot be given a body in one room and forgotten
    // in the next -- which is exactly what had happened: CODEBOOK_KIRA_ROLL existed, was
    // correct, and was never once called, so KIRA stood still in all four of her rooms.
    (o.sprites || []).forEach(function(sp){
      if (sp.roll) window.CODEBOOK_KIRA_ROLL(p + '_foot_' + sp.id, p + '_spr_' + sp.id, sp.roll,
        wrap && wrap.querySelector('button.hotspot[data-id="' + sp.id + '"]'));
    });
    var verb = 'lookat', item = null, hovered = null, lastSaid = '';

    var api = {
      say: function(speaker, html, cls, audio){
        speakerEl.textContent = speaker;
        speakerEl.className = 'speaker' + (cls ? ' ' + cls : '');
        lineEl.innerHTML = html;
        if (audio){ window.CODEBOOK_PLAY_LINE_AUDIO(audio); }
        else if (lastSaid && html.indexOf(lastSaid) === 0){ window.CODEBOOK_PLAY_LINE_QUEUE(window.CODEBOOK_VO_CLIPS(html.slice(lastSaid.length)), true); }
        else { window.CODEBOOK_PLAY_LINE_QUEUE(window.CODEBOOK_VO_CLIPS(html)); }
        lastSaid = html;
      },
      clearChoices: function(){ choicesEl.innerHTML = ''; window.CODEBOOK_CHOICE_COUNT(choicesEl); },
      choice: function(html, fn){
        var b = document.createElement('button'); b.className = 'choice'; b.innerHTML = html;
        b.addEventListener('click', fn); choicesEl.appendChild(b);
        window.CODEBOOK_CHOICE_COUNT(choicesEl);
      },
      fallback: function(){ api.say('You', FALLBACK[verb] || FALLBACK.use); },
      tobi: function(verb){
        var rid = (window.CODEBOOK_TOBI_PREFIX || {})[p];
        if (verb === 'lookat'){
          api.say('You', 'Tobi, from Strategic Visibility, filming something over there. He has four badges on one lanyard and has never once asked what the question is.');
          return true;
        }
        if (verb === 'talkto'){
          api.clearChoices();
          api.say('Tobi', window.CODEBOOK_TOBI_LINE(rid));
          // HE asks, every time, and will not stop asking. You cannot agree on the first
          // three -- the only option is to say no, and he takes it well each time, which is
          // the joke. The give-in appears on the fourth ask, by which point refusing has
          // become more effort than posing.
          if (!ctx.hasFlag('tobiPosed')){
            var begs = ctx.GAME.flags.tobiBegs || 0;
            api.choice(TOBI_BEG[Math.min(begs, TOBI_BEG.length - 1)].ask, function(){
              api.clearChoices();
              var n = ctx.GAME.flags.tobiBegs || 0;
              var beat = TOBI_BEG[Math.min(n, TOBI_BEG.length - 1)];
              api.say('Tobi', beat.pitch);
              if (n >= 3) api.choice('&ldquo;&hellip;fine. <i>One</i> photograph.&rdquo;', function(){
                api.clearChoices();
                ctx.setFlag('tobiPosed');
                var bgEl = document.getElementById(p + '_bg');
                window.CODEBOOK_TOBI_POST(bgEl ? bgEl.getAttribute('src') : 'campus-map.webp', function(){
                  api.say('Tobi', 'He took eleven photographs. He has posted the one you are barely in.<br><br>&ldquo;Perfect. So good.&rdquo; <i>(the phone goes away, for the first time since you met him)</i> &ldquo;What did you need?&rdquo;<div class="state-line win">Tobi owes you a favour, and does not know it is one</div>', 'win');
                });
              });
              api.choice(beat.refuse, function(){
                api.clearChoices();
                ctx.GAME.flags.tobiBegs = n + 1; ctx.saveGame();
                api.say('Tobi', beat.taken);
              });
            });
          }
          api.choice('Show him a number', function(){
            api.clearChoices();
            if (!ctx.hasItem('resultprint')){ api.say('You', 'You have no number to show him yet. He would take one anyway.'); return; }
            ctx.setFlag('tobiSawResult');
            api.say('Tobi', '&ldquo;Okay so this says lectures make you smarter.&rdquo;<br><br>&ldquo;It says the gap is larger on worked-example questions among students who aren&rsquo;t already&mdash;&rdquo;<br><br>&ldquo;Lectures make you smarter. Amazing. Can I get you by the window?&rdquo;');
          });
          return true;
        }
        return false;
      },
      give: function(id){ ctx.addItem(id); api.sync(window.CODEBOOK_IS_FILED(id) ? 'folder' : id); },
      take: function(id){ ctx.removeItem(id); if (item === id) item = null; api.sync(); updateSentence(); },
      sync: function(lastId){
        window.CODEBOOK_RENDER_SIDE_INV(p + '_sideInv', ctx.GAME.inventory, lastId || null, p + '_sideInvLabel', p + '_sideInvPreviewImg', p + '_sideInvPreviewName',
          function(id){
            // Look at, in the inventory, answers in the room's own dialogue box.
            if (verb === 'lookat'){ api.say('You', window.CODEBOOK_ITEM_LOOK(id)); return; }
            setVerb('use'); item = id; api.sync(); updateSentence();
          }, item);
      },
      sprite: function(id, show){ var s = el('spr_' + id); if (s) s.style.display = show ? '' : 'none'; },
      spriteSrc: function(id, src){ var s = el('spr_' + id); if (s) s.src = src; },
      setBg: function(src){ window.CODEBOOK_SET_IMG(el('bg'), src); },
      h27: function(){ if (h27El) h27El.innerHTML = window.CODEBOOK_H27_HTML(); },
      el: el
    };

    function verbLabel(id){ return VERBS.filter(function(v){ return v.id === id; })[0].label; }
    function updateSentence(){
      if (verb === 'use' && item){
        sentenceEl.textContent = 'Use ' + (ITEM_LABELS[item] || item) + (hovered ? ' with ' + hovered : '…');
        return;
      }
      sentenceEl.textContent = hovered ? (verbLabel(verb) + ' ' + hovered) : (verbLabel(verb) + '…');
    }
    function setVerb(id){
      verb = id;
      verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === id); });
    }
    VERBS.forEach(function(v){
      var b = document.createElement('button');
      b.className = 'verb-btn' + (v.id === verb ? ' active' : '');
      b.textContent = v.label; b.dataset.verb = v.id;
      b.addEventListener('click', function(){
        setVerb(v.id);
        if (v.id !== 'use'){ item = null; api.sync(); }
        updateSentence();
      });
      verbGrid.appendChild(b);
    });

    wrap.querySelectorAll('.hotspot').forEach(function(hs){
      hs.addEventListener('mouseenter', function(){ hovered = nouns[hs.dataset.id]; updateSentence(); hintEl.textContent = hs.dataset.label; hintEl.classList.add('show'); });
      hs.addEventListener('mouseleave', function(){ hovered = null; updateSentence(); hintEl.classList.remove('show'); });
      hs.addEventListener('click', function(){
        // Tobi belongs to the scaffolding, not to any room, so he is answered here first
        // unless the room has chosen to handle him itself.
        if (hs.dataset.id === 'tobi' && api.tobi(verb)){ api.h27(); return; }
        var handled = o.onClick(hs.dataset.id, verb, verb === 'use' ? item : null, api);
        if (handled === false) api.fallback();
        api.h27();
      });
    });

    // Tobi's markup is baked into the room's html string at registration time, so his
    // visibility has to be settled on entry, not when the string was built.
    (function(){
      var rid = (window.CODEBOOK_TOBI_PREFIX || {})[p];
      if (!rid) return;
      var here = window.CODEBOOK_TOBI_HERE && window.CODEBOOK_TOBI_HERE(rid);
      var spr = document.getElementById(p + '_foot_tobi') || document.getElementById(p + '_spr_tobi');
      var hot = wrap.querySelector('.hotspot[data-id="tobi"]');
      if (spr) spr.style.display = here ? '' : 'none';
      var timg = spr && spr.querySelector('img');
      if (timg && window.CODEBOOK_TOBI_SRC){
        var nsrc = window.CODEBOOK_TOBI_SRC(rid);
        timg.src = nsrc;
        // The pose can change between visits, and a crouch is not as tall as a stand.
        var opts = (window.CODEBOOK_ROOM_OPTS || {})[p];
        if (opts && spr){
          var ff = opts.tobiFoot || [13, (opts.floor ? opts.floor[1] - 2 : 94)];
          var hh = window.CODEBOOK_DEPTH_H(opts.depth, ff[1]) * window.CODEBOOK_TOBI_POSE_H(nsrc);
          spr.style.top = (ff[1] - hh) + '%';
          spr.style.height = hh + '%';
        }
      }
      if (hot) hot.style.display = here ? '' : 'none';
    })();

    api.sync();
    updateSentence();
    api.h27();

    // Old saves sealed the slip before doSeal set h27issued itself; Act III's gate reads it.
    if (!ctx.hasFlag('h27issued') && ctx.hasFlag('slipSealed')) ctx.setFlag('h27issued');
    if (o.intro) api.say(o.intro[0], o.intro[1]);
    return api;
  };

  // Renders a room's own right-side inventory slot grid, in sync with the shared GAME.inventory.
  // labelId, if given, is a heading element that shows "Inventory" by default and swaps to the
  // hovered/focused item's name, since a bare icon grid doesn't say what anything actually is.
  // previewImgId/previewNameId, if given, are a larger preview image + caption that populate on
  // hover/focus and clear back to a placeholder otherwise, so the box's footprint never shifts.
  function INCOMING_NOW(id){ return !!(window.CODEBOOK_INCOMING && window.CODEBOOK_INCOMING[id]); }
  window.CODEBOOK_RENDER_SIDE_INV = function(containerId, inventory, lastAddedId, labelId, previewImgId, previewNameId, onSelect, selectedItemId){
    var el = document.getElementById(containerId);
    if (!el) return;
    var labelEl = labelId ? document.getElementById(labelId) : null;
    var defaultLabel = labelEl ? labelEl.textContent : '';
    var previewImgEl = previewImgId ? document.getElementById(previewImgId) : null;
    var previewNameEl = previewNameId ? document.getElementById(previewNameId) : null;
    function clearPreview(){
      if (previewImgEl) previewImgEl.innerHTML = '';
      if (previewNameEl) previewNameEl.textContent = '';
    }
    function showPreview(id, name){
      if (previewImgEl){
        previewImgEl.innerHTML = '';
        if (ITEM_ICONS[id]){
          var pimg = document.createElement('img');
          pimg.src = ITEM_ICONS[id]; pimg.alt = name;
          previewImgEl.appendChild(pimg);
        }
      }
      if (previewNameEl) previewNameEl.textContent = name;
    }
    el.innerHTML = '';
    // The folder always leads the inventory (ROADMAP 8zl): it is the game's progress bar.
    if (inventory.indexOf('folder') > 0) inventory = ['folder'].concat(inventory.filter(function(x){ return x !== 'folder'; }));
    if (!inventory.length){
      var empty = document.createElement('div');
      empty.className = 'side-inv-empty';
      empty.textContent = 'Empty';
      el.appendChild(empty);
      clearPreview();
      return;
    }
    inventory.forEach(function(id){
      var slot = document.createElement('div');
      slot.className = 'side-inv-slot filled' + (id === lastAddedId && !INCOMING_NOW(id) ? ' pop' : '') + (id === selectedItemId ? ' selected' : '') + (INCOMING_NOW(id) ? ' incoming' : '');
      slot.dataset.item = id;
      var name = ITEM_LABELS[id] || id;
      slot.title = name;
      slot.tabIndex = 0;
      if (onSelect){
        slot.style.cursor = 'pointer';
        slot.addEventListener('click', function(){ onSelect(id); });
      }
      if (labelEl){
        slot.addEventListener('mouseenter', function(){ labelEl.textContent = name; });
        slot.addEventListener('mouseleave', function(){ labelEl.textContent = defaultLabel; });
        slot.addEventListener('focus', function(){ labelEl.textContent = name; });
        slot.addEventListener('blur', function(){ labelEl.textContent = defaultLabel; });
      }
      if (previewImgEl || previewNameEl){
        slot.addEventListener('mouseenter', function(){ showPreview(id, name); });
        slot.addEventListener('mouseleave', clearPreview);
        slot.addEventListener('focus', function(){ showPreview(id, name); });
        slot.addEventListener('blur', clearPreview);
      }
      if (id === 'folder'){
        // Hovering (or focusing, or clicking) the folder opens it over the scene.
        var wrapId = containerId.replace(/_sideInv$/, '_sceneWrap');
        slot.addEventListener('mouseenter', function(){ window.CODEBOOK_FOLDER_PANEL(wrapId, true); });
        slot.addEventListener('mouseleave', function(){ window.CODEBOOK_FOLDER_PANEL(wrapId, false); });
        slot.addEventListener('focus', function(){ window.CODEBOOK_FOLDER_PANEL(wrapId, true); });
        slot.addEventListener('blur', function(){ window.CODEBOOK_FOLDER_PANEL(wrapId, false); });
        slot.addEventListener('click', function(){ window.CODEBOOK_FOLDER_PANEL(wrapId, true); });
      }
      if (ITEM_ICONS[id]){
        var img = document.createElement('img');
        img.src = ITEM_ICONS[id]; img.alt = name;
        slot.appendChild(img);
      } else {
        slot.textContent = name.slice(0, 2).toUpperCase();
      }
      el.appendChild(slot);
    });
  };

  // ---------------------------------------------------------------------------
  // THE FOLDER, OPEN (ROADMAP 8zl). Five dividers, one per act; each shows what is filed in
  // it, and the divider the current act is filling shows its four boxes.
  var DIVIDERS = [
    { key:'QUESTION', act:'Act I' }, { key:'THEORY', act:'Act II' }, { key:'DATA', act:'Act III' },
    { key:'RESULT', act:'Act IV' }, { key:'PAPER', act:'Act V' }
  ];
  function currentDivider(){
    var f = GAME.flags;
    if (!f.corridorDone) return 'QUESTION';
    if (!f.slipSealed) return 'THEORY';
    if (!f.actIIIDone) return 'DATA';
    if (!f.actIVDone) return 'RESULT';
    return 'PAPER';
  }
  function boxesFor(key){
    var d = GAME.flags.predictionSlip || {};
    var list = key === 'THEORY' ? SLIP_BOXES.map(function(b){ return [b.label, !!d[b.key]]; })
             : key === 'DATA'   ? H27_BOXES.map(function(b){ return [b.label, !!GAME.flags[b.flag]]; })
             : null;
    if (!list) return '';
    return '<div class="fp-boxes">' + list.map(function(b){
      return '<span class="' + (b[1] ? 'on' : '') + '">' + (b[1] ? '&#9745;' : '&#9744;') + ' ' + b[0] + '</span>';
    }).join('') + '</div>';
  }
  window.CODEBOOK_FOLDER_PANEL = function(wrapId, show){
    var wrap = document.getElementById(wrapId);
    var host = wrap || document.body;
    var el = document.getElementById('folderPanel');
    if (!show){ if (el) el.classList.remove('open'); return; }
    if (!el){ el = document.createElement('div'); el.id = 'folderPanel'; }
    if (el.parentNode !== host) host.appendChild(el);
    el.classList.toggle('fixed', !wrap);
    var cur = currentDivider();
    el.innerHTML = '<div class="fp-title">' + (ITEM_LABELS.folder || 'Research Folder') + '</div>' +
      DIVIDERS.map(function(dv){
        var items = GAME.filed.filter(function(id){ return FILED[id] === dv.key; });
        if (dv.key === 'QUESTION' && GAME.inventory.indexOf('question') !== -1) items.unshift('question');
        var isCur = dv.key === cur;
        return '<div class="fp-div' + (isCur ? ' cur' : '') + (items.length || isCur ? '' : ' empty') + '">' +
          '<div class="fp-tab">' + dv.key + '<small>' + dv.act + '</small></div>' +
          '<div class="fp-body">' + (items.length ? items.map(function(id){
            return '<span class="fp-item">' + (ITEM_ICONS[id] ? '<img src="' + ITEM_ICONS[id] + '" alt="">' : '') + (ITEM_LABELS[id] || id) + '</span>';
          }).join('') : '<span class="fp-none">' + (isCur ? 'Being filled now' : '&mdash;') + '</span>') +
          (isCur ? boxesFor(dv.key) : '') +
          // the numbers you gathered, to check anyone's analysis against (ROADMAP 8zp)
          (dv.key === 'DATA' && GAME.flags.actIIIDone ? '<div class="fp-boxes"><span class="on">Register 140 &middot; drawn 12 &middot; answered 9 (75%) &middot; linked by ID, not name</span></div>' : '') +
          '</div></div>';
      }).join('');
    requestAnimationFrame(function(){ el.classList.add('open'); });
    // touch screens have no mouseleave: the next tap anywhere closes it (8zs)
    if (!el.__tapClose){
      el.__tapClose = true;
      setTimeout(function(){
        document.addEventListener('pointerdown', function close(){
          el.classList.remove('open'); el.__tapClose = false;
          document.removeEventListener('pointerdown', close, true);
        }, true);
      }, 0);
    }
  };

  // Signboards (painted board + name) where the old map banners were; drawn only for rooms that can

  // branches. Only these three ever cross an act boundary, and only these three are
  // consulted by the outro; everything else is local colour a room may react to in
  // the moment. Three booleans = eight combinations, which can actually be tested.
  // See STORY.md, "Three flags, not a story tree".
  //
  //   theory_empty       the Prediction Slip was sealed at EVERYTHING EXPLAINS
  //                      EVERYTHING. Paid off in Act IV: the seal comes off and the
  //                      theory cannot tell the player anything about their result.
  //   analysis_p_hacked  the player left the Statistics Basement with the p = .049
  //                      banner instead of the test they promised. Paid off in the
  //                      Act IV audit and in the Act V abstract.
  //   claim_overstated   the LARGE (or EXTRA LARGE) implication was bought, or Feldstrom's
  //                      title or KIRA's verbs were accepted. The Writing Room can only be
  //                      finished by repairing the claim, and that clears the flag (WR1), so
  //                      it never reaches the outro in a normal game; the Reviewer 2 battle
  //                      still adds comments 12 and 38 for it, for old saves.
  //
  // Set with ctx.setFlag(CODEBOOK_FAIL.theoryEmpty) so the names stay in one place.
  // ---------------------------------------------------------------------------
  // The sentence Act II's Prediction Slip ends up carrying. Act III is built against it:
  // what the player promised to look for decides what they are forced to go and measure.
  // Until the theory act exists this returns the canonical version; once it ships, it reads
  // the sealed slip instead, and nothing else in the game has to change.
  window.CODEBOOK_HYPOTHESIS = function(){
    var slip = GAME.flags && GAME.flags.predictionSlip;
    if (slip && slip.hypothesis) return slip.hypothesis;

  // legacy Act IV/V placeholder rooms still chain off each other and are the exception —
  // they are marked LEGACY PLACEHOLDER and get this treatment when they are rebuilt.)
  var ACT_OPENS_WHEN = {
    1: function(GAME){ return true; },
    2: function(GAME){ return !!GAME.flags.corridorDone; },
    // The theory act is what releases H-27, so the data act cannot start before the

    3: function(GAME){ return !!GAME.flags.slipSealed || !!GAME.flags.h27issued; },

  // Swapping an <img>'s src empties it while the new file decodes, so a cross-fade that
  // restores opacity on the next frame shows the page background through it for a frame or
  // two -- the "blue flash" logged at the pond and in the Corridor. Decode first, then swap.
  window.CODEBOOK_SET_IMG = function(el, src, then){
    if (!el){ if (then) then(); return; }
    if (el.getAttribute('src') === src){ if (then) then(); return; }
    var probe = new Image(), fired = false;
    function go(){ if (fired) return; fired = true; el.src = src; if (then) then(); }
    probe.onload = go; probe.onerror = go;
    probe.src = src;
    if (probe.complete) go();            // already cached: no waiting at all
    else setTimeout(go, 400);            // never let a stalled decode strand the scene
  };

  // A cross-fade that never shows what is behind the picture. Fading a background <img>
  // out and back in exposes .scene-wrap's --wall (#2E4358) for the length of the fade,
  // which reads as a blue screen between the two paintings -- reported on the pond's swan.
  // The new art is decoded first, laid over the old one at opacity 0, faded in, and only
  // then written to the original element, so there is no frame without a picture in it.
  window.CODEBOOK_CROSSFADE_IMG = function(el, src, ms, then){
    if (!el){ if (then) then(); return; }
    if (el.getAttribute('src') === src){ if (then) then(); return; }
    var parent = el.parentNode;
    if (!parent){ window.CODEBOOK_SET_IMG(el, src, then); return; }
    ms = (ms == null) ? 420 : ms;
    var over = document.createElement('img');
    over.alt = '';
    over.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;' +
      'display:block;z-index:1;opacity:0;pointer-events:none;transition:opacity ' + ms + 'ms ease;';
    var done = false, started = false;
    function finish(){
      if (done) return; done = true;
      el.src = src;
      if (over.parentNode) over.parentNode.removeChild(over);
      if (then) then();
    }
    function start(){
      if (started) return; started = true;
      over.src = src;
      parent.insertBefore(over, el.nextSibling);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ over.style.opacity = '1'; }); });
      setTimeout(finish, ms + 90);
    }
    var probe = new Image();
    probe.onload = start; probe.onerror = start;
    probe.src = src;
    if (probe.complete) start();
    else setTimeout(start, 400);          // never let a stalled decode strand the scene
  };
