<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<title>The Secret of the Lost Codebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;700&display=swap">
<style>
  :root{
    --shell:#241A12;
    --wall:#2E4358;
    --wainscot:#16222C;
    --wainscot-light:#22323F;
    --floor-top:#8B5A34;
    --floor-bot:#5C3A20;
    --wood:#6B4226;
    --wood-dark:#3B2110;
    --wood-light:#9A6A45;
    --mustard:#E0A83E;
    --mustard-deep:#C68A2E;
    --cream:#EDF0F2;
    --cream-dim:#C3CBD1;
    --water:#557E70;
    --water-light:#8DBCA9;
    --wrong:#C0552F;
    --correct:#4F7A4E;
    --fake:#7A5A8A;
    --kira:#4A8B92;
    --ink:#2E2118;
    --ink-soft:#5C4A3A;
    --shadow: 0 18px 50px rgba(0,0,0,0.45);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--shell); color:var(--cream);
    font-family:'Source Sans 3', system-ui, sans-serif;
    height:100dvh; display:flex; justify-content:center; padding:24px; overflow-y:auto;
  }
  .stage{ width:100%; max-width:1800px; height:100%; min-height:0; display:flex; flex-direction:column; gap:12px; }
  #root{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  #root > .hud{ flex:0 0 auto; }
  #root > .game-frame, #root > .room-columns{ flex:1 1 auto; min-height:0; }

  /* ---- persistent top HUD ---- */
  .gamehud{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    padding-bottom:4px;
  }
  .gametitle{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; color:var(--cream);
    display:flex; align-items:center; gap:10px;
  }
  .gametitle .sub{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--cream-dim); }

  /* ---- room nameplate + local hud row (reused inside rooms) ---- */
  .hud{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .nameplate{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--cream-dim); border:1px solid rgba(240,228,200,0.25); border-radius:3px; padding:6px 12px;
  }
  .nameplate b{color:var(--cream); font-weight:700;}
  .backbtn{
    all:unset; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--cream-dim); border:1px solid rgba(240,228,200,0.25); border-radius:3px; padding:6px 12px;
  }
  .backbtn:hover{ color:var(--cream); border-color:rgba(240,228,200,0.5); }

  /* ---- shared game-frame / scene / panel chrome ---- */
  .game-frame{
    border-radius:6px; overflow:hidden; box-shadow:var(--shadow);
    border:6px solid var(--shell); outline:1px solid rgba(240,228,200,0.15);
    display:flex; flex-direction:column; min-height:0; background:var(--shell);
  }
  .scene-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:var(--wall); flex:0 0 auto; max-height:90%; min-height:0; overflow:hidden; }
  .scene-wrap svg{ display:block; width:100%; height:100%; }
  .scene-wrap svg.passthrough{ pointer-events:none; }

  .hotspot{
    all:unset; position:absolute; cursor:pointer;
    border:1.5px dashed transparent; border-radius:3px;
    transition:border-color .1s, background .1s;
  }
  .hotspot:hover, .hotspot:focus-visible{ border-color:rgba(240,228,200,0.85); background:rgba(240,228,200,0.08); outline:none; }
  .hotspot.solved{ border-color:var(--correct); background:rgba(79,122,78,0.15); }

  .hint{
    position:absolute; left:12px; bottom:10px;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.04em;
    color:var(--cream); background:rgba(0,0,0,0.6); padding:6px 10px; border-radius:2px;
    opacity:0; transition:opacity .1s; pointer-events:none; max-width:75%;
  }
  .hint.show{ opacity:1; }

  .panel{
    background:var(--cream); color:var(--ink);
    padding:16px 26px; display:flex; flex-direction:column; gap:10px;
    border-top:3px solid var(--mustard-deep);
    min-height:70px; max-height:20%; flex:1 1 auto; overflow-y:auto;
  }
  /* ---- Monkey-Island-style in-scene caption (narration/speaker text overlaid on the art) ---- */
  .scene-caption{
    position:absolute; left:50%; top:3%; transform:translateX(-50%);
    width:min(640px, 72%); max-width:92%;
    background:rgba(237,240,242,0.99); color:var(--ink);
    border-radius:8px; padding:10px 18px 12px;
    box-shadow:0 10px 26px rgba(0,0,0,0.5); border:1px solid rgba(0,0,0,0.12);
    pointer-events:none; z-index:20;
    opacity:1; transition:opacity .18s ease;
  }
  .scene-caption.caption-dismissed{ opacity:0; }
  .scene-caption .speaker{ margin-bottom:2px; }
  .scene-caption .line{ font-size:clamp(.92rem, 1.6vw, 1.08rem); }
  .scene-caption::after{
    content:''; position:absolute; left:50%; margin-left:-11px; width:0; height:0;
    border-left:11px solid transparent; border-right:11px solid transparent;
  }
  .scene-caption.tail-down::after{ top:100%; border-top:14px solid rgba(237,240,242,0.99); }
  .scene-caption.tail-up::after{ bottom:100%; border-bottom:14px solid rgba(237,240,242,0.99); }
  /* narration (scene descriptions) is not speech: no bubble tail, quieter styling */
  .scene-caption.narration::after{ display:none; }
  .scene-caption.narration{ background:rgba(18,14,10,0.82); border-color:rgba(240,228,200,0.28); color:#F0E4C8; }
  .scene-caption.narration .speaker{ color:rgba(240,228,200,0.6); }
  .scene-caption.narration .line i{ color:rgba(240,228,200,0.75); }
  .scene-caption.narration .line b{ color:rgba(240,228,200,0.85); }
  @media (max-width:760px){
    .scene-caption{ width:92%; top:2%; }
  }
  .speaker{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--wrong); min-height:1em; }
  .speaker.win{ color:var(--correct); }
  .speaker.kira{ color:var(--kira); }
  .line{ font-family:'Fraunces', Georgia, serif; font-size:clamp(1rem, 2vw, 1.2rem); line-height:1.5; text-wrap:balance; }
  .line i{ color:var(--ink-soft); }
  .line b{ font-family:'JetBrains Mono', monospace; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .choices{ display:flex; flex-direction:column; gap:8px; }
  button.choice{
    all:unset; cursor:pointer; background:#F7F9FA;
    border:1px solid var(--cream-dim); border-radius:3px;
    padding:12px 16px; font-family:'Source Sans 3', sans-serif; font-size:.95rem; line-height:1.4; color:var(--ink);
    transition:border-color .12s, transform .12s, background .12s;
  }
  /* Tobi's photo moment: a flash, then the post. The player is never shown in this game,
     which makes the shot funnier -- he has framed it almost entirely on the window. */
  .cb-flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:9998;
    animation:cb-flash-anim .5s ease-out forwards; }
  @keyframes cb-flash-anim{ 0%{opacity:0} 8%{opacity:1} 100%{opacity:0} }
  .cb-post-wrap{ position:fixed; inset:0; background:rgba(8,6,4,.72); z-index:9999;
    display:flex; align-items:center; justify-content:center; opacity:0; animation:cb-post-in .45s ease .35s forwards; }
  @keyframes cb-post-in{ to{opacity:1} }
  .cb-post{ width:min(340px,80vw); background:#fff; border-radius:12px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.6); font-family:'Helvetica Neue',Arial,sans-serif; color:#111;
    transform:translateY(14px); animation:cb-post-rise .45s ease .35s forwards; }
  @keyframes cb-post-rise{ to{transform:translateY(0)} }
  .cb-post .hd{ display:flex; align-items:center; gap:8px; padding:9px 11px; font-size:13px; font-weight:600; }
  .cb-post .av{ width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#f9a,#c4f,#5bf); }
  .cb-post .ph{ position:relative; aspect-ratio:1/1; overflow:hidden; background:#222; }
  .cb-post .ph img{ position:absolute; width:190%; height:190%; left:-58%; top:-34%; object-fit:cover;
    transform:rotate(-6deg); filter:brightness(1.12) saturate(1.1); }
  .cb-post .blob{ position:absolute; right:4%; bottom:-6%; width:34%; height:62%;
    background:#1b1510; border-radius:46% 46% 22% 22%; filter:blur(1.5px); opacity:.88; }
  .cb-post .body{ padding:9px 12px 14px; font-size:12.5px; line-height:1.45; }
  .cb-post .likes{ font-weight:700; margin-bottom:3px; }
  .cb-post .tags{ color:#3a6ea8; }
  .cb-post .dismiss{ display:block; width:100%; border:0; border-top:1px solid #eee; background:#fafafa;
    padding:10px; font:600 12px/1 'Helvetica Neue',Arial,sans-serif; color:#666; cursor:pointer; }
  .slip{ background:#E9E2C8; color:#2A1D10; border:2px solid #6B4226; border-radius:5px;
    padding:.7em .8em; font-family:Fraunces,Georgia,serif; box-shadow:0 6px 16px rgba(0,0,0,.45); }
  .slip-hd{ font-family:"JetBrains Mono",monospace; font-size:.72em; letter-spacing:.09em; font-weight:700;
    border-bottom:1px solid #B9A67F; padding-bottom:.3em; margin-bottom:.45em; }
  .slip-seal{ background:#7A2A20; color:#F3E7C8; padding:.05em .4em; border-radius:2px; margin-left:.4em; }
  .slip-row{ display:flex; gap:.6em; margin:.3em 0; align-items:baseline; }
  .slip-k{ font-family:"JetBrains Mono",monospace; font-size:.68em; letter-spacing:.06em; min-width:14em; }
  .slip-v{ flex:1; font-size:.92em; }
  .slip-v.weak{ color:#8A5A2A; font-style:italic; }
  .slip-foot{ margin-top:.5em; border-top:1px solid #B9A67F; padding-top:.35em;
    font-family:"JetBrains Mono",monospace; font-size:.7em; letter-spacing:.07em; }
  .slip-foot .c0{ color:#2F7D3A; } .slip-foot .c1{ color:#4A7A2A; }
  .slip-foot .c2{ color:#B07A18; } .slip-foot .c3{ color:#B3541E; } .slip-foot .c4{ color:#B3261E; }
  .slip-fine{ font-size:.62em; opacity:.6; margin-top:.2em; font-style:italic; }
  button.choice:hover{ border-color:var(--wainscot-light); background:#fff; }
  button.choice:focus-visible{ outline:2px solid var(--wainscot); outline-offset:2px; }
  button.choice:active{ transform:scale(0.99); }
  button.choice:disabled{ opacity:0.4; cursor:default; }
  button.choice .star{ color:var(--mustard-deep); font-weight:700; }
  .state-line{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:2px 0; }
  .state-line.win{ color:var(--correct); }
  .state-line.lose{ color:var(--wrong); }

  .continuebar{ display:flex; justify-content:flex-end; margin-top:4px; }
  button.continue{
    all:unset; cursor:pointer; background:var(--mustard); color:var(--ink); font-weight:700;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    padding:10px 18px; border-radius:3px;
  }
  button.continue:hover{ background:var(--mustard-deep); }

  /* ---- map screen: blueprint dossier map ---- */
  .intro{ font-family:'Fraunces',serif; font-size:1.02rem; line-height:1.6; color:var(--cream-dim); max-width:70ch; }
  .map-wrap{
    position:relative; width:100%; aspect-ratio:1672/941;
    border-radius:8px; overflow:hidden; box-shadow:var(--shadow);
    border:6px solid var(--shell); outline:1px solid rgba(160,210,230,0.15);
    background:#0A1826;
  }
  .map-wrap{ container-type:inline-size; }
  .map-sign{ background:url('map-sign.webp') center/100% 100% no-repeat; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); padding:0 .4em; box-sizing:border-box; }
  .map-sign{ position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none;
    font-family:'Fraunces', Georgia, serif; font-weight:600; color:#3b2414; font-size:1.25cqw; line-height:1.05;
    text-shadow:0 1px 0 rgba(255,245,220,.5); }
  .map-sign .map-stamp{ display:inline-block; margin-top:.15em; padding:.05em .3em; font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:.85em; letter-spacing:.08em; color:#b3261e; border:.14em solid #b3261e; border-radius:.15em; transform:rotate(-8deg); opacity:.9; }
  .map-wrap svg{ display:block; width:100%; height:100%; pointer-events:none; }
  button.campus-hotspot{
    all:unset; position:absolute; cursor:pointer; box-sizing:border-box;
    border-radius:8px; border:2px solid transparent; background:transparent;
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  button.campus-hotspot:disabled{ cursor:default; }
  .campus-hotspot.avail:hover, .campus-hotspot.avail:focus-visible{
    border-color:var(--mustard); background:rgba(224,168,62,0.10); box-shadow:0 0 16px rgba(224,168,62,0.25); outline:none;
  }
  .campus-hotspot.done:hover, .campus-hotspot.done:focus-visible{
    border-color:var(--correct); background:rgba(79,122,78,0.10); outline:none;
  }
  .campus-hotspot.locked:hover, .campus-hotspot.locked:focus-visible{
    border-color:rgba(240,228,200,0.3); background:rgba(240,228,200,0.05); outline:none;
  }

  /* ---- ambient scene animation ---- */
  @keyframes idleBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  @keyframes idleBobSlow{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2.5px); } }
  @keyframes blinkShow{ 0%,92%,100%{ opacity:0; } 95%{ opacity:1; } }
  @keyframes blinkHide{ 0%,92%,100%{ opacity:1; } 95%{ opacity:0; } }
  @keyframes lampSwing{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
  @keyframes wiggle{ 0%,100%{ transform:rotate(0deg) translateY(0); } 25%{ transform:rotate(-4deg) translateY(-2px); } 75%{ transform:rotate(4deg) translateY(-2px); } }
  @keyframes pulseGlow{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }
  @keyframes steamRise{ 0%{ transform:translateY(0) scale(1); opacity:0; } 15%{ opacity:0.55; } 85%{ opacity:0.25; } 100%{ transform:translateY(-22px) scale(1.3); opacity:0; } }
  @keyframes basementFlicker{ 0%,100%{ opacity:0.35; } 48%{ opacity:0.3; } 50%{ opacity:0.14; } 52%{ opacity:0.35; } 53%{ opacity:0.1; } 55%{ opacity:0.35; } }
  .anim-bob{ animation:idleBob 4.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  .anim-bob-slow{ animation:idleBobSlow 5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  .anim-blink{ animation:blinkShow 5s ease-in-out infinite; }
  .anim-blink-hide{ animation:blinkHide 4.6s ease-in-out infinite; }
  .anim-swing{ animation:lampSwing 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0%; }
  .anim-wiggle{ animation:wiggle 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  .anim-pulse{ animation:pulseGlow 2s ease-in-out infinite; }
  .anim-steam{ animation:steamRise 3.2s ease-in infinite; transform-box:fill-box; }
  .anim-flicker{ animation:basementFlicker 7s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .anim-bob,.anim-bob-slow,.anim-blink,.anim-blink-hide,.anim-swing,.anim-wiggle,.anim-pulse,.anim-steam,.anim-flicker{ animation:none; }
  }

  /* ---- professor: stand up + walk cycle ---- */
  #wp_professor{ transition:opacity .5s ease; }
  #wp_professorWalk{ opacity:0; transition:opacity .5s ease; }
  #wp_legL, #wp_legR{ transform-box:fill-box; transform-origin:50% 0%; }
  @keyframes legSwingL{ 0%,100%{ transform:rotate(-16deg); } 50%{ transform:rotate(16deg); } }
  @keyframes legSwingR{ 0%,100%{ transform:rotate(16deg); } 50%{ transform:rotate(-16deg); } }
  #wp_professorWalk.walking #wp_legL{ animation:legSwingL .55s ease-in-out infinite; }
  #wp_professorWalk.walking #wp_legR{ animation:legSwingR .55s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    #wp_professorWalk{ display:none !important; }
  }

  /* ---- kira: roll across the room ---- */
  @keyframes kiraRollBounce{ 0%,100%{ transform:translateY(0) rotate(0deg); } 25%{ transform:translateY(-5px) rotate(-3deg); } 50%{ transform:translateY(0) rotate(0deg); } 75%{ transform:translateY(-5px) rotate(3deg); } }
  .kira-rolling{ animation:kiraRollBounce .5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @media (prefers-reduced-motion: reduce){
    .kira-rolling{ animation:none; }
  }

  /* ---- player avatar: click-to-walk, with size-by-depth ---- */
  .pc-avatar{ position:absolute; width:7.4%; aspect-ratio:60/92; transform-origin:50% 100%; z-index:15; pointer-events:none; }
  .pc-flip{ width:100%; height:100%; }
  .pc-avatar.facing-left .pc-flip{ transform:scaleX(-1); }
  .pc-avatar svg{ width:100%; height:100%; display:block; overflow:visible; }
  .pc-avatar .pc-leg-l, .pc-avatar .pc-leg-r{ transform-box:fill-box; transform-origin:50% 0%; }
  .pc-avatar.walking .pc-leg-l{ animation:legSwingL .42s ease-in-out infinite; }
  .pc-avatar.walking .pc-leg-r{ animation:legSwingR .42s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .pc-avatar{ transition:none !important; }
    .pc-avatar.walking .pc-leg-l, .pc-avatar.walking .pc-leg-r{ animation:none; }
  }

  /* ---- shared progress pips (used by several rooms) ---- */
  .pips{ display:flex; gap:5px; }
  .pip{ width:13px; height:13px; border-radius:50%; background:rgba(240,228,200,0.12); border:2px solid rgba(240,228,200,0.3); }
  .pip.full{ background:var(--correct); border-color:var(--correct); }

  /* ---- the seven-second office ---- */
  .bubble-hud{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--cream-dim); }
  .drops{display:flex; gap:5px;}
  .drop{width:13px; height:13px;}
  .drop circle{fill:rgba(240,228,200,0.15); stroke:rgba(240,228,200,0.35); stroke-width:1.5;}
  .drop.full circle{fill:var(--mustard); stroke:var(--mustard);}
  .room-columns{ display:flex; gap:12px; align-items:stretch; min-height:0; }
  .room-columns .game-frame{ flex:1 1 auto; min-width:0; min-height:0; }
  .side-panel{
    flex:0 0 220px;
    background:var(--shell); border:1px solid rgba(240,228,200,0.18); border-radius:6px;
    padding:12px; display:flex; flex-direction:column; gap:10px; align-self:stretch;
  }
  .sentence-line{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--mustard); height:3.6em; overflow:hidden; padding-bottom:10px; border-bottom:1px dashed rgba(240,228,200,0.18); }
  .side-inv{ display:flex; flex-direction:column; gap:8px; padding-top:10px; border-top:1px dashed rgba(240,228,200,0.18); }
  .side-inv-label{ font-family:'JetBrains Mono', monospace; font-size:12px; line-height:1.35; letter-spacing:.08em; text-transform:uppercase; color:var(--cream-dim); height:2.7em; overflow:hidden; }
  .side-inv-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .side-inv-slot{
    aspect-ratio:1; border-radius:4px; display:flex; align-items:center; justify-content:center;
    background:rgba(240,228,200,0.05); border:1.5px dashed rgba(240,228,200,0.18);
  }
  .side-inv-slot.filled{ background:var(--cream); color:var(--ink); font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px; border:2px solid var(--mustard-deep); border-style:solid; cursor:default; transition:box-shadow .12s, border-color .12s; }
  .side-inv-slot.filled:hover, .side-inv-slot.filled:focus-visible{ border-color:var(--mustard); box-shadow:0 0 0 3px rgba(224,168,62,0.28); outline:none; }
  .side-inv-slot.filled.selected{ border-color:var(--correct); box-shadow:0 0 0 3px rgba(79,122,78,0.32); }
  .side-inv-label{ transition:color .1s; }
  .side-inv-slot img{ width:72%; height:72%; object-fit:contain; }
  .side-inv-empty{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:rgba(240,228,200,0.3); letter-spacing:.04em; text-transform:uppercase; grid-column:1/-1; text-align:center; padding:8px 0; }
  @keyframes slotPop{ 0%{ transform:scale(0.3); opacity:0; } 55%{ transform:scale(1.18); opacity:1; } 75%{ transform:scale(0.94); } 100%{ transform:scale(1); } }
  .side-inv-slot.pop{ animation:slotPop .5s cubic-bezier(.34,1.56,.64,1); }
  @media (prefers-reduced-motion: reduce){ .side-inv-slot.pop{ animation:none; } }

  .side-inv-preview{
    margin-top:auto; padding-top:12px; border-top:1px dashed rgba(240,228,200,0.18);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .side-inv-preview-img{
    width:100%; max-width:112px; aspect-ratio:1; border-radius:6px;
    display:flex; align-items:center; justify-content:center;

  // Renders a room's own right-side inventory slot grid, in sync with the shared GAME.inventory.
  // labelId, if given, is a heading element that shows "Inventory" by default and swaps to the
  // hovered/focused item's name, since a bare icon grid doesn't say what anything actually is.
  // previewImgId/previewNameId, if given, are a larger preview image + caption that populate on
  // hover/focus and clear back to a placeholder otherwise, so the box's footprint never shifts.
  window.CODEBOOK_RENDER_SIDE_INV = function(containerId, inventory, lastAddedId, labelId, previewImgId, previewNameId, onSelect, selectedItemId){
    var el = document.getElementById(containerId);
    if (!el) return;
    var labelEl = labelId ? document.getElementById(labelId) : null;
    var defaultLabel = labelEl ? labelEl.textContent : '';
    var previewImgEl = previewImgId ? document.getElementById(previewImgId) : null;
    var previewNameEl = previewNameId ? document.getElementById(previewNameId) : null;
    function clearPreview(){
      if (previewImgEl) previewImgEl.innerHTML = '';
      if (previewNameEl) previewNameEl.textContent = '';
    }
    function showPreview(id, name){
      if (previewImgEl){
        previewImgEl.innerHTML = '';
        if (ITEM_ICONS[id]){
          var pimg = document.createElement('img');
          pimg.src = ITEM_ICONS[id]; pimg.alt = name;
          previewImgEl.appendChild(pimg);
        }
      }
      if (previewNameEl) previewNameEl.textContent = name;
    }
    el.innerHTML = '';
    if (!inventory.length){
      var empty = document.createElement('div');
      empty.className = 'side-inv-empty';
      empty.textContent = 'Empty';
      el.appendChild(empty);
      clearPreview();
      return;
    }
    inventory.forEach(function(id){
      var slot = document.createElement('div');
      slot.className = 'side-inv-slot filled' + (id === lastAddedId ? ' pop' : '') + (id === selectedItemId ? ' selected' : '');
      slot.dataset.item = id;
      var name = ITEM_LABELS[id] || id;
      slot.title = name;
      slot.tabIndex = 0;
      if (onSelect){
        slot.style.cursor = 'pointer';
        slot.addEventListener('click', function(){ onSelect(id); });
      }
      if (labelEl){
        slot.addEventListener('mouseenter', function(){ labelEl.textContent = name; });
        slot.addEventListener('mouseleave', function(){ labelEl.textContent = defaultLabel; });
        slot.addEventListener('focus', function(){ labelEl.textContent = name; });
        slot.addEventListener('blur', function(){ labelEl.textContent = defaultLabel; });
      }
      if (previewImgEl || previewNameEl){
        slot.addEventListener('mouseenter', function(){ showPreview(id, name); });
        slot.addEventListener('mouseleave', clearPreview);
        slot.addEventListener('focus', function(){ showPreview(id, name); });
        slot.addEventListener('blur', clearPreview);
      }
      if (ITEM_ICONS[id]){
        var img = document.createElement('img');
        img.src = ITEM_ICONS[id]; img.alt = name;
        slot.appendChild(img);
      } else {
        slot.textContent = name.slice(0, 2).toUpperCase();
      }
      el.appendChild(slot);
    });
  };

  // THE THREE DURABLE FAILURES
  //
  // The game offers a lot of "you did the wrong thing and it comes back later"

  // consulted by the outro; everything else is local colour a room may react to in
  // the moment. Three booleans = eight combinations, which can actually be tested.
  // See STORY.md, "Three flags, not a story tree".
  //
  //   theory_empty       the Prediction Slip was sealed at EVERYTHING EXPLAINS
  //                      EVERYTHING. Paid off in Act IV: the seal comes off and the
  //                      theory cannot tell the player anything about their result.
  //   analysis_p_hacked  the player left the Statistics Basement with the p = .049
  //                      banner instead of the test they promised. Paid off in the

  //                      KIRA's verbs survived into the submitted paper. Paid off in
  //                      the outro: Reviewer 2's comment 17 lands undefended.
  //
  // Set with ctx.setFlag(CODEBOOK_FAIL.theoryEmpty) so the names stay in one place.
  // ---------------------------------------------------------------------------
  // The sentence Act II's Prediction Slip ends up carrying. Act III is built against it:
  // what the player promised to look for decides what they are forced to go and measure.
  // Until the theory act exists this returns the canonical version; once it ships, it reads
  // the sealed slip instead, and nothing else in the game has to change.
  window.CODEBOOK_HYPOTHESIS = function(){
    var slip = GAME.flags && GAME.flags.predictionSlip;

  // legacy Act IV/V placeholder rooms still chain off each other and are the exception —
  // they are marked LEGACY PLACEHOLDER and get this treatment when they are rebuilt.)
  var ACT_OPENS_WHEN = {
    1: function(GAME){ return true; },

    // The theory act is what releases H-27, so the data act cannot start before the

    3: function(GAME){ return !!GAME.flags.slipSealed || !!GAME.flags.h27issued; },

  // restores opacity on the next frame shows the page background through it for a frame or
  // two -- the "blue flash" logged at the pond and in the Corridor. Decode first, then swap.
  window.CODEBOOK_SET_IMG = function(el, src, then){
    if (!el){ if (then) then(); return; }
    if (el.getAttribute('src') === src){ if (then) then(); return; }
    var probe = new Image(), fired = false;
    function go(){ if (fired) return; fired = true; el.src = src; if (then) then(); }
    probe.onload = go; probe.onerror = go;
    probe.src = src;
    if (probe.complete) go();            // already cached: no waiting at all
    else setTimeout(go, 400);            // never let a stalled decode strand the scene
  };

  // and enterRoom()/showMap() call CODEBOOK_STOP_ROOM_MUSIC() on every transition

  window.CODEBOOK_STOP_ROOM_MUSIC = function(){

    currentRoomMusic = null;
    var steps = 10, i = 0, startVol = a.volume;

      i++;

  // SOUND EFFECTS -- a third channel, independent of voices and room music.
  //
  // Space cuts DIALOGUE only: it must never silence ambience or an effect. Effects are
  // bundled per act exactly like the voices (one file + an offset table), and play from
  // the same blob URL, so the whole act's audio is two requests rather than 160.
  //
  // Volumes are deliberately low. The art is comic, not cinematic: effects sit under the

  // ---------------------------------------------------------------------------
  window.CODEBOOK_SFX_SPRITE = {"amb-clock":["sfx-act1.mp3",93.558,19.993],"amb-mensa":["sfx-act3.mp3",44.492,40.0],"amb-office":["sfx-act1.mp3",32.858,30.0],"amb-pond":["sfx-act1.mp3",63.208,30.0],"amb-studio":["sfx-act3.mp3",105.192,40.0],"amb-ward":["sfx-act3.mp3",84.842,20.0],"sfx-applause-big":["sfx-act3.mp3",0.0,5.0],"sfx-applause-small":["sfx-act1.mp3",17.612,5.0],"sfx-bell-desk":["sfx-act3.mp3",18.768,1.179],"sfx-button":["sfx-act3.mp3",41.759,1.037],"sfx-chalk":["sfx-act1.mp3",10.237,0.915],"sfx-click":["sfx-act1.mp3",24.727,0.218],"sfx-confetti":["sfx-act3.mp3",29.934,4.0],"sfx-counter-ping":["sfx-act1.mp3",15.574,1.688],"sfx-door-open":["sfx-act1.mp3",1.933,3.169],"sfx-door-slam":["sfx-act1.mp3",5.452,1.606],"sfx-doorbell":["sfx-act1.mp3",0.0,1.583],"sfx-drum-spin":["sfx-act3.mp3",20.297,3.937],"sfx-fall":["sfx-act1.mp3",7.409,2.478],"sfx-key":["sfx-act3.mp3",15.939,2.478],"sfx-klaxon":["sfx-act3.mp3",34.284,5.0],"sfx-lamps":["sfx-act3.mp3",9.7,1.106],"sfx-page":["sfx-act1.mp3",14.802,0.422],"sfx-paper":["sfx-act1.mp3",12.452,2.0],"sfx-phone-ring":["sfx-act3.mp3",43.146,0.997],"sfx-printer":["sfx-act3.mp3",5.35,4.0],"sfx-refuse":["sfx-act1.mp3",26.75,2.549],"sfx-scissors":["sfx-act3.mp3",11.156,2.93],"sfx-scoreboard":["sfx-act3.mp3",39.634,1.775],"sfx-select":["sfx-act1.mp3",25.295,1.105],"sfx-splash":["sfx-act1.mp3",22.962,1.415],"sfx-stamp":["sfx-act1.mp3",11.502,0.6],"sfx-stapler":["sfx-act3.mp3",14.436,1.154],"sfx-tick":["sfx-act1.mp3",29.649,1.175],"sfx-trumpets":["sfx-act3.mp3",24.584,5.0],"sfx-whoosh":["sfx-act1.mp3",31.174,1.334]};
  var SFX_VOL = 0.3, AMB_VOL = 0.1, currentAmbience = null;

  function sfxPlayer(name, vol, loop){
    var seg = window.CODEBOOK_SFX_SPRITE[name];
    if (!seg) return null;
    var el = new Audio(), end = seg[1] + seg[2], stopped = false;

  window.CODEBOOK_SFX = function(name, vol){ return sfxPlayer(name, vol, false); };

  window.CODEBOOK_AMBIENCE = function(name, vol){

  // Asset preloader. Each URL is fetched once (shared across callers, so a background
  // preload of the next act and a later foreground one never double-download); progress is

  var preloadRecs = {}, preloadKeep = [];
  function preloadOne(url){
    if (preloadRecs[url]) return preloadRecs[url];
    var rec = preloadRecs[url] = { frac: 0 };
    // Audio bundles are kept, not discarded: voiceBundle() would otherwise fetch the same
    // 3-5 MB again on the first spoken line and only be saved by the HTTP cache.
    var isBundle = /^(voices|sfx)-act\d+\.mp3$/i.test(url);
    rec.promise = fetch(url).then(function(res){
      if (!res.ok || !res.body || !res.body.getReader) return;

        if (r.done){ if (chunks && !voiceUrl[url]) voiceUrl[url] = URL.createObjectURL(new Blob(chunks, { type: 'audio/mpeg' })); return; }

  }
  window.CODEBOOK_PRELOAD = function(list, onProgress, onDone){
    var recs = (list || []).map(preloadOne);
    function frac(){ return recs.length ? recs.reduce(function(a, r){ return a + r.frac; }, 0) / recs.length : 1; }

  // where html is an optional overlay laid over the 16:9 art (percent-positioned).
  // Click / Space / Enter advances, Escape skips the rest.

    box.id = 'interlude';

      window.removeEventListener('keydown', onKey, true);

      setTimeout(function(){ box.remove(); if (onDone) onDone(); }, 500);
    }
    function next(){
      if (lock || done) return;
      i++;
      if (i >= panels.length){ finish(); return; }
      lock = true;
      if (narr){ narr.pause(); narr = null; }
      img.classList.remove('show'); over.classList.remove('show'); cap.classList.remove('show'); hint.classList.remove('show');
      setTimeout(function(){
        var p = panels[i];
        img.src = p.src || '';
        over.innerHTML = p.html || '';
        requestAnimationFrame(function(){
          img.classList.add('show'); over.classList.add('show');
          cap.innerHTML = p.text || '';
          cap.style.display = p.text ? '' : 'none';
          setTimeout(function(){
            cap.classList.add('show'); hint.classList.add('show'); lock = false;
            if (p.voice){                                    // narrator reads the panel, then it advances
              // Let the line land before moving: advancing on the exact last sample reads as
              // cutting the narrator off, which is what it looked like.
              var mine = i, a = window.CODEBOOK_VOICE(p.voice); narr = a;
              a.addEventListener('ended', function(){ setTimeout(function(){ if (!done && i === mine) next(); }, 900); });
              a.play().catch(function(){ setTimeout(function(){ if (!done && i === mine) next(); }, 4200); });
            }
          }, 450);
        });
      }, i === 0 ? 0 : 400);
    }

      if (e.code === 'Escape'){ e.preventDefault(); e.stopPropagation(); finish(); return; }
      if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); e.stopPropagation(); next(); }
    }
    window.addEventListener('keydown', onKey, true);
    box.addEventListener('click', next);
    // Optional: hold on a loading bar until the next act's assets (opts.preload) are in.
    function start(){ lock = false; next(); }
    requestAnimationFrame(function(){
      box.classList.add('show');
      if (!opts.preload || !opts.preload.length){ start(); return; }

        function(){

  document.addEventListener('keydown', function(e){

})();

  init: function(ctx){
  window.CODEBOOK_PLAY_ROOM_MUSIC('office-bgm.mp3', 0.15);
  window.CODEBOOK_AMBIENCE('amb-clock', 0.1);      // the seven seconds, audible
  var ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){ var e = document.createElementNS(ns, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  var selectedItem = null;
  function syncSideInv(lastAddedId){
    window.CODEBOOK_RENDER_SIDE_INV('wp_sideInv', ctx.GAME.inventory, lastAddedId || null, 'wp_sideInvLabel', 'wp_sideInvPreviewImg', 'wp_sideInvPreviewName',
      function(id){
        selectedVerb = 'use'; selectedItem = id;
        verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === 'use'); });
        syncSideInv();
        updateSentence();
      }, selectedItem);
  }
  syncSideInv();
  function showPatch(id){
    var patch = document.getElementById('wp_patch_' + id);
    if (patch) patch.style.display = 'block';
  }
  function hideSprite(id){
    var spr = document.getElementById('wp_sprite_' + id);
    if (spr) spr.style.display = 'none';
  }

  // Professor is a single shared entity toggling between Office and Lecture Theatre
  // (see the 'lecture' room's blackboard/bingo mechanics). Absent here means he's
  // currently mid-lecture; desk items can only be taken while he's not watching.
  var profHere = ctx.hasFlag('profAtOffice');
  var wpBg = document.getElementById('wp_bg');
  wpBg.src = profHere ? 'office-bg.webp' : 'office-bg-empty.webp';
  document.getElementById('wp_profMouth').style.display = profHere ? '' : 'none';

  var prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (!prefersReducedMotion){
    (function(){
      var WALK_DX = 350; // walks from the desk (x=600) over to the right-side shelf/window
      function scheduleWalk(){
        setTimeout(function(){
          if (document.getElementById('wp_professor')) playWalk();
        }, 22000 + Math.random() * 16000);
      }
      function playWalk(){
        var seated = document.getElementById('wp_professor');
        var walker = document.getElementById('wp_professorWalk');
        var travel = document.getElementById('wp_walkTravel');
        if (!seated || !walker || !travel) return;
        travel.style.transition = 'none';
        travel.style.transform = 'translateX(0)';
        void travel.offsetWidth;
        seated.style.opacity = '0';
        walker.style.opacity = '1';
        walker.classList.add('walking');
        requestAnimationFrame(function(){
          travel.style.transition = 'transform 2.4s ease-in-out';
          travel.style.transform = 'translateX(' + WALK_DX + 'px)';
        });
        setTimeout(function(){
          var w = document.getElementById('wp_professorWalk');
          if (!w) return;
          w.classList.remove('walking');
          w.classList.add('anim-bob');
        }, 2500);
        setTimeout(function(){
          var w = document.getElementById('wp_professorWalk'), t = document.getElementById('wp_walkTravel');
          if (!w || !t) return;
          w.classList.remove('anim-bob');
          w.classList.add('walking');
          t.style.transition = 'transform 2.4s ease-in-out';
          t.style.transform = 'translateX(0)';
        }, 4300);
        setTimeout(function(){
          var w = document.getElementById('wp_professorWalk'), s = document.getElementById('wp_professor');
          if (!w) return;

        addChoice('B) &ldquo;I dunno, the math&rsquo;s wrong somehow.&rdquo;', function(){ w1bAnswer(false); });
        break;
      case 'W2':
        setLine('Prof.', '&ldquo;Fine. You checked a number before falling in love with it. Now &mdash; yours.&rdquo;<br><br><i>Player:</i> &ldquo;Lectures. Are they actually worth going to?&rdquo;<br><br>&ldquo;&lsquo;Worth it&rsquo; isn&rsquo;t a variable. Try again, or I&rsquo;m done after this one.&rdquo;', 'office-w2.mp3');
        addChoice('A) Repeat the same sentence, differently worded', function(){ w2Answer(false); });
        addChoice('B) &ldquo;Do students who attend more lectures get better exam results?&rdquo;', function(){ w2Answer(true); });
        break;
      case 'W3':
        setLine('Prof.', '&ldquo;Better &mdash; that&rsquo;s a real, answerable question. It&rsquo;s also been studied to exhaustion since before you were born. What&rsquo;s <i>your</i> angle on it? Give me a population, a place, a time window, and don&rsquo;t tell me which way it comes out.&rdquo;', 'office-w3.mp3');
        var aLabel = 'A) WHO: first-years in the Methods lecture &middot; WHAT: lectures attended &amp; final exam grade &middot; WHEN: winter term 2025/26 &middot; DIRECTION: left open';
        if (state.w3Fails>=1) aLabel = '<span class="star">&#9733;</span> ' + aLabel;
        addChoice(aLabel, function(){ w3Answer(true); });
        addChoice('B) Same WHO/WHEN but DIRECTION fixed: &ldquo;skipping ruins your grade&rdquo;', function(){ w3Answer(false); });
        addChoice('C) WHO/WHEN left blank: &ldquo;students, generally&rdquo;', function(){ w3Answer(false); });
        break;
      case 'W3-callout':
        var text = state.w3Fails>=2
          ? '&ldquo;&lsquo;Students, generally&rsquo; isn&rsquo;t a population I can get data for. Neither is &lsquo;generally&rsquo; a time.&rdquo;'
          : '&ldquo;You&rsquo;ve already decided the answer. That&rsquo;s not a question, that&rsquo;s a conclusion looking for a citation.&rdquo;';
        setLine('Prof.', text, state.w3Fails>=2 ? 'office-w3-callout-a.mp3' : 'office-w3-callout-b.mp3');
        addChoice('Try again', function(){ goto('W3'); });
        break;
      case 'W4-WIN':
        ctx.addItem('question');
        syncSideInv('question');
        ctx.complete();
        setLine('Prof.', '&ldquo;There it is. Precise, checkable, doesn&rsquo;t already know its own answer. Don&rsquo;t lose it &mdash; and don&rsquo;t come back with a topic again. Come back with a question.&rdquo;<div class="state-line win">+ Item acquired: &ldquo;A Precisely Worded Question&rdquo;</div>', 'office-w4-win.mp3');
        clearChoices();
        break;
      case 'W-LOSE':
        setLine('Prof.', '&ldquo;Third Wednesday. Next month. Bring something sharper.&rdquo;<div class="state-line lose">Ejected into the corridor.</div>', 'office-lose.mp3');
        addChoice('Retry from the start', restart);
        break;
    }
  }

  // Patience is spent on every answer, but it only ejects on a *wrong* one: an answer that moves
  // the conversation on (and above all the right question at W3) must never lose, even if it
  // happens to burn the last bubble — that bug ejected players who had used retries earlier.
  function w1Answer(partial){ var out = spendBubble(); if (partial){ goto('W1b'); return; } state.w1Fails++; goto((out || state.w1Fails>=2) ? 'W-LOSE' : 'W1-retry'); }
  function w1bAnswer(correct){ var out = spendBubble(); if (correct||state.w1bSoftFail){ goto('W2'); return; } state.w1bSoftFail=true; goto(out ? 'W-LOSE' : 'W1b'); }
  function w2Answer(correct){ var out = spendBubble(); if (correct){ goto('W3'); return; } state.w2Fails++; goto((out || state.w2Fails>=2) ? 'W-LOSE' : 'W2'); }
  function w3Answer(correct){ var out = spendBubble(); if (correct){ goto('W4-WIN'); return; } state.w3Fails++; goto(out ? 'W-LOSE' : 'W3-callout'); }
  function restart(){ state={bubbles:5,w1Fails:0,w1bSoftFail:false,w2Fails:0,w3Fails:0}; goto('W0'); }

  // The two-stage reveal, stage two: the Codebook was only ever Methods. Then submission.
  function revealScene(){
    clearChoices();
    setLine('System', 'You put the finished paper on the desk. The seven-second hourglass turns over. He reads. For once, he does not immediately object.');
    addChoice('Wait', function(){
      clearChoices();
      setLine('Prof.', '&ldquo;Hm.&rdquo;');
      addChoice('&ldquo;So&hellip; that&rsquo;s it?&rdquo;', function(){
        clearChoices();
        setLine('Prof.', '&ldquo;That&rsquo;s <i>what</i>?&rdquo;');
        addChoice('&ldquo;The Codebook.&rdquo;', function(){
          clearChoices();
          setLine('Prof.', '<i>(he looks genuinely confused)</i><br>&ldquo;The <i>what</i>?&rdquo;');
          addChoice('Explain &mdash; the Corridor, the Doorman, the chapters, the rumours', function(){
            clearChoices();
            setLine('Prof.', '&ldquo;Oh. <i>That.</i>&rdquo;<br><i>(pause)</i><br>&ldquo;We used to call it Methods.&rdquo;<br><br>He goes back to the abstract and reads it properly. The hourglass runs all the way out without him interrupting, which has not happened once.<br><br>&ldquo;It&rsquo;s accurate.&rdquo;<br><i>(beat)</i><br>&ldquo;Send it.&rdquo;');
            addChoice('Take it to the submission chute', submitScene);
          });
        });
      });
    });
  }

  function submitScene(){
    clearChoices();
    ctx.setFlag('submitted');
    window.CODEBOOK_ITEM_LABELS.folder = 'Research Folder \u2014 Submitted';
    window.CODEBOOK_SFX('sfx-whoosh', 0.3);
    setLine('System', 'Down the corridor, a brass chute: <b>MANUSCRIPT SUBMISSION &mdash; NO REFUNDS.</b><br><br>The folder goes in. After five acts, it is the first time you have given it <i>away</i>.<br><br>A distant thump. Silence. Then a small printed card comes back up the chute:<br><br><b>SUBMISSION RECEIVED</b><br><i>Your manuscript is now under consideration.<br>Please do not contact the editorial office.</i><div class="state-line win">Folder: SUBMITTED</div>', 'win');
    addChoice('Leave the building', function(){
      clearChoices();
      if (window.CODEBOOK_PLAY_OUTRO) window.CODEBOOK_PLAY_OUTRO(); else ctx.goMap();
    });
  }

  // Act II's ending: the Registry seals the Prediction Slip and releases H-27.
  // The device accepts nonsense as happily as it accepts a real theory -- the consequence
  // of an empty one is deferred to Act IV, where the seal comes off. (STORY.md, WP-1.7.)
  function sealScene(){
    var S = window.CODEBOOK_SLIP;
    clearChoices();
    setLine('System', 'The pneumatic tube above the desk shudders and lowers a small machine on a brass arm:<br><br><b>PREREGISTRATION-ADJACENT DEVICE</b><br><i>Not legally a preregistration device.</i><br><br>' + S.html() +
      '<br><b>ARE YOU SURE THIS IS WHAT YOU EXPECT BEFORE SEEING THE DATA?</b>');
    addChoice('I WOULD LIKE TO SEE THE DATA FIRST', function(){
      window.CODEBOOK_SFX('sfx-klaxon', 0.22);
      setLine('Registry', 'An alarm goes off somewhere below the floor.<br><br>&ldquo;REQUEST NOTED.&rdquo;<br><br>The button retracts into the wall. It does not come back.');
      clearChoices();
      addChoice('YES', doSeal);
    });
    addChoice('YES', doSeal);

    function doSeal(){
      clearChoices();
      var empty = !S.allSound();
      ctx.setFlag('slipSealed');
      if (empty) ctx.setFlag(window.CODEBOOK_FAIL.theoryEmpty);
      ctx.setFlag('h27issued');
      ctx.addItem('slip');
      window.CODEBOOK_ITEM_LABELS.folder = 'Research Folder \u2014 Theory Exists';
      window.CODEBOOK_SFX('sfx-stamp', 0.34);
      var common = 'Metal clamps descend. Wax. A date is punched in with considerable force.<br><br>' +
        '&ldquo;What if I&rsquo;m wrong?&rdquo; &mdash; &ldquo;Then you will have learned something.&rdquo;<br>' +
        '&ldquo;And if I&rsquo;m right?&rdquo; &mdash; &ldquo;Possibly.&rdquo;<br><i>(beat)</i><br>' +
        '&ldquo;That&rsquo;s not very reassuring.&rdquo; &mdash; &ldquo;This is Methods.&rdquo;';
      if (empty){
        window.CODEBOOK_SFX('sfx-refuse', 0.3);
        setLine('Registry', common + '<br><br>The tube coughs. The form comes back out <b>on fire</b>, and lands stamped:<br><br><b>THEORY EXISTS<br>INFORMATION CONTENT: 0<br>APPROVED</b><br><br>Nothing blocks you. Nobody stops you. A small robot arrives at a trot from the direction of the Library: &ldquo;Good news! Nothing currently observable could contradict your theory.&rdquo;<div class="state-line">Folder stamped: THEORY EXISTS</div>');
      } else {
        setLine('Registry', common + '<br><br>The tube coughs, and coughs again, and drops <b>Form H-27: Request to Approach Human Beings</b> at your feet. Forty-seven pages.<br><br>&ldquo;So that&rsquo;s a theory.&rdquo;<br>&ldquo;That is a <i>form</i>.&rdquo;<div class="state-line win">Folder stamped: THEORY EXISTS</div>', 'win');
      }
      addChoice('Take Form H-27', function(){
        clearChoices(); ctx.addItem('h27form');
        setLine('Prof.', '&ldquo;Forty-seven pages before anybody is allowed to speak to a first-year.&rdquo; He does not look up. &ldquo;Go on. They are expecting you, in the way that a tribunal expects anyone.&rdquo;');
      });
    }
  }

  // Act III hand-off: "where exactly did those numbers come from?"
  function askProvenance(first){
    clearChoices();
    setLine('Prof.', first
      ? 'He glances at the folder under your arm, and at the stamps all over it. &ldquo;So you went out and bothered actual humans. Good.&rdquo; He puts his pen down, which he never does. &ldquo;Now the interesting part. Where exactly did those numbers come from?&rdquo;'
      : '&ldquo;Again. Where did they come from?&rdquo;');
    addChoice('A) &ldquo;A hundred and forty students. It&rsquo;s a big dataset.&rdquo;', function(){
      clearChoices();
      setLine('Prof.', '&ldquo;A hundred and forty is not big. It is not <i>meant</i> to be big.&rdquo; He picks the pen back up. &ldquo;I did not ask how many. I asked where they came from.&rdquo;');
      addChoice('Try again', function(){ askProvenance(false); });
    });
    addChoice('B) &ldquo;The survey system exported them.&rdquo;', function(){
      clearChoices();
      setLine('Prof.', '&ldquo;The <i>system</i>.&rdquo; A silence with an edge on it. &ldquo;Systems do not choose who gets asked, or who bothers to answer. People do, and then they write it down, or they don&rsquo;t. Which was it?&rdquo;');
      addChoice('Try again', function(){ askProvenance(false); });
    });
    addChoice('C) &ldquo;Random draw from the first-year Methods register. Seventy-five per cent answered, and I know which quarter didn&rsquo;t.&rdquo;', function(){
      clearChoices();
      ctx.setFlag('provenanceGiven');
      window.CODEBOOK_SFX('sfx-stamp', 0.32);
      window.CODEBOOK_ITEM_LABELS.folder = 'Research Folder \u2014 Question Has Data';
      setLine('Prof.', '&ldquo;Frame, draw, response rate. In one breath.&rdquo; He takes the folder, stamps it without ceremony, and hands it back. <b>QUESTION HAS DATA.</b><br><br>&ldquo;Most people cannot tell me that in a paragraph. Keep being able to say it &mdash; someone will ask you again when it matters more.&rdquo;<div class="state-line win">+ Folder stamped: QUESTION HAS DATA</div>', 'win');
      addChoice('&ldquo;So now I analyse it?&rdquo;', function(){
        clearChoices();
        setLine('Prof.', '&ldquo;Now you find out whether you were right. You wrote down what you expected before you saw any of this.&rdquo; He returns to his marking. &ldquo;The basement will be delighted to help you <i>not</i> do that. Don&rsquo;t let it.&rdquo;');
      });
    });
  }

  updateDrops();
  // Coming back after he has already handed over the Question: don't replay the
  // seven-second interrogation, greet the player according to how far they've got.
  if (profHere && ctx.hasFlag('whirlpoolDone')){
    clearChoices();
    if (ctx.hasFlag('actVDone') && !ctx.hasFlag('submitted')){
      revealScene();
    } else if (window.CODEBOOK_SLIP.filled() === 4 && !ctx.hasFlag('slipSealed')){
      sealScene();
    } else if (ctx.hasFlag('actIIIDone') && !ctx.hasFlag('provenanceGiven')){
      // The hand-off out of the data act. He does not want the result -- he wants to know
      // how the numbers were made, which is the whole act asked as one question.
      askProvenance(true);
    } else if (ctx.hasFlag('actIIIDone')){
      setLine('Prof.', 'He looks at the stamped folder, then at you. &ldquo;Frame, draw, response rate. Yes. Go and find out whether you were right.&rdquo;');
    } else if (ctx.hasFlag('corridorDone')){
      setLine('Prof.', '&ldquo;You have a question and a folder to keep it in. That is two more things than you had on Wednesday.&rdquo; He turns a page. &ldquo;A question is not evidence. Go and get some.&rdquo;');
    } else {
      setLine('Prof.', '&ldquo;You already have your question. Don&rsquo;t lose it, don&rsquo;t reword it, and don&rsquo;t bring me a topic.&rdquo; A pause. &ldquo;Was there something else?&rdquo;');
    }
  } else if (profHere){ goto('W0'); }
  }
});
</script>
<script>

CODEBOOK_REGISTER({

  prereq: null, lockedHint: '',
  html: `

  </div>
`,
  init: function(ctx){
  window.CODEBOOK_PLAY_ROOM_MUSIC('lecture-bgm.mp3', 0.15);
  window.CODEBOOK_AMBIENCE('amb-office', 0.09);    // room tone; the snoring student is a one-shot below
  var sceneWrap = document.getElementById('lt_sceneWrap');
  var speakerEl = document.getElementById('lt_speaker');

  var captionEl = document.getElementById('lt_caption');

  var profPointing = document.getElementById('lt_profPointing');
  var profTravel = document.getElementById('lt_profTravel');
  var tagEl = document.getElementById('lt_tag');
  var sentenceEl = document.getElementById('lt_sentenceLine');
  var verbGrid = document.getElementById('lt_verbGrid');
  var prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function setLine(speaker, html, cls, audioSrc){
    speakerEl.textContent = speaker;
    speakerEl.className = 'speaker' + (cls ? ' ' + cls : '');
    lineEl.innerHTML = html;
    if (captionEl){ captionEl.classList.remove('caption-dismissed'); captionEl.classList.toggle('narration', window.CODEBOOK_IS_NARRATION(speaker, html)); }
    window.CODEBOOK_PLAY_LINE_AUDIO(audioSrc);
  }
  function clearChoices(){ choicesEl.innerHTML = ''; }
  function addChoice(html, onClick){
    var b = document.createElement('button'); b.className = 'choice'; b.innerHTML = html;
    b.addEventListener('click', onClick); choicesEl.appendChild(b);
  }
  function pct(v){ return v + '%'; }

  var selectedItem = null;
  function syncSideInv(lastAddedId){
    window.CODEBOOK_RENDER_SIDE_INV('lt_sideInv', ctx.GAME.inventory, lastAddedId || null, 'lt_sideInvLabel', 'lt_sideInvPreviewImg', 'lt_sideInvPreviewName',
      function(id){
        selectedVerb = 'use'; selectedItem = id;
        verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === 'use'); });
        syncSideInv();
        updateSentence();
      }, selectedItem);
  }
  syncSideInv();
  if (ctx.hasFlag('lectureInkTaken')){
    var inkSpr = document.getElementById('lt_sprite_ink');
    if (inkSpr) inkSpr.style.display = 'none';
  }

  var VERBS = [
    {id:'lookat', label:'Look At'}, {id:'talkto', label:'Talk To'},

  ];
  var FALLBACK = {

  };
  var selectedVerb = 'lookat';

  function updateSentence(){

    if (selectedVerb === 'use' && selectedItem){
      var itemName = window.CODEBOOK_ITEM_LABELS[selectedItem] || selectedItem;
      sentenceEl.textContent = 'Use ' + itemName + (hoveredNoun ? ' with ' + hoveredNoun : '…');
      return;
    }
    sentenceEl.textContent = hoveredNoun ? (label + ' ' + hoveredNoun) : (label + '…');
  }
  VERBS.forEach(function(v){
    var b = document.createElement('button');
    b.className = 'verb-btn' + (v.id === selectedVerb ? ' active' : '');
    b.textContent = v.label; b.dataset.verb = v.id;
    b.addEventListener('click', function(){
      selectedVerb = v.id;
      if (v.id !== 'use'){ selectedItem = null; syncSideInv(); }
      verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === v.id); });
      updateSentence();
    });
    verbGrid.appendChild(b);
  });
  updateSentence();

  // Index order matters: it doubles as the 3x3 grid reading order (row-major),
  // so GRID_LINES below can reference squares purely by position.
  var TERMS = [
    { id:'autopoiesis', label:'AUTOPOIESIS' },
    { id:'trust', label:'TRUST REDUCES\nCOMPLEXITY' },
    { id:'contingency', label:'DOUBLE\nCONTINGENCY' },
    { id:'coupling', label:'STRUCTURAL\nCOUPLING' },
    { id:'free', label:'NOBODY KNOWS\nWHAT THIS MEANS', free:true },
    { id:'secondorder', label:'SECOND-ORDER\nOBSERVATION' },
    { id:'environment', label:'SYSTEM /\nENVIRONMENT' },
    { id:'closure', label:'OPERATIVE\nCLOSURE' },
    { id:'communication', label:'COMMUNICATION\nCOMMUNICATES' }
  ];
  var LINES = [
    { term:'communication', text:'The system does not communicate &mdash; communication communicates. The system merely happens to be where this occurs, which is either profound or a category error, and the distinction is undecidable from inside the system.', audio:'lecture-line-communication.mp3' },
    { term:'trust', text:'Trust reduces complexity, which is comforting, except trust is itself a complex expectation about complexity, so we&rsquo;ve reduced nothing &mdash; we&rsquo;ve relocated our confusion to a smaller office.', audio:'lecture-line-trust.mp3' },
    { term:'contingency', text:'Double contingency: I expect that you expect that I expect you to understand this. None of us do. This is, structurally, a seminar.', audio:'lecture-line-contingency.mp3' },
    { term:'autopoiesis', text:'Autopoietic systems reproduce their own elements from their own elements &mdash; either the secret of life, or a very slow photocopier.', audio:'lecture-line-autopoiesis.mp3' },
    { term:'environment', text:'Society, you&rsquo;ll recall, does not consist of people. People are, at best, the environment of society, which I have now said in four consecutive lectures and it has yet to make anyone happier.', audio:'lecture-line-environment.mp3' },
    { term:'secondorder', text:'The observer cannot observe their own observing while observing. Try it now &mdash; observe yourselves observing. No, don&rsquo;t write that down. That was a trap.', audio:'lecture-line-secondorder.mp3' },
    { term:'coupling', text:'Structural coupling is when two systems irritate each other regularly enough to call it a relationship. This is also true of marriage, and of this department.', audio:'lecture-line-coupling.mp3' },
    { term:'closure', text:'Operatively closed systems produce their own operations from their own operations, closed to the environment and, frankly, to feedback of any kind. Some of you are taking this personally. Good.', audio:'lecture-line-closure.mp3' }
  ];
  var GRID_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  var marked = { free:true };
  var lineIndex = 0;
  var cellEls = {};
  var pipEls = [];
  var started = false;

  function renderBingo(){
    bingoGridEl.innerHTML = '';
    cellEls = {};
    pipsHost.innerHTML = '';
    pipEls = [];
    TERMS.forEach(function(t){
      var cell = document.createElement('div');
      cell.className = 'bingo-cell' + (marked[t.id] ? ' marked' : '');
      cell.innerHTML = t.label.replace(/\n/g, '<br>');
      bingoGridEl.appendChild(cell);
      cellEls[t.id] = cell;
    });
    TERMS.filter(function(t){ return !t.free; }).forEach(function(){
      var p = document.createElement('div'); p.className = 'pip'; pipsHost.appendChild(p); pipEls.push(p);
    });
  }

  function markTerm(id, animate){
    if (marked[id]) return;
    marked[id] = true;
    var cell = cellEls[id];
    if (cell){
      cell.classList.add('marked');
      if (animate){
        cell.classList.add('pop');
        setTimeout(function(){ cell.classList.remove('pop'); }, 500);
      }
    }
    var realTerms = TERMS.filter(function(t){ return !t.free; });
    var idx = -1;
    for (var i = 0; i < realTerms.length; i++){ if (realTerms[i].id === id) idx = i; }
    if (idx > -1 && pipEls[idx]) pipEls[idx].classList.add('full');
  }

  function hasBingo(){
    return GRID_LINES.some(function(line){
      return line.every(function(i){ return marked[TERMS[i].id]; });
    });
  }

  function showBingoChoices(){
    clearChoices();
    if (lineIndex < LINES.length){
      addChoice('Keep listening&hellip;', function(){
        var l = LINES[lineIndex];
        lineIndex++;
        setLine('Prof.', l.text, null, l.audio);
        markTerm(l.term, true);
        showBingoChoices();
      });
    }
    if (hasBingo()){
      addChoice('<b>Shout &ldquo;BINGO!&rdquo;</b><br>Derail him before he notices.', winLecture);
    }
  }

  function startBingo(){
    if (started) return;
    started = true;
    marked = { free:true };
    lineIndex = 0;
    bingoPanel.style.display = 'flex';
    renderBingo();
    setLine('You', 'You hold up the bingo card. He doesn&rsquo;t notice &mdash; he never does &mdash; but that was never really the point.');
    setTimeout(showBingoChoices, 900);
  }

  function winLecture(){
    clearChoices();
    setLine('You', '&ldquo;BINGO!&rdquo;', 'win');
    window.CODEBOOK_SFX('sfx-applause-small', 0.32);
    tagEl.textContent = 'Lecture derailed';
    // He doesn't just vanish: he loses the thread, then visibly walks out of the hall.
    setTimeout(function(){
      setLine('Prof.', 'He blinks. He looks at the board, then at his notes, then at the board again. The thread is gone, and everyone can see it go.');
      started = false;
      bingoPanel.style.display = 'none';
    }, 1200);
    setTimeout(function(){
      if (!document.getElementById('lt_profLecturing')) return;
      setLine('System', 'He gathers his notes, mutters something about office hours, and walks out.');
      walkRoute([640], leaveForOffice, { exit: true });   // out to the right, past the lectern (the left is all seating)
      setTimeout(leaveForOffice, 7000);   // safety net if the walk is cut short
    }, 3400);
    var left = false;
    function leaveForOffice(){
      if (left || !document.getElementById('lt_profLecturing')) return;
      left = true;
      if (!ctx.hasFlag('lectureDone')) ctx.complete();
      ctx.setFlag('profAtOffice');
      applyPresence(false);
      setLine('System', 'The theatre is empty. The chalk diagram is still on the board, looping back into itself.<div class="state-line win">+ Lecture derailed.</div>');
      var bar = document.createElement('div'); bar.className = 'continuebar';
      var btn = document.createElement('button'); btn.className = 'continue'; btn.textContent = 'Continue to Campus Map →';
      btn.addEventListener('click', ctx.goMap);
      choicesEl.appendChild(bar); bar.appendChild(btn);
    }
  }


  // ---- professor presence: he's a single shared character who toggles between
  // this room and the Office. Sent home by winning bingo; called back by drawing
  // on the blackboard while he's away. See the 'whirlpool' (Office) room for the
  // other half of this.
  var profHere = !ctx.hasFlag('profAtOffice');
  var zoneEls = [];
  function clearZones(){ zoneEls.forEach(function(z){ z.remove(); }); zoneEls = []; }

  var AMBIENT_LINES = [
    { text:'He is mid-sentence about something that might be Luhmann and might not be. It is difficult to find an opening.' },
    { text:'&ldquo;&hellip;which is either the point, or entirely beside it, and frankly the distinction is undecidable.&rdquo;', audio:'lecture-ambient-quote.mp3' },
    { text:'You catch the phrase &ldquo;operatively closed&rdquo; three times in one breath. He does not appear to need air.' },
    { text:'He draws a circle, then an arrow out of the circle, then an arrow back into the circle. He looks pleased about this.' }
  ];
  var ambientIndex = 0;

  var DOODLE_LINES = [
    'Skulls, a column, a cathedral, a suspiciously accurate campus map, and a cat. No notes on autopoiesis.',
    'You add a small speech bubble coming out of the cat. It says nothing useful either.',
    'A second cat. This one is judging the first cat.',
    'You attempt to draw &ldquo;double contingency.&rdquo; It comes out looking like a crab.',
    'Under the skull, somebody has inked a little three-by-three grid. Two squares are crossed out and one row has a line struck through it. Whoever sat here before you was keeping score of something.'
  ];
  var doodleIndex = 0;

  var STATIC_EXTRAS = [
    { id:'note', kind:'lookat', noun:'the paper airplane', hotspot:{l:16.75,t:82.99,w:8.37,h:10.63},
      lookat:'A note, folded into a paper airplane, never thrown. Too risky mid-lecture, structurally speaking.' },
    { id:'phone', kind:'lookat', noun:'your phone', hotspot:{l:74.16,t:89.37,w:11.96,h:10.63},
      lookat:'A phone, screen dimmed, held just below the sightline of a man who has spent thirty years perfecting the sightline of a lecture hall.' },
    { id:'doodle', kind:'doodle', noun:'your notebook', hotspot:{l:20.33,t:77.68,w:51.44,h:22.32} },
    { id:'board', kind:'board', noun:'the blackboard', hotspot:{l:47.55,t:11.69,w:37.98,h:35.07} },
    { id:'ink', kind:'pickup', itemId:'blackink', flag:'lectureInkTaken', noun:'a bottle of ink',
      hotspot:{l:65.5,t:57,w:6.5,h:10},
      lookat:'A bottle of black ink, left on the floor by the lectern &mdash; the kind of thing a chalkboard-adjacent room somehow always has lying around.',
      lookatTaken:'Empty spot on the rug where the ink used to be.',
      pickup:'You take the bottle of ink.<div class="state-line win">+ Picked up: A Bottle of Black Ink</div>',
      pickupTaken:'Already yours.' },
    { id:'worksheets', kind:'pickup', itemId:'worksheets', flag:'lectureSheetsTaken', noun:'a stack of handouts',
      hotspot:{l:74,t:57,w:9,h:7},
      lookat:'A stack of photocopied handouts abandoned on the end of a bench: the worked examples he goes through every year, question by question, with his own numbering in the margin.',
      lookatTaken:'The bench end where the handouts were, now just bench.',
      pickup:'You take a set of the worked-example sheets. Nobody else wanted one.<div class="state-line win">+ Picked up: The Professor&rsquo;s Worked-Example Sheets</div>',
      pickupTaken:'You have a set already.' },
    { id:'chalk', kind:'pickup', itemId:'chalk', flag:'lectureChalkTaken', noun:'a stub of chalk',
      hotspot:{l:56,t:47.5,w:6,h:5},
      lookat:'A well-worn stub of chalk on the blackboard ledge, rubbed down to about the length of a thumbnail.',
      lookatTaken:'The ledge, with a chalk-shaped gap in the dust.',
      pickup:'You pocket the chalk. Somewhere there is a board that needs writing on and no chalk in its tray.<div class="state-line win">+ Picked up: A Stub of Chalk</div>',
      pickupTaken:'Already yours.' }
  ];

  function addZone(x){
    var el = document.createElement('div');
    el.className = 'door-zone';
    el.style.left = pct(x.hotspot.l); el.style.top = pct(x.hotspot.t);
    el.style.width = pct(x.hotspot.w); el.style.height = pct(x.hotspot.h);
    el.style.cursor = 'pointer';
    el.addEventListener('mouseenter', function(){ el.classList.add('armed'); hoveredNoun = x.noun; updateSentence(); });
    el.addEventListener('mouseleave', function(){ el.classList.remove('armed'); hoveredNoun = null; updateSentence(); });
    el.addEventListener('click', function(){ handleZoneClick(x); });
    sceneWrap.appendChild(el);
    zoneEls.push(el);
  }

  function handleZoneClick(x){
    if (x.kind === 'lookat'){
      if (selectedVerb === 'lookat'){ setLine('You', x.lookat); }
      else { setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work."); }
      return;
    }
    if (x.kind === 'pickup'){
      if (selectedVerb === 'pickup'){
        if (ctx.hasFlag(x.flag)){
          setLine('You', x.pickupTaken);
        } else {
          ctx.setFlag(x.flag);
          ctx.addItem(x.itemId);
          syncSideInv(x.itemId);
          var spr = document.getElementById('lt_sprite_' + x.id);
          if (spr) spr.style.display = 'none';
          setLine('You', x.pickup);
        }
      } else if (selectedVerb === 'lookat'){
        setLine('You', ctx.hasFlag(x.flag) ? x.lookatTaken : x.lookat);
      } else {
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      }
      return;
    }
    if (x.kind === 'doodle'){
      if (selectedVerb === 'use' && selectedItem === 'magnifyingglass'){
        setLine('You', 'Under the glass, the little grid resolves: each square holds a word in tiny, furious handwriting &mdash; <i>autopoiesis, contingency, closure</i> &mdash; two of them crossed out, one row struck through, and in the margin, pressed hard enough to tear the paper: <b>THREE IN A ROW AND HE STOPS.</b>');
        return;
      }
      if (selectedVerb === 'lookat'){
        setLine('You', DOODLE_LINES[doodleIndex % DOODLE_LINES.length]);
        doodleIndex++;
      } else {
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      }
      return;
    }
    if (x.kind === 'prof'){
      if (selectedVerb === 'use' && selectedItem === 'bingocard'){ startBingo(); return; }
      if (selectedVerb === 'talkto'){
        var ambient = AMBIENT_LINES[ambientIndex % AMBIENT_LINES.length];
        setLine('Prof.', ambient.text, null, ambient.audio);
        ambientIndex++;
        return;
      }
      if (selectedVerb === 'lookat'){
        setLine('You', 'The same professor from the office, mid-flow, utterly absorbed. He has not looked up once.');
        return;
      }
      setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      return;
    }
    if (x.kind === 'board'){
      if (selectedVerb === 'use'){
        if (profHere){ setLine('You', 'He&rsquo;s already right here &mdash; drawing on the board now would just be rude.'); return; }
        summonProfessor();
        return;
      }
      if (selectedVerb === 'lookat'){
        setLine('You', profHere
          ? 'A half-finished diagram &mdash; circles, arrows looping back into themselves, one box simply labeled &ldquo;???&rdquo;'
          : 'The half-finished diagram is still up there, one box labelled &ldquo;???&rdquo;, and a stub of chalk is sitting in the tray where he left it. Somebody once told you he can hear a wrong arrow being drawn from two corridors away.');
        return;
      }
      setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      return;
    }
  }

  function summonProfessor(){
    clearChoices();

      ctx.clearFlag('profAtOffice');
      setLine('Prof.', 'He appears almost instantly, delighted. &ldquo;Yes &mdash; exactly! Well, not exactly. But energetically, yes!&rdquo;', null, 'lecture-summon.mp3');
      applyPresence(true);

  }

  function renderZones(){
    clearZones();
    STATIC_EXTRAS.forEach(addZone);

  }

  var curPose = 'lecturing';
  // Gesturing while he talks: swap between the lecturing and pointing poses every ~1.7 s
  // (only while a line of his is playing and he isn't walking), back to lecturing afterwards.
  var gestureTimer = setInterval(function(){
    if (!document.getElementById('lt_profLecturing')){ clearInterval(gestureTimer); return; }
    var talking = profHere && document.querySelector('#lt_profTravel .talking');
    var walking = rigBox && rigBox.style.display !== 'none';
    if (walking) return;
    if (talking) setPose(curPose === 'lecturing' ? 'pointing' : 'lecturing');
    else if (curPose === 'pointing' && gestureOn) setPose('lecturing');
    gestureOn = !!talking;
  }, 1700);
  var gestureOn = false;
  function setPose(pose){
    curPose = pose;
    profLecturing.style.opacity = pose === 'lecturing' ? '1' : '0';
    profWalking.style.opacity = pose === 'walking' ? '1' : '0';
    profPointing.style.opacity = pose === 'pointing' ? '1' : '0';
    document.getElementById('lt_mouthWrapL').style.opacity = pose === 'lecturing' ? '1' : '0';
    document.getElementById('lt_mouthWrapP').style.opacity = pose === 'pointing' ? '1' : '0';
    profWalking.classList.toggle('walking', pose === 'walking'); // stepping bob while he paces
  }
  // Pacing with the cut-out rig: the painted sprite hides, the rig walks each leg of the route
  // at a speed matched to its stride (so the feet don't slide), turning to face where it goes.
  var profRig = null, rigBox = document.getElementById('lt_profRig');
  function ensureRig(){
    var h = profLecturing.getBoundingClientRect().height || 300;
    var H = h * 1600 / 1549;                       // rig def height vs. visible figure height
    if (profRig && Math.abs(profRig.H - H) < 2) return profRig;
    rigBox.innerHTML = '';
    profRig = window.CodebookRig.build(rigBox, window.PROF_RIG, { height: H });
    profRig.H = H;
    profRig.root.style.top = (-745 * profRig.scale) + 'px'; // hip sits this far above the soles
    return profRig;
  }
  function walkRoute(xs, done, opts){
    opts = opts || {};
    var rig = ensureRig(), x = 0, i = 0;
    var pxPerSec = 1300 * rig.scale / window.CodebookRig.walk.period;
    profLecturing.style.opacity = profWalking.style.opacity = profPointing.style.opacity = '0';
    document.getElementById('lt_mouthWrapL').style.opacity = document.getElementById('lt_mouthWrapP').style.opacity = '0';
    rigBox.style.display = '';
    requestAnimationFrame(function(){ rigBox.style.opacity = '1'; });
    rig.play(window.CodebookRig.walk, {});
    (function leg(){
      if (!profHere || !document.getElementById('lt_profLecturing')){ rig.stop(); return; }
      if (i >= xs.length){
        rig.stop(); rigBox.style.opacity = '0';
        if (!opts.exit) setPose('lecturing');
        setTimeout(function(){ if (rigBox.style.opacity === '0') rigBox.style.display = 'none'; }, 320);
        if (done) done(); return;
      }
      var to = xs[i++], dist = Math.abs(to - x), dur = dist / pxPerSec;
      rigBox.style.transform = to < x ? 'scaleX(-1)' : 'none';
      profTravel.style.transition = 'transform ' + dur.toFixed(2) + 's linear';
      profTravel.style.transform = 'translateX(' + to + 'px)';
      x = to;
      setTimeout(leg, dur * 1000 + 250);
    })();
  }

  window.CODEBOOK_DEBUG_PROF_WALK = function(){ if (profHere) walkRoute([-170, 130, 0]); }; // for testing

  function schedulePose(){
    if (prefersReducedMotion || !profHere || !document.getElementById('lt_profLecturing')) return;
    setTimeout(function(){
      if (!profHere || !document.getElementById('lt_profLecturing')) return;
      if (Math.random() < 0.5){
        walkRoute([-170, 130, 0], function(){ setTimeout(schedulePose, 700); });
      } else {
        setPose('pointing');
        setTimeout(function(){
          if (!profHere || !document.getElementById('lt_profLecturing')) return;
          setPose('lecturing'); schedulePose();
        }, 2600);
      }
    }, 9000 + Math.random() * 9000);
  }

  function applyPresence(here){
    profHere = here;
    if (here){
      profTravel.style.display = '';
      setPose('lecturing');
      schedulePose();
      tagEl.textContent = 'Lecture in progress';
    } else {
      profTravel.style.display = 'none';
      tagEl.textContent = 'Empty theatre';
      if (ctx.hasFlag('lectureDone')) setTimeout(function(){
        if (!profHere && document.getElementById('lt_line')) setLine('System', 'Without him the theatre is very quiet. The chalk is still in the tray, and the diagram on the board is still wrong.');
      }, 2600);
    }
    renderZones();
  }

  applyPresence(profHere);
  if (profHere){
    setLine('Prof.', 'He clears his throat and taps the lectern. &ldquo;Autopoiesis. Structural coupling. Double contingency. Operative closure.&rdquo; He does not appear to be building toward a point.', null, 'lecture-opening.mp3');
  } else {
    setLine(' ', 'The lecture theatre sits empty. Even the echo seems to be taking a break.');
  }
  clearChoices();
  }
});

  init: function(ctx){
  var sceneWrap = document.getElementById('cc_sceneWrap');

  window.CODEBOOK_AMBIENCE('amb-office', 0.05);  // deep empty-building tone; a ticking clock read as odd in here

  function setLine(speaker, html, cls, audioSrc){

  function clearChoices(){ choicesEl.innerHTML = ''; }

    window.CODEBOOK_RENDER_SIDE_INV('cc_sideInv', ctx.GAME.inventory, lastAddedId || null, 'cc_sideInvLabel', 'cc_sideInvPreviewImg', 'cc_sideInvPreviewName',
      function(id){
        selectedVerb = 'use'; selectedItem = id;

  // A small procedural squiggle of "handwriting" drawn over the note card, so it
  // visibly holds something illegible instead of looking like blank paper.
  function addScribble(box){
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 200 260');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.position = 'absolute'; svg.style.pointerEvents = 'none';
    svg.style.left = pct(box.l); svg.style.top = pct(box.t);
    svg.style.width = pct(box.w); svg.style.height = pct(box.h);
    for (var i = 0; i < 9; i++){
      var y = 18 + i * 25 + (Math.random() * 6 - 3);
      var x = 16, d = 'M ' + x + ' ' + y;
      while (x < 184){
        var dx = 9 + Math.random() * 11;
        var dy = Math.random() * 11 - 5.5;
        d += ' q ' + (dx / 2) + ' ' + (dy * 1.4) + ' ' + dx + ' ' + dy;
        x += dx;
      }
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#3A2A18');
      path.setAttribute('stroke-width', '2.3');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('opacity', (0.5 + Math.random() * 0.22).toFixed(2));
      svg.appendChild(path);
    }
    sceneWrap.appendChild(svg);
    zoneEls.push(svg);

      return;

      if (selectedVerb === 'lookat'){ setLine('You', x.lookat); return; }
      setLine('You', 'The door is locked.');
      return;

      setLine('You', FALLBACK[selectedVerb] || 'That doesn&rsquo;t seem to work.');

    if (x.kind === 'pickup'){
      if (selectedVerb === 'pickup'){
        if (ctx.hasFlag(x.flag)){
          setLine('You', x.pickupTaken);
        } else {
          ctx.setFlag(x.flag);
          ctx.addItem(x.itemId);
          syncSideInv(x.itemId);
          zone.classList.add('solved');
          setLine('You', x.pickup);

      } else if (selectedVerb === 'lookat'){
        setLine('You', ctx.hasFlag(x.flag) ? x.lookatTaken : x.lookat);
      } else {
        setLine('You', FALLBACK[selectedVerb] || 'That doesn&rsquo;t seem to work.');
      }
      return;
    }
    // kind === 'lookat'
    if (selectedVerb === 'lookat'){
      setLine('You', x.lookat);
    } else {
      setLine('You', FALLBACK[selectedVerb] || 'That doesn&rsquo;t seem to work.');

<script>

CODEBOOK_REGISTER({

              : 'Current title: <b>' + TITLES[titleStage] + '</b><br><br>&ldquo;Bigger,&rdquo; he says, not unkindly. &ldquo;It is <i>true</i> at every size. Why would you choose the smallest one?&rdquo;');

        api.say('You', 'Before you touch a word of this you want the sealed slip beside it, to check what you said you would find against what you are about to claim you found. It is not in your hands.');

<script>
/* ============================== CUT-OUT RIGS ============================== */
// Skeletal cut-out animation (dev copy + test page: tools/rig/). The Professor walks with this
// in the Lecture Theatre; parts are rig-prof-*.webp, cut from a ChatGPT parts sheet.
/* Minimal 2D cut-out rig for The Secret of the Lost Codebook.
 *
 * A rig is a tree of parts. Each part is one image with a pivot (the joint it rotates around,
 * in the part image's own pixels) and an attach point on its parent (in the parent's pixels).
 * Joint angles are set every frame by a pose function, e.g. the procedural walk cycle below,
 * so the character never drifts the way per-frame image generation does.
 *
 *   var rig = CodebookRig.build(container, RIG_DEF, { height: 400 });
 *   rig.play(CodebookRig.walk, { speed: 1 });   // or rig.pose({hipL: 20, ...}); rig.stop();
 */
(function(){
  function el(tag, css){ var e = document.createElement(tag); e.style.cssText = css || ''; return e; }

  function build(container, def, opts){
    opts = opts || {};
    var scale = (opts.height || def.height) / def.height;
    var root = el('div', 'position:absolute;left:0;top:0;width:0;height:0;');
    var joints = {};
    function add(part, parentEl, parentDef){
      var j = el('div', 'position:absolute;width:0;height:0;');
      var ax = parentDef ? part.attach[0] - parentDef.pivot[0] : 0;
      var ay = parentDef ? part.attach[1] - parentDef.pivot[1] : 0;
      j.style.left = (ax * scale) + 'px';
      j.style.top = (ay * scale) + 'px';
      j.style.zIndex = part.z || 0;
      var img = el('img', 'position:absolute;display:block;pointer-events:none;');
      img.src = part.src;
      img.style.width = (part.size[0] * scale) + 'px';
      img.style.height = (part.size[1] * scale) + 'px';
      img.style.left = (-part.pivot[0] * scale) + 'px';
      img.style.top = (-part.pivot[1] * scale) + 'px';
      if (part.flip) img.style.transform = 'scaleX(-1)';
      if (part.tint) img.style.filter = part.tint;
      j.appendChild(img);
      parentEl.appendChild(j);
      joints[part.id] = j;
      (part.children || []).forEach(function(c){ add(c, j, part); });
    }
    add(def.root, root, null);
    container.appendChild(root);

    var raf = null, t0 = 0, poseFn = null, poseOpts = null;
    function pose(angles, offset){
      Object.keys(angles).forEach(function(k){ if (joints[k]) joints[k].style.transform = 'rotate(' + angles[k] + 'deg)'; });
      offset = offset || { x: 0, y: 0 };
      root.style.transform = 'translate(' + (offset.x * scale) + 'px,' + (offset.y * scale) + 'px)';
    }
    function frame(now){
      var t = ((now - t0) / 1000) * (poseOpts.speed || 1) / (poseFn.period || 1);
      var p = poseFn(t % 1, poseOpts);
      pose(p.angles, p.offset);
      raf = requestAnimationFrame(frame);
    }
    return {

<script>
(function(){

  var ACT1_IMAGES = [
    'campus-map-act1.webp', 'map-sign.webp', 'corridor-archway-bg.webp', 'corridor-fall-bg.webp', 'corridor-gate-bg.webp',
