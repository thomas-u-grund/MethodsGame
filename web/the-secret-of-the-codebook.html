        ? '&ldquo;It&rsquo;s accurate. It just doesn&rsquo;t test anything, because the slip you sealed didn&rsquo;t predict anything.&rdquo;<br><i>(beat)</i><br>&ldquo;Send it. You will not make that mistake twice.&rdquo;'
        : '&ldquo;It&rsquo;s accurate.&rdquo;<br><i>(beat)</i><br>&ldquo;Send it.&rdquo;';
      setLine('Prof.', '<i>(she looks genuinely confused)</i> &ldquo;The <i>what</i>?&rdquo;<br><br>You explain: the Corridor, the Doorman, the chapters, the rumours.<br><br>&ldquo;Oh. <i>That.</i> We used to call it Methods.&rdquo;<br><br>She goes back to the abstract and reads it properly. The hourglass runs all the way out without her interrupting, which has not happened once.<br><br>' + verdict);
      addChoice('Take it to the submission chute', submitScene);
    });
  }

  // A prop placed over the Office scene for one moment (ROADMAP 8zn).
  function wpProp(cls, html){
    var wrap = document.getElementById('wp_sceneWrap'); if (!wrap) return null;
    var old = wrap.querySelector('.' + cls); if (old) old.remove();
    var el = document.createElement('div'); el.className = cls; el.innerHTML = html || '';
    wrap.appendChild(el); void el.offsetWidth;
    return el;
  }

  function submitScene(){
    clearChoices();
    // The folder visibly goes: off the desk, down the corridor, and a receipt comes back up.
    var fold = wpProp('wp-submit', '<img src="icon-folder.webp" alt="" style="width:100%">');
    if (fold) setTimeout(function(){ fold.classList.add('gone'); }, 60);
    setTimeout(function(){
      var rc = wpProp('wp-receipt', 'SUBMISSION RECEIVED<br><span style="font-weight:400">Please do not contact<br>the editorial office.</span>');
      if (rc) requestAnimationFrame(function(){ rc.classList.add('up'); });
    }, 2200);
    ctx.setFlag('submitted');
    window.CODEBOOK_ITEM_LABELS.folder = 'Research Folder \u2014 Submitted';
    ctx.removeItem('folder');           // R1: it goes down the chute, so it leaves your hands
    window.CODEBOOK_SFX('sfx-whoosh', 0.3);
    setLine('System', 'Down the corridor, a brass chute: <b>MANUSCRIPT SUBMISSION &mdash; NO REFUNDS.</b><br><br>The folder goes in. After five acts, it is the first time you have given it <i>away</i>.<br><br>A distant thump. Silence. Then a small printed card comes back up the chute:<br><br><b>SUBMISSION RECEIVED</b><br><i>Your manuscript is now under consideration.<br>Please do not contact the editorial office.</i><div class="state-line win">Folder: SUBMITTED</div>', 'win');
    addChoice('Leave the building', function(){
      clearChoices();
      if (window.CODEBOOK_PLAY_OUTRO) window.CODEBOOK_PLAY_OUTRO(); else ctx.goMap();
    });
  }

  // Act II's ending: the Registry seals the Prediction Slip and releases H-27.
  // The device accepts nonsense as happily as it accepts a real theory -- the consequence
  // of an empty one is deferred to Act IV, where the seal comes off. (STORY.md, WP-1.7.)
  function sealScene(){
    var S = window.CODEBOOK_SLIP;
    clearChoices();
    // The device is real: it comes down on its brass arm holding your slip (ROADMAP 8zn).
    var dev = wpProp('wp-device', '<div class="rod"></div><div class="plate"><img src="icon-slip.webp" alt=""><div class="wax">P-1</div></div>');
    if (dev) setTimeout(function(){ dev.classList.add('down'); window.CODEBOOK_SFX('sfx-whoosh', 0.2); }, 60);
    function deviceUp(){ if (dev) setTimeout(function(){ dev.classList.remove('down'); }, 2600); }
    setLine('System', 'The pneumatic tube above the desk shudders and lowers a small machine on a brass arm:<br><br><b>PREREGISTRATION-ADJACENT DEVICE</b><br><i>Not legally a preregistration device.</i><br><br>' + S.html() +
      '<br><b>ARE YOU SURE THIS IS WHAT YOU EXPECT BEFORE SEEING THE DATA?</b>');
    addChoice('I WOULD LIKE TO SEE THE DATA FIRST', function(){
      window.CODEBOOK_SFX('sfx-klaxon', 0.22);
      setLine('Registry', 'An alarm goes off somewhere below the floor.<br><br>&ldquo;REQUEST NOTED.&rdquo;<br><br>The button retracts into the wall. It does not come back.');
      clearChoices();
      addChoice('YES', doSeal);
    });
    addChoice('YES', doSeal);
    // Walking in mid-errand should not seal it by accident (ROADMAP 8zl, SE1).
    addChoice('Not yet.', function(){
      clearChoices();
      if (dev) dev.classList.remove('down');
      setLine('Prof.', '&ldquo;Fine. The tube will wait. It is the only thing in this building that does.&rdquo;');
    });

    function doSeal(){
      clearChoices();
      var empty = !S.allSound();
      ctx.setFlag('slipSealed');
      ctx.removeItem('grandphrase');     // Act II's decoy has done its job; it goes with the act
      if (empty) ctx.setFlag(window.CODEBOOK_FAIL.theoryEmpty);
      ctx.setFlag('h27issued');          // (the name stayed; it is Act III's gate, not a form)
      if (dev){ dev.classList.add('sealed'); if (empty) dev.classList.add('fire'); deviceUp(); }
      setTimeout(function(){ ctx.addItem('slip'); }, 1400);     // after you have seen the wax go on
      window.CODEBOOK_ITEM_LABELS.folder = 'Research Folder \u2014 Theory Exists';
      window.CODEBOOK_SFX('sfx-stamp', 0.34);
      var common = 'Metal clamps descend. Wax. A date is punched in with considerable force.<br><br>' +
        '&ldquo;What if I&rsquo;m wrong?&rdquo; &mdash; &ldquo;Then you will have learned something.&rdquo;<br>' +
        '&ldquo;And if I&rsquo;m right?&rdquo; &mdash; &ldquo;Possibly.&rdquo;<br><i>(beat)</i><br>' +
        '&ldquo;That&rsquo;s not very reassuring.&rdquo; &mdash; &ldquo;This is Methods.&rdquo;';
      if (empty){
        window.CODEBOOK_SFX('sfx-refuse', 0.3);
        setLine('Registry', common + '<br><br>The tube coughs. The form comes back out <b>on fire</b>, and lands stamped:<br><br><b>THEORY EXISTS<br>INFORMATION CONTENT: 0<br>APPROVED</b><br><br>Nothing blocks you. Nobody stops you. A small robot arrives at a trot from the direction of the Library: &ldquo;Good news! Nothing currently observable could contradict your theory.&rdquo;<div class="state-line">Folder stamped: THEORY EXISTS</div>');
      } else {
        setLine('Registry', common + '<br><br>The tube coughs and hands the slip back, sealed. It goes into the THEORY divider of your folder, and behind it a new divider is already waiting, empty: <b>DATA</b>.<br><br>&ldquo;So that&rsquo;s a theory.&rdquo;<br>&ldquo;That is a <i>promise</i>.&rdquo;<div class="state-line win">Folder stamped: THEORY EXISTS</div>', 'win');
      }
      addChoice('&ldquo;Now what?&rdquo;', function(){
        clearChoices();
        if (window.CODEBOOK_TOAST) window.CODEBOOK_TOAST('Folder: the <b>DATA</b> divider opens &mdash; &#9744;&#9744;&#9744;&#9744;');
        setLine('Prof.', '&ldquo;Now you find out whether you are right.&rdquo; She taps the empty DATA divider in your folder. &ldquo;Four departments before anybody is allowed to speak to a first-year. Go on. They are expecting you, in the way that a tribunal expects anyone.&rdquo;');
      });
    }
  }

  // Act III hand-off: "where exactly did those numbers come from?"
  function askProvenance(first){
    clearChoices();
    setLine('Prof.', first
      ? 'She glances at the folder under your arm, and at the stamps all over it. &ldquo;So you went out and bothered actual humans. Good.&rdquo; She puts her pen down, which she never does. &ldquo;Now the interesting part. Where exactly did those numbers come from?&rdquo;'
      : '&ldquo;Again. Where did they come from?&rdquo;');
    addChoice('A) &ldquo;A hundred and forty students on the register. It&rsquo;s a big dataset.&rdquo;', function(){
      clearChoices();
      setLine('Prof.', '&ldquo;A hundred and forty is not big. It is not <i>meant</i> to be big.&rdquo; She picks the pen back up. &ldquo;I did not ask how many. I asked where they came from.&rdquo;');
      addChoice('Try again', function(){ askProvenance(false); });
    });
    addChoice('B) &ldquo;The survey system exported them.&rdquo;', function(){
      clearChoices();
      setLine('Prof.', '&ldquo;The <i>system</i>.&rdquo; A silence with an edge on it. &ldquo;Systems do not choose who gets asked, or who bothers to answer. People do, and then they write it down, or they don&rsquo;t. Which was it?&rdquo;');
      addChoice('Try again', function(){ askProvenance(false); });
    });
    addChoice('C) &ldquo;The frame was the first-year Methods register, a hundred and forty names. Twelve drawn at random. Nine answered &mdash; seventy-five per cent &mdash; and I know which three didn&rsquo;t.&rdquo;', function(){
      clearChoices();
      ctx.setFlag('provenanceGiven');
      // ROADMAP 8zl, PR1: this answer ends Act III (Fieldwork only finishes its own room).
      if (!ctx.hasFlag('actIIIDone')){ ctx.setFlag('actIIIDone'); if (window.CODEBOOK_CHECK_ACT) window.CODEBOOK_CHECK_ACT(); }
      window.CODEBOOK_SFX('sfx-stamp', 0.32);
      window.CODEBOOK_ITEM_LABELS.folder = 'Research Folder \u2014 Question Has Data';
      setLine('Prof.', '&ldquo;Frame, draw, response rate. In one breath.&rdquo; She takes the folder, stamps it without ceremony, and hands it back. <b>QUESTION HAS DATA.</b><br><br>&ldquo;Most people cannot tell me that in a paragraph. Keep being able to say it &mdash; someone will ask you again when it matters more.&rdquo;<div class="state-line win">+ Folder stamped: QUESTION HAS DATA</div>', 'win');
      // Act III ends here (8zw): after her line, straight to the map and Act IV's opening.
      window.CODEBOOK_AFTER_LINE(12000, function(){ setTimeout(function(){ if (document.getElementById('wp_line')) ctx.goMap(); }, 1600); });
      if (false) addChoice('&ldquo;So now I analyse it?&rdquo;', function(){
        clearChoices();
        setLine('Prof.', '&ldquo;Now you find out whether you were right. You wrote down what you expected before you saw any of this.&rdquo; She returns to her marking. &ldquo;The basement will be delighted to help you <i>not</i> do that. Don&rsquo;t let it.&rdquo;');
      });
    });
  }

  updateDrops();
  // Coming back after she has already handed over the Question: don't replay the
  // seven-second interrogation, greet the player according to how far they've got.
  if (profHere && ctx.hasFlag('whirlpoolDone')){
    clearChoices();
    if (ctx.hasFlag('actVDone') && !ctx.hasFlag('submitted')){
      revealScene();
    } else if (window.CODEBOOK_SLIP.filled() === 4 && !ctx.hasFlag('slipSealed')){
      sealScene();
    } else if ((ctx.hasFlag('actIIIDone') || (ctx.hasFlag('fieldworkDone') && ctx.hasFlag('surveyDone') && ctx.hasFlag('ethicsDone') && ctx.hasFlag('mensaDone'))) && !ctx.hasFlag('provenanceGiven')){
      // The hand-off out of the data act. She does not want the result -- she wants to know
      // how the numbers were made, which is the whole act asked as one question.
      askProvenance(true);
    } else if (ctx.hasFlag('actIIIDone')){
      setLine('Prof.', 'She looks at the stamped folder, then at you. &ldquo;Frame, draw, response rate. Yes. Go and find out whether you were right.&rdquo;');
    } else if (ctx.hasFlag('corridorDone')){
      setLine('Prof.', '&ldquo;You have a question and a folder to keep it in. That is two more things than you had on Wednesday.&rdquo; She turns a page. &ldquo;A question is not evidence. Go and get some.&rdquo;');
    } else {
      setLine('Prof.', '&ldquo;You already have your question. Don&rsquo;t lose it, don&rsquo;t reword it, and don&rsquo;t bring me a topic.&rdquo; A pause. &ldquo;Was there something else?&rdquo;');
    }
  } else if (profHere){ goto('W0'); }
  }
});
</script>

  init: function(ctx){

    if (!sceneWrap.isConnected){ document.body.classList.remove('lt-mobile-show', 'lt-show'); MOBILE.removeEventListener && MOBILE.removeEventListener('change', dockLayout); return; }

    document.body.classList.toggle('lt-mobile-show', on);
    if (on){ if (captionEl.parentNode !== dockEl){ dockEl.appendChild(captionEl); dockEl.appendChild(bingoPanel); } }
    else if (captionEl.parentNode === dockEl){ capHome.insertBefore(captionEl, capNext); cardHome.insertBefore(bingoPanel, cardNext); if (window.CODEBOOK_PHONE_LAYOUT) window.CODEBOOK_PHONE_LAYOUT(); }
  }
  if (MOBILE.addEventListener) MOBILE.addEventListener('change', dockLayout);
  var dockWatch = setInterval(function(){ if (!sceneWrap.isConnected){ clearInterval(dockWatch); document.body.classList.remove('lt-mobile-show', 'lt-show'); } }, 700);

  function startBingo(){
    if (started) return;

    marked = { free:true }; hits = 0;
    renderBingo(); buildArms(); buildQueue();
    dockLayout();
    clearChoices();
    window.CODEBOOK_STOP_ROOM_MUSIC();            // the lecture's own music gives way to the show's
    bmLoad(); bmLoop('tense');
    showEl.style.display = '';
    flash();
    window.CODEBOOK_SFX('sfx-airhorn', 0.1);

    requestAnimationFrame(function(){
      document.getElementById('lt_marquee').classList.add('on');
      document.getElementById('lt_live').classList.add('on');
      document.getElementById('lt_disco').classList.add('on');

    });

    pump(6);
    setLine('System', 'You hold up the bingo card. Somewhere in the back row somebody whispers <i>eyes down</i>, and sixty bingo cards come out from under sixty benches.<br><br>Dr. Vossberg does not look up. He never does.');
    setTimeout(function(){ if (!gone()) host('intro'); }, 900);
    setTimeout(function(){
      if (gone()) return;
      bingoPanel.style.display = 'flex';
      document.getElementById('lt_marquee').classList.remove('on');

  }

  function winLecture(){
    clearChoices();
    // The protagonist's only voiced line in the game. Everything else attributed to "You"
    // is their own inner voice; this is the one time they say something out loud, in a

    window.CODEBOOK_SFX('sfx-applause-small', 0.32);

    setTimeout(function(){
      setLine('Dr. Vossberg', 'He blinks. He looks at the board, then at his notes, then at the board again. The thread is gone, and everyone can see it go.');
      started = false; playing = false;
      bingoPanel.style.display = 'none';

    }, 1200);
    setTimeout(function(){
      if (!document.getElementById('lt_lectLecturing')) return;
      setLine('System', 'He gathers up the printout, mutters something that is not quite an apology, and walks out.');
      walkRoute([640], leaveForOffice, { exit: true });   // out to the right, past the lectern (the left is all seating)
      setTimeout(leaveForOffice, 7000);   // safety net if the walk is cut short
    }, 3400);
    var left = false;
    function leaveForOffice(){
      if (left || !document.getElementById('lt_lectLecturing')) return;
      left = true;
      if (!ctx.hasFlag('lectureDone')) ctx.complete();
      ctx.setFlag('lecturerGone');    // he has left this room
      ctx.setFlag('profAtOffice');    // and the nine o'clock is over, so she will come back
      if (celebrating) justWon = true;

      // after a BINGO the back rows are still on their feet: they stay for this visit (8zt)

      setLine('System', (justWon

        : 'The theatre is empty. The chalk diagram is still on the board, looping back into itself.') + '<div class="state-line win">+ Lecture derailed. Forty minutes early.</div>');
      var bar = document.createElement('div'); bar.className = 'continuebar';
      var btn = document.createElement('button'); btn.className = 'continue'; btn.textContent = 'Continue to Campus Map →';
      btn.addEventListener('click', ctx.goMap);
      choicesEl.appendChild(bar); bar.appendChild(btn);
    }
  }


  // ---- lecturer presence. ROADMAP 8o: these used to be ONE flag, because the lecturer
  // used to be the Professor -- winning bingo sent the same sprite from this room to the
  // Office, and drawing on the blackboard called him back, which also emptied the Office
  // again. They are two people now, so they need two flags:
  //
  //   lecturerGone   this room only. Set by bingo, cleared by drawing on the blackboard,
  //                  which he cannot resist coming back to correct.
  //   profAtOffice   the Office only, and never cleared. Set two ways, because gating Act I
  //                  on winning a minigame in here was wrong: ASK him where she is (the
  //                  intended route -- he is covering her class and knows), or derail the
  //                  lecture, which ends the nine o'clock she is refusing to be in the
  //                  building for. Summoning the lecturer back does not un-empty it.
  var lecturerHere = !ctx.hasFlag('lecturerGone');
  var justWon = false;
  var zoneEls = [];
  function clearZones(){ zoneEls.forEach(function(z){ z.remove(); }); zoneEls = []; }

  var AMBIENT_LINES = [
    { text:'He is mid-sentence about something that might be Luhmann and might not be. It is difficult to find an opening.' },
    { text:'&ldquo;&hellip;which is either the point, or entirely beside it, and frankly the distinction is undecidable.&rdquo;', audio:'lecture-ambient-quote.mp3' },
    { text:'You catch the phrase &ldquo;operatively closed&rdquo; three times in one breath. He does not appear to need air.' },
    { text:'He draws a circle, then an arrow out of the circle, then an arrow back into the circle. He looks pleased about this.' }
  ];
  var ambientIndex = 0;

  var DOODLE_LINES = [
    'Skulls, a column, a cathedral, a suspiciously accurate campus map, and a cat. No notes on autopoiesis.',
    'You add a small speech bubble coming out of the cat. It says nothing useful either.',
    'A second cat. This one is judging the first cat.',
    'You attempt to draw &ldquo;double contingency.&rdquo; It comes out looking like a crab.',
    'Under the skull, somebody has inked a little three-by-three grid. Two squares are crossed out and one row has a line struck through it. Whoever sat here before you was keeping score of something.'
  ];
  var doodleIndex = 0;

  var STATIC_EXTRAS = [
    { id:'note', kind:'lookat', noun:'the paper airplane', hotspot:{l:16.75,t:82.99,w:8.37,h:10.63},
      lookat:'A note, folded into a paper airplane, never thrown. Too risky mid-lecture, structurally speaking.' },
    { id:'phone', kind:'lookat', noun:'your phone', hotspot:{l:74.16,t:89.37,w:11.96,h:10.63},
      lookat:'A phone, screen dimmed, held just below the sightline of a man who has spent thirty years perfecting the sightline of a lecture hall.' },
    { id:'doodle', kind:'doodle', noun:'your notebook', hotspot:{l:20.33,t:77.68,w:51.44,h:22.32} },
    { id:'board', kind:'board', noun:'the blackboard', hotspot:{l:47.55,t:11.69,w:37.98,h:35.07} },
    { id:'ink', kind:'pickup', itemId:'blackink', flag:'lectureInkTaken', noun:'a bottle of ink',
      hotspot:{l:59.8,t:40,w:4.4,h:7},
      lookat:'A bottle of black ink on the lectern, next to his mug &mdash; the kind of thing a chalkboard-adjacent room somehow always has lying around.',
      lookatTaken:'An empty ring on the lectern where the ink used to be.',
      pickup:'You take the bottle of ink.<div class="state-line win">+ Picked up: A Bottle of Black Ink</div>',
      pickupTaken:'Already yours.' }
  ];

  function addZone(x){
    var el = document.createElement('div');
    el.className = 'door-zone';
    el.dataset.primary = x.kind === 'pickup' ? 'pickup' : x.kind === 'prof' ? 'talkto' : 'lookat';   // phones (8zs)
    if (x.id) el.dataset.zone = x.id;
    el.dataset.verbs = x.kind === 'pickup' ? 'lookat pickup' : x.kind === 'prof' ? 'lookat talkto' : x.kind === 'board' ? 'lookat use' : 'lookat';
    if (x.noun) el.dataset.label = x.noun;
    el.style.left = pct(x.hotspot.l); el.style.top = pct(x.hotspot.t);
    el.style.width = pct(x.hotspot.w); el.style.height = pct(x.hotspot.h);
    el.style.cursor = 'pointer';
    el.addEventListener('mouseenter', function(){ el.classList.add('armed'); hoveredNoun = x.noun; updateSentence(); });
    el.addEventListener('mouseleave', function(){ el.classList.remove('armed'); hoveredNoun = null; updateSentence(); });
    el.addEventListener('click', function(){ handleZoneClick(x); });
    sceneWrap.appendChild(el);
    zoneEls.push(el);
  }

  function handleZoneClick(x){
    if (x.kind === 'lookat'){
      if (selectedVerb === 'lookat'){ setLine('You', x.lookat); }
      else { setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work."); }
      return;
    }
    if (x.kind === 'pickup'){
      if (selectedVerb === 'pickup'){
        if (ctx.hasFlag(x.flag)){
          setLine('You', x.pickupTaken);
        } else {
          ctx.setFlag(x.flag);
          ctx.addItem(x.itemId);
          syncSideInv(x.itemId);
          var spr = document.getElementById('lt_sprite_' + x.id);
          if (spr) spr.style.display = 'none';
          setLine('You', x.pickup);
        }
      } else if (selectedVerb === 'lookat'){
        setLine('You', ctx.hasFlag(x.flag) ? x.lookatTaken : x.lookat);
      } else {
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      }
      return;
    }
    if (x.kind === 'doodle'){
      if (selectedVerb === 'use' && selectedItem === 'magnifyingglass'){
        setLine('You', 'Under the glass, the little grid resolves: each square holds a word in tiny, furious handwriting &mdash; <i>autopoiesis, contingency, closure</i> &mdash; two of them crossed out, one row struck through, and in the margin, pressed hard enough to tear the paper: <b>THREE IN A ROW AND HE STOPS.</b>');
        return;
      }
      if (selectedVerb === 'lookat'){
        setLine('You', DOODLE_LINES[doodleIndex % DOODLE_LINES.length]);
        doodleIndex++;
      } else {
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      }
      return;
    }
    if (x.kind === 'prof'){
      if (selectedVerb === 'use' && selectedItem === 'bingocard'){ startBingo(); return; }
      if (selectedVerb === 'talkto'){
        // The one question he will break off for. He is covering somebody else's nine
        // o'clock and is not enjoying it, so "where is she?" is a subject he has opinions
        // about -- and it is the intended way to get the Professor back to her office.
        // Asking costs nothing, needs nothing, and can be done the moment you walk in.
        var askWhere = !ctx.hasFlag('profAtOffice'), askLuhmann = ctx.hasItem('bingocard') && !started;
        if (askWhere || askLuhmann){
          talkMenu(askWhere, askLuhmann);
          return;
        }
        var ambient = AMBIENT_LINES[ambientIndex % AMBIENT_LINES.length];
        setLine('Dr. Vossberg', ambient.text, null, ambient.audio);
        ambientIndex++;
        return;
      }
      if (selectedVerb === 'lookat'){
        setLine('You', 'Dr. Vossberg, mid-flow, utterly absorbed. He has not looked up once.<br><br>He is not lecturing from notes, though. He is reading off a printout, and the printout has a header on it, and the header has a reference number.');
        return;
      }
      setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      return;
    }
    if (x.kind === 'board'){
      if (selectedVerb === 'use'){
        if (lecturerHere){ setLine('You', 'He&rsquo;s already right there &mdash; drawing on the board now would just be rude.'); return; }
        summonLecturer();
        return;
      }
      if (selectedVerb === 'lookat'){
        setLine('You', lecturerHere
          ? 'A half-finished diagram &mdash; circles, arrows looping back into themselves, one box simply labeled &ldquo;???&rdquo;'
          : 'The half-finished diagram is still up there, one box labelled &ldquo;???&rdquo;, and a stub of chalk is sitting in the tray where he left it. Somebody once told you he can hear a wrong arrow being drawn from two corridors away.');
        return;
      }
      setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
      return;
    }
  }

  function summonLecturer(){
    clearChoices();
    setLine('You', 'You pick up the chalk and draw a big looping diagram &mdash; circles, arrows, something that might say &ldquo;AUTOPOIESIS&rdquo; in increasingly shaky letters.');
    setTimeout(function(){
      ctx.clearFlag('lecturerGone');   // only the lecturer comes back; the Professor stays put
      setLine('Dr. Vossberg', 'He is back at the lectern almost before you have finished the arrow, delighted. &ldquo;Yes &mdash; exactly! Well, not exactly. But energetically, yes!&rdquo;', null, 'lecture-summon.mp3');
      applyPresence(true);
    }, 1400);
  }

  function renderZones(){
    clearZones();
    STATIC_EXTRAS.forEach(addZone);
    if (lecturerHere) addZone({ id:'prof', kind:'prof', noun:'the lecturer', hotspot:{l:46,t:14,w:34,h:57} });
  }

  var curPose = 'lecturing';
  // Gesturing while he talks: swap between the lecturing and pointing poses every ~1.7 s
  // (only while a line of his is playing and he isn't walking), back to lecturing afterwards.
  var gestureTimer = setInterval(function(){
    if (!document.getElementById('lt_lectLecturing')){ clearInterval(gestureTimer); return; }
    var talking = lecturerHere && document.querySelector('#lt_lectTravel .talking');
    var walking = rigBox && rigBox.style.display !== 'none';
    if (walking) return;
    if (talking) setPose(curPose === 'lecturing' ? 'pointing' : 'lecturing');
    else if (curPose === 'pointing' && gestureOn) setPose('lecturing');
    gestureOn = !!talking;
  }, 1700);
  var gestureOn = false;
  function setPose(pose){
    curPose = pose;
    lectLecturing.style.opacity = pose === 'lecturing' ? '1' : '0';
    lectWalking.style.opacity = pose === 'walking' ? '1' : '0';
    lectPointing.style.opacity = pose === 'pointing' ? '1' : '0';
    document.getElementById('lt_mouthWrapL').style.opacity = pose === 'lecturing' ? '1' : '0';
    document.getElementById('lt_mouthWrapP').style.opacity = pose === 'pointing' ? '1' : '0';
    lectWalking.classList.toggle('walking', pose === 'walking'); // stepping bob while he paces
  }
  // Pacing with the cut-out rig: the painted sprite hides, the rig walks each leg of the route
  // at a speed matched to its stride (so the feet don't slide), turning to face where it goes.
  // PROF_RIG is his body -- it was drawn for this character when he and the Professor were
  // still the same person, and he is the one who kept it.
  var lectRig = null, rigBox = document.getElementById('lt_lectRig');
  function ensureRig(){
    var h = lectLecturing.getBoundingClientRect().height || 300;
    var H = h * 1600 / 1549;                       // rig def height vs. visible figure height
    if (lectRig && Math.abs(lectRig.H - H) < 2) return lectRig;
    rigBox.innerHTML = '';
    lectRig = window.CodebookRig.build(rigBox, window.PROF_RIG, { height: H });
    lectRig.H = H;
    lectRig.root.style.top = (-745 * lectRig.scale) + 'px'; // hip sits this far above the soles
    return lectRig;
  }
  function walkRoute(xs, done, opts){
    opts = opts || {};
    var rig = ensureRig(), x = 0, i = 0;
    var pxPerSec = 1300 * rig.scale / window.CodebookRig.walk.period;
    lectLecturing.style.opacity = lectWalking.style.opacity = lectPointing.style.opacity = '0';
    document.getElementById('lt_mouthWrapL').style.opacity = document.getElementById('lt_mouthWrapP').style.opacity = '0';
    rigBox.style.display = '';
    requestAnimationFrame(function(){ rigBox.style.opacity = '1'; });
    rig.play(window.CodebookRig.walk, {});
    (function leg(){
      if (!lecturerHere || !document.getElementById('lt_lectLecturing')){ rig.stop(); return; }
      if (i >= xs.length){
        rig.stop(); rigBox.style.opacity = '0';
        if (!opts.exit) setPose('lecturing');
        setTimeout(function(){ if (rigBox.style.opacity === '0') rigBox.style.display = 'none'; }, 320);
        if (done) done(); return;
      }
      var to = xs[i++], dist = Math.abs(to - x), dur = dist / pxPerSec;
      rigBox.style.transform = to < x ? 'scaleX(-1)' : 'none';
      lectTravel.style.transition = 'transform ' + dur.toFixed(2) + 's linear';
      lectTravel.style.transform = 'translateX(' + to + 'px)';
      x = to;
      setTimeout(leg, dur * 1000 + 250);
    })();
  }

  window.CODEBOOK_DEBUG_LECTURER_WALK = function(){ if (lecturerHere) walkRoute([-170, 130, 0]); }; // for testing
  function schedulePose(){
    if (prefersReducedMotion || !lecturerHere || !document.getElementById('lt_lectLecturing')) return;
    setTimeout(function(){
      if (!lecturerHere || !document.getElementById('lt_lectLecturing')) return;
      if (Math.random() < 0.5){
        walkRoute([-170, 130, 0], function(){ setTimeout(schedulePose, 700); });
      } else {
        setPose('pointing');
        setTimeout(function(){
          if (!lecturerHere || !document.getElementById('lt_lectLecturing')) return;
          setPose('lecturing'); schedulePose();
        }, 2600);
      }
    }, 9000 + Math.random() * 9000);
  }

  function applyPresence(here){
    lecturerHere = here;
    // His audience is there while he lectures and gone once he has walked out (8zm).
    document.querySelectorAll('#lt_sceneWrap .lt-crowd').forEach(function(e){ e.classList.toggle('gone', !here); });
    lectTravel.classList.toggle('behind-crowd', here);
    if (here){
      lectTravel.style.display = '';
      setPose('lecturing');
      schedulePose();
      tagEl.textContent = 'Lecture in progress';
    } else {
      lectTravel.style.display = 'none';
      tagEl.textContent = 'Empty theatre';
      if (ctx.hasFlag('lectureDone') && !justWon) setTimeout(function(){
        if (!lecturerHere && document.getElementById('lt_line')) setLine('System', 'Without him the theatre is very quiet. The chalk is still in the tray, and the diagram on the board is still wrong.');
      }, 2600);
    }
    renderZones();
  }

  // Paper planes (user: "some student should throw a paper plane"). While he lectures,
  // somebody in the rows launches one every so often; it arcs over the heads, stalls, and
  // noses down somewhere near the stage. He does not notice. He never does.
  var PLANE_SVG = '<svg viewBox="0 0 40 24" width="100%" height="100%"><path d="M1 12 L39 2 L17 14 Z" fill="#fbf7ec" stroke="#8a7a60" stroke-width=".8"/>' +
                  '<path d="M17 14 L39 2 L22 22 Z" fill="#e6dcc4" stroke="#8a7a60" stroke-width=".8"/><path d="M17 14 L20 18 L22 22" fill="none" stroke="#8a7a60" stroke-width=".8"/></svg>';
  function throwPlane(){
    if (!sceneWrap.isConnected || !lecturerHere || prefersReducedMotion) return;
    var pl = document.createElement('div');
    pl.style.cssText = 'position:absolute;left:0;top:0;width:4.6%;aspect-ratio:40/24;pointer-events:none;z-index:4;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35));';
    pl.innerHTML = PLANE_SVG;
    sceneWrap.appendChild(pl);
    var W = sceneWrap.clientWidth, H = sceneWrap.clientHeight;
    var fromLeft = Math.random() < 0.5;
    var x0 = (fromLeft ? 0.08 + Math.random() * 0.3 : 0.6 + Math.random() * 0.3) * W, y0 = (0.5 + Math.random() * 0.12) * H;
    var x2 = (0.45 + Math.random() * 0.35) * W, y2 = (0.5 + Math.random() * 0.12) * H;
    var xm = (x0 + x2) / 2, ym = Math.min(y0, y2) - (0.18 + Math.random() * 0.14) * H;
    var dir = x2 > x0 ? 1 : -1, frames = [];
    for (var i = 0; i <= 24; i++){
      var t = i / 24, x = (1-t)*(1-t)*x0 + 2*(1-t)*t*xm + t*t*x2, y = (1-t)*(1-t)*y0 + 2*(1-t)*t*ym + t*t*y2;
      var dx = 2*(1-t)*(xm-x0) + 2*t*(x2-xm), dy = 2*(1-t)*(ym-y0) + 2*t*(y2-ym);
      var ang = Math.atan2(dy, Math.abs(dx)) * 180 / Math.PI;
      frames.push({ transform:'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scaleX(' + dir + ') rotate(' + (ang * dir).toFixed(1) + 'deg) scale(' + (1 - t * 0.2).toFixed(2) + ')', opacity: t > 0.92 ? 0 : 1 });
    }
    var anim = pl.animate(frames, { duration: 2600 + Math.random() * 1200, easing:'cubic-bezier(.3,.1,.6,1)', fill:'forwards' });
    anim.onfinish = function(){ pl.remove(); };
  }
  (function planeLoop(){
    setTimeout(function(){
      if (!sceneWrap.isConnected) return;     // left the room (a later visit runs its own loop)
      throwPlane(); planeLoop();
    }, 9000 + Math.random() * 12000);
  })();
  window.CODEBOOK_LT_THROW_PLANE = throwPlane;   // the bingo throws a few more

  applyPresence(lecturerHere);
  if (lecturerHere){
    setLine('Dr. Vossberg', 'He clears his throat and taps the lectern. &ldquo;Autopoiesis. Structural coupling. Double contingency. Operative closure.&rdquo; He does not appear to be building toward a point.', null, 'lecture-opening.mp3');
  } else {
    setLine(' ', 'The lecture theatre sits empty. Even the echo seems to be taking a break.');
  }
  clearChoices();
  }
});
</script>

      setLine('You', x.lookat);
    } else {
      setLine('You', FALLBACK[selectedVerb] || 'That doesn&rsquo;t seem to work.');
    }
  }

  function checkWin(){
    clearZones();
    delete ctx.GAME.flags.ccPlan;      // a replay gets a fresh order
    ctx.clearFlag('ccPlanSet');
    window.CODEBOOK_CROSSFADE_IMG(bgImg, 'corridor-archway-bg.webp', 600);
    setLine('System', 'Four correlations. Four different truths underneath. The corridor was never testing whether you could guess &mdash; it was testing whether you&rsquo;d stop guessing and actually ask what kind of evidence you had.<br><br><b>The doors align and recede into an archway.</b> Whatever&rsquo;s behind it, it&rsquo;s finally open.');
    caseTagEl.textContent = 'All cases resolved';
    clearChoices();
    var b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = '<b>Step through the archway</b>';
    b.addEventListener('click', function(){
      clearChoices();
      showDoorman(DOORMAN_ARCH, 30); // he walks in from the right
      setLine('System', 'You step through. The Doorman is waiting on the other side, next to a very ordinary hallway &mdash; bookshelves, a bench, a kitchen smell drifting from somewhere.');
      setTimeout(function(){ setLine('You', '&ldquo;Where&rsquo;s the Codebook?&rdquo;'); }, 1400);
      setTimeout(function(){ setLine('The Doorman', '&ldquo;Not here.&rdquo;', '', 'doorman-nothere.mp3'); }, 2700);
      setTimeout(function(){ setLine('You', '&ldquo;You said it was behind the door.&rdquo;'); }, 4400);
      setTimeout(function(){ setLine('The Doorman', '&ldquo;No. I said this was the door.&rdquo;', '', 'doorman-thedoor.mp3'); }, 5800);
      setTimeout(function(){ setLine('The Doorman', '&ldquo;You&rsquo;ve completed Chapter One.&rdquo;', '', 'doorman-chapterone.mp3'); }, 9700);
      setTimeout(function(){
        ctx.removeItem('question');
        ctx.addItem('folder');
        syncSideInv('folder');
        ctx.complete();
        setLine('System', 'He hands over a battered manila folder. Your question goes inside it.<div class="state-line win">+ Research Folder issued. STATUS: QUESTION EXISTS.</div>');
        clearChoices();
        setTimeout(function(){ if (document.getElementById('cc_line')) ctx.goMap(); }, 2600); // straight into the Act II trailer
      }, 12800);
    });
    choicesEl.appendChild(b);
  }

  window.CODEBOOK_DEBUG_CORRIDOR_WIN = function(){ checkWin(); }; // for testing

  function handleDoorClick(doorId){
    if (busy) return;
    var zone = document.querySelector('.door-zone[data-door="' + doorId + '"]');
    if (zone && zone.classList.contains('solved')) return;
    busy = true;
    var room = curRoom();
    var correct = room.correct === doorId;
    if (zone){ zone.classList.add('solved'); zone.style.cursor = 'default'; }
    setLine('System', room.feedback[doorId]);
    clearChoices();
    if (correct){
      pipEls[current].classList.add('full');
      setTimeout(function(){
        if (current < ROOMS.length - 1){
          current++;
          caseTagEl.textContent = 'Case ' + (current + 1) + ' of ' + ROOMS.length;
          renderRoom(false);
          showCase();
        } else {
          checkWin();
        }
      }, 1300);
    } else {
      setTimeout(function(){ startFall(room.feedback[doorId]); }, 900);
    }
  }

  // A wrong door (ROADMAP 8zl, C1): the floor still opens -- that is the joke -- but the
  // feedback that explains WHY stays on screen, and you are shown back up to the same case.
  // It used to show the explanation for 1.3 seconds and send you to the map to redo the gate,
  // the Doorman's speech and every case already solved.
  function startFall(feedback){
    clearZones();
    window.CODEBOOK_SFX('sfx-fall', 0.3);
    setLine('System', feedback + '<div class="state-line">Wrong door. The floor gives way, you slide one storey down a laundry chute, and a very tired attendant walks you back up to the same corridor.</div>');
    clearChoices();
    bgImg.style.transition = 'none';
    bgImg.style.transform = 'scale(1)';
    bgImg.style.opacity = '1';
    bgImg.style.display = 'block';
    window.CODEBOOK_CROSSFADE_IMG(bgImg, 'corridor-fall-bg.webp', 420, function(){
      requestAnimationFrame(function(){
        bgImg.style.transition = 'transform 2.1s ease-in';
        requestAnimationFrame(function(){ bgImg.style.transform = 'scale(1.16)'; });
      });
    });
    setTimeout(function(){
      bgImg.style.transition = 'none'; bgImg.style.transform = 'none';
      renderRoom(false);
      var again = document.createElement('button');
      again.className = 'choice'; again.textContent = 'Read the note again';
      again.addEventListener('click', function(){ clearChoices(); showCase(); });
      choicesEl.appendChild(again);
    }, 3200);
  }

  // The corridor is unlocked on the map from the start of the game; this single-door
  // gate is what actually checks for the question, so the four case rooms stay
  // reachable only once the office has been solved, without map-level locking.
  // The door itself is just a locked-door flavor hotspot; ringing requires selecting
  // Use and clicking the bell, same "select a verb, then click" pattern as the notes.
  var GATE_BG = 'corridor-gate-bg.webp';
  var GATE_DOOR = { l:44.86, t:22.32, w:17.34, h:48.88 };
  var GATE_BELL = { l:64.89, t:42.51, w:5.08, h:15.41 };

  function renderGate(immediate){
    busy = true;
    function apply(){
      showDoorman(null);
      bgImg.style.display = 'block';
      bgImg.style.transition = 'opacity .28s ease';
      bgImg.style.transform = 'none';
      clearZones();
      caseTagEl.textContent = 'Entrance';
      addExtraZone({ id:'gatedoor', kind:'lockeddoor', noun:'the door', hotspot:GATE_DOOR,
        lookat:'A heavy door, unmarked except for a small brass plate: &ldquo;ARCHIVE OF METHOD &mdash; THE CODEBOOK.&rdquo; Whatever that is, it&rsquo;s locked.' });
      addExtraZone({ id:'bell', kind:'bell', noun:'the door bell', hotspot:GATE_BELL,
        lookat:'A small brass door bell, mounted beside the entrance, beneath a plaque that reads &ldquo;RING FOR BETTER QUESTIONS.&rdquo;' });
      setLine('System', 'The door is locked. There&rsquo;s a bell mounted beside it.');
      clearChoices();
      if (immediate) window.CODEBOOK_SET_IMG(bgImg, GATE_BG, function(){
        requestAnimationFrame(function(){ bgImg.style.opacity = '1'; });
      });
      else window.CODEBOOK_CROSSFADE_IMG(bgImg, GATE_BG, 320);
      busy = false;
    }
    apply();
  }

  function handleRing(knocked){
    if (busy) return;
    busy = true;
    window.CODEBOOK_SFX('sfx-doorbell', 0.3);
    setLine('System', knocked
      ? 'You knock. Somewhere inside, a bell rings on your behalf. A long pause, then the door opens a crack.'
      : 'You ring the bell. A long pause, then the door opens a crack.');
    clearChoices();
    setTimeout(function(){
      showDoorman(DOORMAN_GATE);
      if (!ctx.hasItem('question')){
        setLine('The Doorman', '&ldquo;Come back when you&rsquo;ve got a question.&rdquo; The door shuts before you can answer.<div class="state-line">Two things, then: a precisely worded question &mdash; the Professor&rsquo;s office is where those come from &mdash; and the approval of the woman by the pond, who he seems to take seriously.</div>', '', 'doorman-noquestion.mp3');
        clearChoices();
        window.CODEBOOK_AFTER_LINE(2800, function(){ renderGate(true); });
        return;
      }
      if (!ctx.hasFlag('philosopherConvinced')){
        setLine('The Doorman', '&ldquo;A question. Fine. But you don&rsquo;t know what to do with a wrong answer yet &mdash; there&rsquo;s a woman by the pond who does. Convince her first.&rdquo; He nods vaguely west and shuts the door.', '', 'doorman-noskeptic.mp3');
        clearChoices();
        window.CODEBOOK_AFTER_LINE(10800, function(){ renderGate(true); });
        return;
      }
      setLine('The Doorman', '&ldquo;Question?&rdquo; He looks at what you&rsquo;re holding, grunts, and pulls the door open. &ldquo;Four cases behind this door. Get the causal story right on all of them, and you&rsquo;ve earned a look at the Codebook. Get it wrong, and you&rsquo;ll be explaining yourself to the floor.&rdquo;', '', 'doorman-pass.mp3');
      clearChoices();
      // ends when he finishes OR when the player skips him, never on a fixed 13 seconds
      window.CODEBOOK_AFTER_LINE(13400, function(){
        setLine('System', 'You step through.');
        setTimeout(function(){
          current = 0;
          caseTagEl.textContent = 'Case 1 of ' + ROOMS.length;
          renderRoom(false);
          setTimeout(showCase, 600);
        }, 700);
      });
    }, 700);
  }

  renderGate(true);
  }
});
</script>
<script>
/* ============================== ROOM: PROBABILITY POND ============================== */
CODEBOOK_REGISTER({
  id: 'pond', act: 'Act I', title: 'Probability Pond', doneFlag: 'pondDone',
  prereq: null, lockedHint: '',
  html: `

    <button class="hotspot" data-id="plaque" data-label="A wooden plaque" style="left:5%;top:54%;width:20%;height:9%;"></button>
    <button class="hotspot" data-id="water" data-label="The open water, towards the bridge" style="left:42%;top:38%;width:30%;height:17%;"></button>
    <img id="pd_bswan" src="pond-black-swan.webp" alt="" style="position:absolute;left:88%;top:35%;width:8.4%;opacity:0;pointer-events:none;transition:left 5s ease-out, top 5s ease-out, opacity 1.2s ease;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));">
    <button class="hotspot" data-id="philosopher" data-label="A woman on the bench" style="left:79%;top:46%;width:16%;height:40%;"></button>

  </div>

  </div>
`,
  init: function(ctx){
  var speakerEl = document.getElementById('pd_speaker');
  var lineEl = document.getElementById('pd_line');
  var choicesEl = document.getElementById('pd_choices');
  var hintEl = document.getElementById('pd_hint');
  var sentenceEl = document.getElementById('pd_sentenceLine');
  var verbGrid = document.getElementById('pd_verbGrid');
  var bgImg = document.getElementById('pd_bg');
  window.CODEBOOK_AMBIENCE('amb-pond', 0.11);

  function setLine(speaker, html, cls, audioSrc){
    speakerEl.textContent = speaker;
    speakerEl.className = 'speaker' + (cls ? ' ' + cls : '');
    lineEl.innerHTML = html;
    window.CODEBOOK_PLAY_LINE(audioSrc, html);
  }
  function clearChoices(){ choicesEl.innerHTML = ''; window.CODEBOOK_CHOICE_COUNT(choicesEl); }

  var selectedItem = null;
  function syncSideInv(lastAddedId){
    window.CODEBOOK_RENDER_SIDE_INV('pd_sideInv', ctx.GAME.inventory, lastAddedId || null, 'pd_sideInvLabel', 'pd_sideInvPreviewImg', 'pd_sideInvPreviewName',
      function(id){
        // Look at, in the inventory, answers in this room's own dialogue box.
        if (selectedVerb === 'lookat'){ setLine('You', window.CODEBOOK_ITEM_LOOK(id)); return; }
        selectedVerb = 'use'; selectedItem = id;
        verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === 'use'); });
        syncSideInv();
        updateSentence();
      }, selectedItem);
  }
  syncSideInv();

  var VERBS = [
    {id:'lookat', label:'Look At'}, {id:'talkto', label:'Talk To'},
    {id:'pickup', label:'Pick Up'}, {id:'use', label:'Use'}
  ];
  var FALLBACK = {
    talkto: 'No response. Swans are not known for conversation.',
    pickup: 'That&rsquo;s not coming with you.',
    use: 'You can&rsquo;t think what you&rsquo;d use that for.'
  };
  var selectedVerb = 'lookat';
  var hoveredNoun = null;
  function verbLabel(id){ return VERBS.filter(function(v){ return v.id === id; })[0].label; }
  function updateSentence(){
    var label = verbLabel(selectedVerb);
    if (selectedVerb === 'use' && selectedItem){
      var itemName = window.CODEBOOK_ITEM_LABELS[selectedItem] || selectedItem;
      sentenceEl.textContent = 'Use ' + itemName + (hoveredNoun ? ' with ' + hoveredNoun : '…');
      return;
    }
    sentenceEl.textContent = hoveredNoun ? (label + ' ' + hoveredNoun) : (label + '…');
  }
  VERBS.forEach(function(v){
    var b = document.createElement('button');
    b.className = 'verb-btn' + (v.id === selectedVerb ? ' active' : '');
    b.textContent = v.label; b.dataset.verb = v.id;
    b.addEventListener('click', function(){
      selectedVerb = v.id;
      if (v.id !== 'use'){ selectedItem = null; syncSideInv(); }
      verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === v.id); });
      updateSentence();
    });
    verbGrid.appendChild(b);
  });
  updateSentence();

  var NOUNS = { swanright:'the swan', swanleft:'the other swan', plaque:'the plaque', philosopher:'the woman on the bench', water:'the open water', coleman:'the man in the boat' };
  // simple controls (8zx): what each thing at the pond answers
  [['philosopher','lookat talkto'], ['coleman','lookat talkto'], ['water','lookat'], ['plaque','lookat'], ['swanleft','lookat'], ['swanright','lookat']].forEach(function(v){
    var b = document.querySelector('#pd_sceneWrap .hotspot[data-id="' + v[0] + '"], .hotspot[data-id="' + v[0] + '"]'); if (b) b.dataset.verbs = v[1];
  });
  // ROADMAP 8zl, P1. The counterexample is FOUND, not made: painting a white swan black is
  // the joke, and she rejects it ("You made that"). Watching the water brings a real black
  // swan out from under the bridge, which refutes the plaque and convinces her in one beat.
  var falsified = ctx.hasFlag('pondDone');
  var colemanTalk = 0;
  var convinced = ctx.hasFlag('philosopherConvinced');
  var bswan = document.getElementById('pd_bswan');
  function swanRests(){ bswan.style.transition = 'none'; bswan.style.left = '55%'; bswan.style.top = '43%'; bswan.style.opacity = '1'; }
  if (falsified){ swanRests(); if (!convinced){ convinced = true; ctx.setFlag('philosopherConvinced'); } }
  var inked = false;

  document.querySelectorAll('.hotspot').forEach(function(hs){
    hs.addEventListener('mouseenter', function(){ hoveredNoun = NOUNS[hs.dataset.id]; updateSentence(); hintEl.textContent = hs.dataset.label; hintEl.classList.add('show'); });
    hs.addEventListener('mouseleave', function(){ hoveredNoun = null; updateSentence(); hintEl.classList.remove('show'); });
    hs.addEventListener('click', function(){
      var id = hs.dataset.id;
      if (id === 'plaque'){
        if (selectedVerb === 'lookat'){
          setLine('You', falsified
            ? 'The plaque still reads &ldquo;ALL SWANS ARE WHITE &mdash; ESTABLISHED FACT (N=2).&rdquo; In front of it, entirely unbothered, floats a black swan. The plaque has not been updated. Plaques never are.'
            : 'A weathered wooden plaque: &ldquo;ALL SWANS ARE WHITE &mdash; ESTABLISHED FACT (N=2).&rdquo; The sample size is doing a great deal of work here.');
          return;
        }
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
        return;
      }
      if (id === 'philosopher'){
        if (selectedVerb === 'lookat'){
          setLine('You', falsified
            ? 'The woman on the bench, watching the black swan with the quiet satisfaction of someone whose worldview just survived contact with evidence.'
            : 'A woman on a bench, watching the pond, radiating the specific patience of someone who has had this exact argument many times and lost none of them. A thick notebook rests beside her, spine out: <i>THINGS I WAS WRONG ABOUT, VOL. XI</i>.');
          return;
        }
        if (selectedVerb === 'talkto'){
          if (!falsified){
            setLine('You', '&ldquo;Nice sign,&rdquo; you say, nodding at the plaque. She doesn&rsquo;t look up. &ldquo;It&rsquo;s not evidence, it&rsquo;s a headline,&rdquo; she says. &ldquo;Two swans doesn&rsquo;t establish anything. Show me one counterexample, and I&rsquo;ll believe you understand the difference between believing something and having a reason to.&rdquo;<br><br><i>(You could keep staring at these two. Or you could go and look at the rest of the pond, over towards the bridge.)</i>', null, 'pond-skeptic-reject.mp3');
            return;
          }
          if (!convinced){      // (old saves only: now she is convinced the moment the swan appears)
            convinced = true;
            ctx.setFlag('philosopherConvinced');
            setLine('You', 'You explain it plainly: one black swan is all it takes, because the claim was never really about two swans &mdash; it was about all of them. She looks past you at the pond for a long moment. &ldquo;Huh.&rdquo; A pause. &ldquo;Alright. You&rsquo;ve got the idea. Don&rsquo;t let it go to your head.&rdquo;<div class="state-line win">+ She&rsquo;s convinced, against all odds.</div>', null, 'pond-skeptic-convinced.mp3');
            return;
          }
          setLine('You', '&ldquo;Still holds up,&rdquo; she says, without looking up from the pond. High praise, by her standards.', null, 'pond-skeptic-holds.mp3');
          return;
        }
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
        return;
      }
      if (id === 'water'){
        if (falsified){ setLine('You', 'The black swan paddles a slow circle, entirely unaware it has settled an argument.'); return; }
        if (selectedVerb === 'lookat' || selectedVerb === 'use' || selectedVerb === 'talkto'){
          setLine('You', 'You sit on the low wall and watch the water towards the bridge. Nothing. Leaves. A duck that is not a duck. More nothing.<br><br>You keep watching.');
          setTimeout(function(){
            window.CODEBOOK_SFX('sfx-splash', 0.18);
            bswan.style.opacity = '1';
            requestAnimationFrame(function(){ bswan.style.left = '55%'; bswan.style.top = '43%'; });
            setTimeout(function(){
              falsified = true; convinced = true;
              ctx.setFlag('philosopherConvinced');
              ctx.complete();
              setLine('The Skeptic', 'From under the bridge, slowly, a black swan glides out onto the open water. Nobody put it there.<br><br>The woman on the bench closes her notebook. &ldquo;That one I believe.&rdquo; &ldquo;You didn&rsquo;t make it. You went and looked.&rdquo; &ldquo;One real black swan, and all swans are white is finished. Two white ones never proved it.&rdquo;<div class="state-line win">&ldquo;All swans are white&rdquo; falsified &mdash; by something you found.</div>');
            }, 4200);
          }, 2600);
          return;
        }
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
        return;
      }
      if (id === 'coleman'){
        if (selectedVerb === 'lookat'){ setLine('You', 'A small rowing boat in the middle of Probability Pond. The man at the oars is James Coleman, and the boat is his: painted on the hull, a trapezoid of arrows. MACRO down to micro, micro across to micro, micro back up to MACRO. He is rowing it, patiently, in exactly that shape.'); return; }
        if (selectedVerb === 'talkto'){
          var CL = ['&ldquo;Everybody wants to row straight across the top. Big cause, big effect, home by lunch.&rdquo; <i>(he dips the oars)</i> &ldquo;You have to go down to the people, see what they actually do, and come back up. Otherwise you have not crossed anything. You have only pointed.&rdquo;',
                    '&ldquo;Your plaque, for instance. It says something about all the swans.&rdquo; <i>(a long pull on the oars)</i> &ldquo;Has anyone asked a swan?&rdquo;',
                    '&ldquo;It is not a very fast boat.&rdquo; <i>(he looks at the hull)</i> &ldquo;It is the only one that gets to the other side.&rdquo;'];
          setLine('James Coleman', CL[(colemanTalk++) % CL.length]); return;
        }
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
        return;
      }
      if (id === 'swanleft'){
        if (selectedVerb === 'lookat'){ setLine('You', 'A perfectly ordinary white swan. Statistically speaking, it is currently carrying the entire claim on the plaque.'); return; }
        if (selectedVerb === 'use' && selectedItem === 'blackink'){ setLine('You', 'This one paddles away the moment the bottle comes out. It has clearly seen this before.'); return; }
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
        return;
      }
      if (id === 'swanright'){
        if (falsified){
          if (selectedVerb === 'lookat'){ setLine('You', 'Still white, still indignant about the ink. It shares the pond now with a black swan nobody painted. The plaque is outnumbered.'); return; }
          if (selectedVerb === 'use' && selectedItem === 'blackink'){ setLine('You', 'No need. The pond already has a real black swan in it. Painting this one would only be a craft project.'); return; }
          setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
          return;
        }
        if (selectedVerb === 'lookat'){ setLine('You', 'A second white swan. Between the two of them, an entire universal claim rests on remarkably little data.'); return; }
        if (selectedVerb === 'use' && selectedItem === 'blackink'){
          if (inked) return;
          inked = true;
          window.CODEBOOK_SFX('sfx-splash', 0.28);
          selectedItem = null; syncSideInv(); updateSentence();
          window.CODEBOOK_CROSSFADE_IMG(bgImg, 'pond-bg-falsified.webp', 700);
          setLine('The Skeptic', 'You tip the bottle over the swan. It regards you with professional betrayal and paddles on, now entirely black.<br><br>The woman on the bench does not even look up. &ldquo;You made that.&rdquo; &ldquo;A counterexample you manufactured is not evidence. It is a craft project.&rdquo; &ldquo;Show me one you <i>found</i>.&rdquo;');
          setTimeout(function(){
            window.CODEBOOK_SFX('sfx-splash', 0.22);
            window.CODEBOOK_CROSSFADE_IMG(bgImg, 'pond-bg.webp', 900);
            setLine('You', 'The swan ducks its head under, twice, and comes up white again. Ink, it turns out, is not a research method.');
            inked = false;
          }, 7000);
          return;
        }
        setLine('You', FALLBACK[selectedVerb] || "That doesn't seem to work.");
        return;
      }
    });
  });
  }
});
</script>
<script>
/* ============================== ACT INTERLUDES: II, IV, V ============================== */
(function(){
  // Same shape as the Act III interlude: a few narrated panels, a room montage, and a big
  // ACT card. Narration is final and ready to be voiced.
  // Same helper as the Act III block, which is in a different IIFE.
  function label(l, t, txt){

  window.CODEBOOK_PLAY_OUTRO = function(){

      { src:'outro-5-verdict.webp',

      { src:'outro-6-monkey.webp',
        text:'<i>After the credits.</i> A dark office. One monitor. A submission queue eleven items deep. The camera pans down.<br><br>A small monkey is sitting at the keyboard. Its lanyard is on backwards. Behind its ear, a red pen you last saw in the Professor&rsquo;s hand. Beside it: half a banana, a mug reading <b>REVIEWER 2</b>, and a rubber stamp reading MAJOR CONCERNS.<br><br>You have met. It asked a question at the keynote.' },

<script>

(function(){

CODEBOOK_REGISTER({

  init: function(ctx){

      { id:1, ok:true,  t:'Petersen &amp; Alvarez (2021), <i>Studies in Higher Education</i>' },

          'font:700 clamp(5px,.62vw,10px) \'JetBrains Mono\',monospace;letter-spacing:.06em;padding:.15em .35em;box-shadow:0 2px 4px rgba(0,0,0,.5);animation:lbTag .4s ease-out;">' +

      api.say('You', 'You wait for the M&uuml;ller &amp; Singh paper to come round, and snatch it off the belt. The mechanical arm stickers your sleeve <b>RELEVANT</b> anyway.<br><br>The abstract says attendance helps. The conclusion, on page nine, says the association vanished after adjustment.<br><br>&ldquo;KIRA, this paper says the opposite of what you said it says.&rdquo; &mdash; &ldquo;The words &lsquo;attendance&rsquo; and &lsquo;grades&rsquo; both appear 37 times.&rdquo;<br><br>A tiny superscript reads <i>*association attenuated to zero after adjustment</i>. &ldquo;The asterisk appeared statistically insignificant.&rdquo;<div class="state-line win">+ Caught: it does not say that</div>');
