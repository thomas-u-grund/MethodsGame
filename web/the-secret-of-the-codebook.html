        xy:{l:11.96,t:13.82,w:13.46,h:55.26}, yx:{l:29.61,t:13.82,w:13.46,h:55.26},
        zxy:{l:52.93,t:13.82,w:13.46,h:55.26}, coincidence:{l:68.78,t:13.82,w:13.46,h:55.26}
      },
      plaques: {
        xy:{l:14.05,t:13.82,w:6.88,h:3.72}, yx:{l:33.19,t:13.82,w:6.88,h:3.72},
        zxy:{l:54.43,t:13.82,w:6.88,h:3.72}, coincidence:{l:73.27,t:13.82,w:6.88,h:3.72}
      },
      feedback: {
        xy: '&ldquo;Say the sentence out loud. &lsquo;More Nicolas Cage movies cause more drownings.&rsquo; If you can&rsquo;t say it without laughing, it&rsquo;s not this door.&rdquo;',
        yx: '&ldquo;Say the sentence out loud, the other way. Still can&rsquo;t.&rdquo;',
        zxy: '&ldquo;Now name the Z that plausibly drives both a working actor&rsquo;s annual film count <i>and</i> a national drowning tally. If you can&rsquo;t, you&rsquo;ve just described this door instead: enough time-series lying around, some will drift together by chance alone.&rdquo;',
        coincidence: 'Correct. A spurious correlation &mdash; no mechanism, no confound, just noise across enough variables.'
      },
      extras: [
        { id:'note', kind:'note', noun:'the note', hotspot:{l:43.96,t:20.19,w:5.68,h:19.13} },
        { id:'nameplate', kind:'pickup', itemId:'znameplate', flag:'ccNameplateTaken', noun:'the nameplate',
          hotspot:{l:83.43,t:72.79,w:8.37,h:8.50},
          lookat:'A small brass nameplate, dusty, engraved simply &ldquo;Z.&rdquo;',
          lookatTaken:'No nameplate here anymore.',
          pickup:'You take the nameplate. Portable proof of a confound, for whenever you need one.<div class="state-line win">+ Picked up: A Brass &ldquo;Z&rdquo; Nameplate</div>',
          pickupTaken:'Already yours.' },
        { id:'skeleton', kind:'lookat', noun:'whoever that is',
          hotspot:{l:79.55,t:46.76,w:8.37,h:27.63},
          lookat:'A skeleton with an empty popcorn bucket. The sign reads &ldquo;Waited for the twist. There wasn&rsquo;t one.&rdquo;' },
        { id:'chalkboard', kind:'lookat', noun:'the chalkboard',
          hotspot:{l:87.62,t:38.26,w:11.66,h:36.13},
          lookat:'A cracked chalkboard: a half-erased diagram of circles and arrows. One node has been rubbed away entirely.' }
      ]
    }
  ];

  var current = 0;
  var zoneEls = [];

  var pipEls = [];
  ROOMS.forEach(function(){ var p = document.createElement('div'); p.className = 'pip'; pipsHost.appendChild(p); pipEls.push(p); });

  function clearZones(){
    zoneEls.forEach(function(z){ z.remove(); });
    zoneEls = [];
  }

  function addLabel(type, box){
    var lab = document.createElement('div');
    lab.className = 'cc-label';
    lab.innerHTML = '<span>' + DOOR_LABELS[type] + '</span>';
    lab.style.left = pct(box.l); lab.style.width = pct(box.w);
    lab.style.top = pct(box.t); lab.style.height = pct(box.h);
    sceneWrap.appendChild(lab);
    zoneEls.push(lab);
  }

  function addDoorZone(type, box, plaqueBox){
    var el = document.createElement('div');
    el.className = 'door-zone'; el.dataset.door = type;
    el.style.left = pct(box.l); el.style.top = pct(box.t);
    el.style.width = pct(box.w); el.style.height = pct(box.h);
    el.style.cursor = 'pointer';
    el.addEventListener('mouseenter', function(){ el.classList.add('armed'); });
    el.addEventListener('mouseleave', function(){ el.classList.remove('armed'); });
    el.addEventListener('click', function(){ handleDoorClick(type); });
    sceneWrap.appendChild(el);
    zoneEls.push(el);
    addLabel(type, plaqueBox);
  }

  // A small procedural squiggle of "handwriting" drawn over the note card, so it
  // visibly holds something illegible instead of looking like blank paper.
  function addScribble(box){
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 200 260');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.position = 'absolute'; svg.style.pointerEvents = 'none';
    svg.style.left = pct(box.l); svg.style.top = pct(box.t);
    svg.style.width = pct(box.w); svg.style.height = pct(box.h);
    for (var i = 0; i < 9; i++){
      var y = 18 + i * 25 + (Math.random() * 6 - 3);
      var x = 16, d = 'M ' + x + ' ' + y;
      while (x < 184){
        var dx = 9 + Math.random() * 11;
        var dy = Math.random() * 11 - 5.5;
        d += ' q ' + (dx / 2) + ' ' + (dy * 1.4) + ' ' + dx + ' ' + dy;
        x += dx;
      }
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#3A2A18');
      path.setAttribute('stroke-width', '2.3');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('opacity', (0.5 + Math.random() * 0.22).toFixed(2));
      svg.appendChild(path);
    }
    sceneWrap.appendChild(svg);
    zoneEls.push(svg);
  }

  function addExtraZone(x){
    var el = document.createElement('div');
    el.className = 'door-zone' + (x.kind === 'pickup' && ctx.hasFlag(x.flag) ? ' solved' : '');
    el.dataset.extra = x.id;
    el.style.left = pct(x.hotspot.l); el.style.top = pct(x.hotspot.t);
    el.style.width = pct(x.hotspot.w); el.style.height = pct(x.hotspot.h);
    el.style.cursor = 'pointer';
    el.addEventListener('mouseenter', function(){ el.classList.add('armed'); hoveredNoun = x.noun; updateSentence(); });
    el.addEventListener('mouseleave', function(){ el.classList.remove('armed'); hoveredNoun = null; updateSentence(); });
    el.addEventListener('click', function(){ handleExtraClick(x, el); });
    sceneWrap.appendChild(el);
    zoneEls.push(el);
    if (x.kind === 'note') addScribble(x.hotspot);
  }

  function renderRoom(immediate){
    var plan = corridorPlan();
    var room = curRoom();
    busy = true;
    function apply(){
      showDoorman(null);
      bgImg.style.display = 'block';
      clearZones();
      // extras render first so doors (added after, thus stacked on top) always win a
      // click in any overlap, e.g. a skeleton's hotspot sprawling toward a doorway.
      (room.extras || []).forEach(addExtraZone);
      // DOOR_ORDER is the painted left-to-right geometry; the plan says which relation is
      // behind each of those four positions this run.
      var seats = DOOR_ORDER.map(function(t){ return { door: room.doors[t], plaque: room.plaques[t] }; });
      plan.doors[plan.order[current]].forEach(function(type, i){
        addDoorZone(type, seats[i].door, seats[i].plaque);
      });
      // Cross-fade rather than fade-out-then-in: the old way went through --wall and
      // showed a blue screen between the two paintings.
      if (immediate) window.CODEBOOK_SET_IMG(bgImg, room.bg, function(){
        requestAnimationFrame(function(){ bgImg.style.opacity = '1'; });
      });
      else window.CODEBOOK_CROSSFADE_IMG(bgImg, room.bg, 320);
      busy = false;
    }
    apply();
  }

  function handleExtraClick(x, zone){
    if (busy) return;
    if (x.kind === 'note'){
      if (selectedVerb === 'use'){
        if (ctx.hasItem('magnifyingglass')){
          setLine('You', 'You hold the magnifying glass up to the note:<br><br>&ldquo;' + curRoom().text + '&rdquo;');
        } else {
          setLine('You', 'The handwriting is far too small to make out by eye. You&rsquo;d need something to magnify it with.');
        }
      } else {
        setLine('You', 'A note, pinned to the wall &mdash; covered in impossibly small handwriting. You can&rsquo;t make out a single word without magnification.');
      }
      return;
    }
    if (x.kind === 'lockeddoor'){
      if (selectedVerb === 'lookat'){ setLine('You', x.lookat); return; }
      // Knocking is ringing. Players reported "the door would not open, and there was no
      // Doorman" with the Question in hand: they used the door (or the Question on the
      // door), got "The door is locked." and never found the small bell beside it. Anything
      // you actually DO to the door now fetches him, exactly as the bell does.
      if (selectedVerb === 'use' || selectedVerb === 'talkto'){ handleRing(true); return; }
      setLine('You', 'The door is locked. There&rsquo;s a bell beside it &mdash; or you could just knock.');
      return;
    }
    if (x.kind === 'bell'){
      if (selectedVerb === 'use'){ handleRing(); return; }
      if (selectedVerb === 'lookat'){ setLine('You', x.lookat); return; }
      setLine('You', FALLBACK[selectedVerb] || 'That doesn&rsquo;t seem to work.');
      return;
    }
    if (x.kind === 'pickup'){
      if (selectedVerb === 'pickup'){
        if (ctx.hasFlag(x.flag)){
          setLine('You', x.pickupTaken);
        } else {
          ctx.setFlag(x.flag);
          ctx.addItem(x.itemId);
          syncSideInv(x.itemId);
          zone.classList.add('solved');
          setLine('You', x.pickup);
        }
      } else if (selectedVerb === 'lookat'){
        setLine('You', ctx.hasFlag(x.flag) ? x.lookatTaken : x.lookat);
      } else {
        setLine('You', FALLBACK[selectedVerb] || 'That doesn&rsquo;t seem to work.');
      }
      return;
    }
    // kind === 'lookat'
    if (selectedVerb === 'lookat'){
      setLine('You', x.lookat);
    } else {
      setLine('You', FALLBACK[selectedVerb] || 'That doesn&rsquo;t seem to work.');
    }
  }

  function checkWin(){
    clearZones();
    delete ctx.GAME.flags.ccPlan;      // a replay gets a fresh order
    ctx.clearFlag('ccPlanSet');
    window.CODEBOOK_CROSSFADE_IMG(bgImg, 'corridor-archway-bg.webp', 600);
    setLine('System', 'Four correlations. Four different truths underneath. The corridor was never testing whether you could guess &mdash; it was testing whether you&rsquo;d stop guessing and actually ask what kind of evidence you had.<br><br><b>The doors align and recede into an archway.</b> Whatever&rsquo;s behind it, it&rsquo;s finally open.');
    caseTagEl.textContent = 'All cases resolved';
    clearChoices();
    var b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = '<b>Step through the archway</b><br>Uses: A Precisely Worded Question';
    b.addEventListener('click', function(){
      clearChoices();
      showDoorman(DOORMAN_ARCH, 30); // he walks in from the right
      setLine('System', 'You step through. The Doorman is waiting on the other side, next to a very ordinary hallway &mdash; bookshelves, a bench, a kitchen smell drifting from somewhere.');
      setTimeout(function(){ setLine('You', '&ldquo;Where&rsquo;s the Codebook?&rdquo;'); }, 1400);
      setTimeout(function(){ setLine('The Doorman', '&ldquo;Not here.&rdquo;', '', 'doorman-nothere.mp3'); }, 2700);
      setTimeout(function(){ setLine('You', '&ldquo;You said it was behind the door.&rdquo;'); }, 4400);
      setTimeout(function(){ setLine('The Doorman', '&ldquo;No. I said this was the door.&rdquo;', '', 'doorman-thedoor.mp3'); }, 5800);
      setTimeout(function(){ setLine('The Doorman', '&ldquo;You&rsquo;ve completed Chapter One.&rdquo;', '', 'doorman-chapterone.mp3'); }, 9700);
      setTimeout(function(){
        ctx.removeItem('question');
        ctx.addItem('folder');
        syncSideInv('folder');
        ctx.complete();
        setLine('System', 'He hands over a battered manila folder. Your question goes inside it.<div class="state-line win">+ Research Folder issued. STATUS: QUESTION EXISTS.</div>');
        clearChoices();
        setTimeout(function(){ if (document.getElementById('cc_line')) ctx.goMap(); }, 2600); // straight into the Act II trailer
      }, 12800);
    });
    choicesEl.appendChild(b);
  }

  window.CODEBOOK_DEBUG_CORRIDOR_WIN = function(){ checkWin(); }; // for testing

  function handleDoorClick(doorId){
    if (busy) return;
    var zone = document.querySelector('.door-zone[data-door="' + doorId + '"]');
    if (zone && zone.classList.contains('solved')) return;
    busy = true;
    var room = curRoom();
    var correct = room.correct === doorId;
    if (zone){ zone.classList.add('solved'); zone.style.cursor = 'default'; }
    setLine('System', room.feedback[doorId]);
    clearChoices();
    if (correct){
      pipEls[current].classList.add('full');
      setTimeout(function(){
        if (current < ROOMS.length - 1){
          current++;
          caseTagEl.textContent = 'Case ' + (current + 1) + ' of ' + ROOMS.length;
          renderRoom(false);
          setLine('System', 'There&rsquo;s a note pinned to the wall. It might help you figure out where to go.');
        } else {
          checkWin();
        }
      }, 1300);
    } else {
      setTimeout(startFall, 1300);
    }
  }

  function startFall(){
    clearZones();
    window.CODEBOOK_SFX('sfx-fall', 0.3);
    setLine('System', 'Wrong door. The floor gives way &mdash; you&rsquo;re falling, the corridor shrinking into the dark above you.');
    clearChoices();
    // Cross-fade into the fall and then run the plunge zoom on it. The old version faded
    // the corridor out first, which meant the drop started on a blue screen rather than
    // on the dark.
    bgImg.style.transition = 'none';
    bgImg.style.transform = 'scale(1)';
    bgImg.style.opacity = '1';
    bgImg.style.display = 'block';
    window.CODEBOOK_CROSSFADE_IMG(bgImg, 'corridor-fall-bg.webp', 420, function(){
      requestAnimationFrame(function(){
        bgImg.style.transition = 'transform 2.1s ease-in';
        requestAnimationFrame(function(){ bgImg.style.transform = 'scale(1.16)'; });
      });
    });
    setTimeout(function(){ setLine('You', '&ldquo;Hello? Anybody here?&rdquo;'); }, 1700);
    setTimeout(function(){ setLine('You', 'Still falling.'); }, 3300);
    setTimeout(function(){
      setLine('You', 'Maybe I should just head back to the campus instead.');
      clearChoices();
      var b = document.createElement('button');
      b.className = 'choice'; b.textContent = 'Head back to the Campus Map';
      b.addEventListener('click', ctx.goMap);
      choicesEl.appendChild(b);
    }, 4900);
  }

  // The corridor is unlocked on the map from the start of the game; this single-door
  // gate is what actually checks for the question, so the four case rooms stay
  // reachable only once the office has been solved, without map-level locking.
  // The door itself is just a locked-door flavor hotspot; ringing requires selecting
  // Use and clicking the bell, same "select a verb, then click" pattern as the notes.
  var GATE_BG = 'corridor-gate-bg.webp';
  var GATE_DOOR = { l:44.86, t:22.32, w:17.34, h:48.88 };
  var GATE_BELL = { l:64.89, t:42.51, w:5.08, h:15.41 };

  function renderGate(immediate){
    busy = true;
    function apply(){
      showDoorman(null);
      bgImg.style.display = 'block';
      bgImg.style.transition = 'opacity .28s ease';
      bgImg.style.transform = 'none';
      clearZones();
      caseTagEl.textContent = 'Entrance';
      addExtraZone({ id:'gatedoor', kind:'lockeddoor', noun:'the door', hotspot:GATE_DOOR,
        lookat:'A heavy door, unmarked except for a small brass plate: &ldquo;ARCHIVE OF METHOD &mdash; THE CODEBOOK.&rdquo; Whatever that is, it&rsquo;s locked.' });
      addExtraZone({ id:'bell', kind:'bell', noun:'the door bell', hotspot:GATE_BELL,
        lookat:'A small brass door bell, mounted beside the entrance, beneath a plaque that reads &ldquo;RING FOR BETTER QUESTIONS.&rdquo;' });
      setLine('System', 'The door is locked. There&rsquo;s a bell mounted beside it.');
      clearChoices();
      if (immediate) window.CODEBOOK_SET_IMG(bgImg, GATE_BG, function(){
        requestAnimationFrame(function(){ bgImg.style.opacity = '1'; });
      });
      else window.CODEBOOK_CROSSFADE_IMG(bgImg, GATE_BG, 320);
      busy = false;
    }
    apply();
  }

  function handleRing(knocked){
    if (busy) return;
    busy = true;
    window.CODEBOOK_SFX('sfx-doorbell', 0.3);
    setLine('System', knocked
      ? 'You knock. Somewhere inside, a bell rings on your behalf. A long pause, then the door opens a crack.'
      : 'You ring the bell. A long pause, then the door opens a crack.');
    clearChoices();
    setTimeout(function(){
      showDoorman(DOORMAN_GATE);
      if (!ctx.hasItem('question')){
        setLine('The Doorman', '&ldquo;Come back when you&rsquo;ve got a question.&rdquo; The door shuts before you can answer.', '', 'doorman-noquestion.mp3');
        clearChoices();
        window.CODEBOOK_AFTER_LINE(2800, function(){ renderGate(true); });
        return;
      }
      if (!ctx.hasFlag('philosopherConvinced')){
        setLine('The Doorman', '&ldquo;A question. Fine. But you don&rsquo;t know what to do with a wrong answer yet &mdash; there&rsquo;s a woman by the pond who does. Convince her first.&rdquo; He nods vaguely west and shuts the door.', '', 'doorman-noskeptic.mp3');
        clearChoices();
        window.CODEBOOK_AFTER_LINE(10800, function(){ renderGate(true); });
        return;
      }
      setLine('The Doorman', '&ldquo;Question?&rdquo; He looks at what you&rsquo;re holding, grunts, and pulls the door open. &ldquo;Four cases behind this door. Get the causal story right on all of them, and you&rsquo;ve earned a look at the Codebook. Get it wrong, and you&rsquo;ll be explaining yourself to the floor.&rdquo;', '', 'doorman-pass.mp3');
      clearChoices();
      // ends when he finishes OR when the player skips him, never on a fixed 13 seconds
      window.CODEBOOK_AFTER_LINE(13400, function(){
        setLine('System', 'You step through.');
        setTimeout(function(){
          current = 0;
          caseTagEl.textContent = 'Case 1 of ' + ROOMS.length;
          renderRoom(false);
          setTimeout(function(){
            setLine('System', 'There&rsquo;s a note pinned to the wall. It might help you figure out where to go.');
          }, 600);
        }, 700);
      });
    }, 700);
  }

  renderGate(true);
  }
});
</script>
<script>
/* ============================== ROOM: PROBABILITY POND ============================== */
CODEBOOK_REGISTER({
  id: 'pond', act: 'Act I', title: 'Probability Pond', doneFlag: 'pondDone',
  prereq: null, lockedHint: '',
  html: `
  <div class="hud">
    <div class="nameplate">Act I &middot; <b>Probability Pond</b></div>
  </div>

  <div class="room-columns">
  <div class="game-frame">
  <div class="scene-wrap" id="pd_sceneWrap">
    <img id="pd_bg" src="pond-bg.webp" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
    <button class="hotspot" data-id="swanright" data-label="A white swan" style="left:74%;top:45%;width:12%;height:17%;"></button>
    <button class="hotspot" data-id="swanleft" data-label="Another white swan" style="left:29%;top:44%;width:10%;height:12%;"></button>
    <button class="hotspot" data-id="plaque" data-label="A wooden plaque" style="left:5%;top:54%;width:20%;height:9%;"></button>
    <button class="hotspot" data-id="philosopher" data-label="A woman on the bench" style="left:79%;top:46%;width:16%;height:40%;"></button>
    <div class="hint" id="pd_hint"></div>
  </div>

  <div class="panel">
    <div class="speaker" id="pd_speaker">System</div>
    <div class="line" id="pd_line">Two swans. Deep water. A sign with a strong opinion for n=2.</div>
    <div class="choices" id="pd_choices"></div>
  </div>
  </div>

  <div class="side-panel">
    <div class="sentence-line" id="pd_sentenceLine">Look At&hellip;</div>
    <div class="verb-grid" id="pd_verbGrid"></div>
    <div class="side-inv">
      <div class="side-inv-label" id="pd_sideInvLabel">Inventory</div>
      <div class="side-inv-grid" id="pd_sideInv"></div>
    </div>
    <div class="side-inv-preview">
      <div class="side-inv-preview-img" id="pd_sideInvPreviewImg"></div>
      <div class="side-inv-preview-name" id="pd_sideInvPreviewName"></div>
    </div>
  </div>
  </div>
`,
  init: function(ctx){
  var speakerEl = document.getElementById('pd_speaker');
  var lineEl = document.getElementById('pd_line');
  var choicesEl = document.getElementById('pd_choices');
  var hintEl = document.getElementById('pd_hint');
  var sentenceEl = document.getElementById('pd_sentenceLine');
  var verbGrid = document.getElementById('pd_verbGrid');
  var bgImg = document.getElementById('pd_bg');
  window.CODEBOOK_AMBIENCE('amb-pond', 0.11);

  function setLine(speaker, html, cls, audioSrc){
    speakerEl.textContent = speaker;
    speakerEl.className = 'speaker' + (cls ? ' ' + cls : '');
    lineEl.innerHTML = html;
    window.CODEBOOK_PLAY_LINE(audioSrc, html);
  }
  function clearChoices(){ choicesEl.innerHTML = ''; window.CODEBOOK_CHOICE_COUNT(choicesEl); }

  var selectedItem = null;
  function syncSideInv(lastAddedId){
    window.CODEBOOK_RENDER_SIDE_INV('pd_sideInv', ctx.GAME.inventory, lastAddedId || null, 'pd_sideInvLabel', 'pd_sideInvPreviewImg', 'pd_sideInvPreviewName',
      function(id){
        // Look at, in the inventory, answers in this room's own dialogue box.
        if (selectedVerb === 'lookat'){ setLine('You', window.CODEBOOK_ITEM_LOOK(id)); return; }
        selectedVerb = 'use'; selectedItem = id;
        verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === 'use'); });
        syncSideInv();
        updateSentence();
      }, selectedItem);
  }
  syncSideInv();

  var VERBS = [
    {id:'lookat', label:'Look At'}, {id:'talkto', label:'Talk To'},
    {id:'pickup', label:'Pick Up'}, {id:'use', label:'Use'}
  ];
  var FALLBACK = {
    talkto: 'No response. Swans are not known for conversation.',
    pickup: 'That&rsquo;s not coming with you.',
    use: 'You can&rsquo;t think what you&rsquo;d use that for.'
  };
  var selectedVerb = 'lookat';
  var hoveredNoun = null;
  function verbLabel(id){ return VERBS.filter(function(v){ return v.id === id; })[0].label; }
  function updateSentence(){
    var label = verbLabel(selectedVerb);
    if (selectedVerb === 'use' && selectedItem){
      var itemName = window.CODEBOOK_ITEM_LABELS[selectedItem] || selectedItem;
      sentenceEl.textContent = 'Use ' + itemName + (hoveredNoun ? ' with ' + hoveredNoun : '…');
      return;
    }
    sentenceEl.textContent = hoveredNoun ? (label + ' ' + hoveredNoun) : (label + '…');
  }
  VERBS.forEach(function(v){
    var b = document.createElement('button');
    b.className = 'verb-btn' + (v.id === selectedVerb ? ' active' : '');
    b.textContent = v.label; b.dataset.verb = v.id;
    b.addEventListener('click', function(){
      selectedVerb = v.id;
      if (v.id !== 'use'){ selectedItem = null; syncSideInv(); }
      verbGrid.querySelectorAll('.verb-btn').forEach(function(e){ e.classList.toggle('active', e.dataset.verb === v.id); });
      updateSentence();
    });
    verbGrid.appendChild(b);
  });
  updateSentence();

  var NOUNS = { swanright:'the swan', swanleft:'the other swan', plaque:'the plaque', philosopher:'the man on the bench' };
  var falsified = ctx.hasFlag('pondDone');
  var convinced = ctx.hasFlag('philosopherConvinced');
  if (falsified) bgImg.src = 'pond-bg-falsified.webp';

  document.querySelectorAll('.hotspot').forEach(function(hs){
    hs.addEventListener('mouseenter', function(){ hoveredNoun = NOUNS[hs.dataset.id]; updateSentence(); hintEl.textContent = hs.dataset.label; hintEl.classList.add('show'); });
    hs.addEventListener('mouseleave', function(){ hoveredNoun = null; updateSentence(); hintEl.classList.remove('show'); });
    hs.addEventListener('click', function(){
      var id = hs.dataset.id;
      if (id === 'plaque'){
        if (selectedVerb === 'lookat'){
          setLine('You', falsified
            ? 'The plaque still reads &ldquo;ALL SWANS ARE WHITE &mdash; ESTABLISHED FACT (N=2),&rdquo; now with a large red &ldquo;FALSIFIED&rdquo; stamped across it. Someone was thorough about it.'

  // THE HYPOTHESES ACCELERATOR, ZOOMED IN  (ROADMAP 8k)

  // He is the gauge the player watches; the other one is the lesson.

  // Combinations too good to leave to the template.

    // The true top of every drum. This is the crowning joke, so it has to sit at the crown.
    '9|7|6': 'CIVILISATION IS TRAFFIC',
    '9|6|6': 'ALL ROADS LEAD TO THE SEMINAR',

    '8|3|0': 'SOCIETY IS DAMP',
    '7|4|5': 'HISTORY IS A LECTURE NOBODY ATTENDED',

  var ACC_FELD = [

    { at:2,  pose:'sprite-feldstrom.png',        say:'He unfolds his arms. &ldquo;Well. A little air in it. Go on.&rdquo;' },

  var ACC_POSE_OK = {};          // pose file -> does it exist? filled in on first use

<script>
/* ============================== ACT V: THE WRITING ROOM ============================== */
(function(){

              : 'Current title: <b>' + TITLES[titleStage] + '</b><br><br>&ldquo;Bigger,&rdquo; he says, not unkindly. &ldquo;It is <i>true</i> at every size. Why would you choose the smallest one?&rdquo;');
            api.choice('Let him make it bigger', function(){

        api.say('You', 'Before you touch a word of this you want the sealed slip beside it, to check what you said you would find against what you are about to claim you found. It is not in your hands.');

/* Minimal 2D cut-out rig for The Secret of the Lost Codebook.
 *
 * A rig is a tree of parts. Each part is one image with a pivot (the joint it rotates around,
 * in the part image's own pixels) and an attach point on its parent (in the parent's pixels).

(function(){
  function el(tag, css){ var e = document.createElement(tag); e.style.cssText = css || ''; return e; }

  function build(container, def, opts){
    opts = opts || {};

      var ax = parentDef ? part.attach[0] - parentDef.pivot[0] : 0;
      var ay = parentDef ? part.attach[1] - parentDef.pivot[1] : 0;
      j.style.left = (ax * scale) + 'px';
      j.style.top = (ay * scale) + 'px';
      j.style.zIndex = part.z || 0;
      var img = el('img', 'position:absolute;display:block;pointer-events:none;');
      img.src = part.src;
      img.style.width = (part.size[0] * scale) + 'px';
      img.style.height = (part.size[1] * scale) + 'px';
      img.style.left = (-part.pivot[0] * scale) + 'px';
      img.style.top = (-part.pivot[1] * scale) + 'px';
      if (part.flip) img.style.transform = 'scaleX(-1)';
      if (part.tint) img.style.filter = part.tint;
      j.appendChild(img);
      parentEl.appendChild(j);
      joints[part.id] = j;
      (part.children || []).forEach(function(c){ add(c, j, part); });
    }
    add(def.root, root, null);
    container.appendChild(root);

    var raf = null, t0 = 0, poseFn = null, poseOpts = null;
    function pose(angles, offset){
      Object.keys(angles).forEach(function(k){ if (joints[k]) joints[k].style.transform = 'rotate(' + angles[k] + 'deg)'; });
      offset = offset || { x: 0, y: 0 };
      root.style.transform = 'translate(' + (offset.x * scale) + 'px,' + (offset.y * scale) + 'px)';
    }
    function frame(now){
      var t = ((now - t0) / 1000) * (poseOpts.speed || 1) / (poseFn.period || 1);
      var p = poseFn(t % 1, poseOpts);
      pose(p.angles, p.offset);

  // Side-view walk cycle, facing right, t in [0,1). Angles in degrees (positive = clockwise,
  // i.e. a thigh swinging forward is negative when the figure faces right).
  function walk(t, o){
    var stride = (o && o.stride) || 1;
    // Thigh angle follows a sine; the swing phase is where the thigh moves forward (cos > 0).
    // Knee flexion peaks mid-swing (leg passing under the body) and is ~straight at heel strike.

    }

      angles: {
        hipL: L.hip, kneeL: L.knee, hipR: R.hip, kneeR: R.knee,
        shoulderL: 24 * stride * L.sw, elbowL: -14 - 16 * Math.max(0, -L.sw),
        shoulderR: 24 * stride * R.sw, elbowR: -14 - 16 * Math.max(0, -R.sw),
        torso: 1.5, neck: -1.5 + 1.5 * S(t * 2, 0.25)
      },
      offset: { x: 0, y: -12 * Math.abs(S(t * 2, 0.25)) }
    };
  }
  walk.period = 1.05; // seconds per full cycle (two steps)

  function idle(t){
    return { angles: { hipL: 2, kneeL: 2, hipR: -2, kneeR: 2, shoulderL: 4, elbowL: -6, shoulderR: -3, elbowR: -8,
                       torso: 1 + 0.6 * S(t), neck: -1 + 1.2 * S(t, 0.2) }, offset: { x: 0, y: 1.5 * S(t) } };
  }
  idle.period = 3.6;

  window.CodebookRig = { build: build, walk: walk, idle: idle };
})();

// Generic "walk this character somewhere": swaps a static sprite element for its cut-out rig,
// auto-sized to the sprite's drawn figure height with the soles on the same floor line, walks a
// route of x offsets (in % of the scene width, relative to where the sprite stands) at a
// stride-matched speed, faces its direction, then swaps back. opts: {stay:true} leaves the
// sprite at the last point instead of the start.
window.CODEBOOK_RIG_WALK = function(spriteEl, def, route, done, opts){
  opts = opts || {};
  var scene = spriteEl.closest('.scene-wrap');
  if (!scene || !window.CodebookRig || spriteEl.dataset.walking){ if (done) done(); return; }

  var ar = img.naturalWidth / img.naturalHeight, figH = Math.min(br.height, br.width / ar);
  var footY = br.top + (br.height + figH) / 2 - sr.top, cx = br.left + br.width / 2 - sr.left;

  var bot = Math.max.apply(null, imgs.map(function(i){ return i.getBoundingClientRect().bottom; })) - rr.top;
  box.innerHTML = '';
  var H = def.height * figH / (bot - top);
  var rig = window.CodebookRig.build(box, def, { height: H });
  rig.root.style.top = (-bot * H / def.height) + 'px';
  box.style.left = (cx + (opts.from || 0) * sr.width / 100) + 'px'; box.style.top = footY + 'px';
  var pxPerSec = (def.stride || 1300) * rig.scale / window.CodebookRig.walk.period;
  var x = opts.from || 0, i = 0, W = sr.width;

    if (!document.body.contains(scene)){ rig.stop(); return; }
    if (i >= route.length){
      rig.stop();
      var endX = opts.stay ? x : 0;
      if (opts.stay){ spriteEl.style.translate = (x * W / 100) + 'px 0'; }
      spriteEl.style.opacity = '1'; box.style.opacity = '0';

  window.CODEBOOK_ACT3_INTERLUDE = [
    { src:'trailer3-a-folder.webp', html:CARD,
      text:'Chapter One: complete. The folder now contains exactly one thing. It is, admittedly, a very good question.', voice:'vo-narr-act3-01.mp3' },
    { src:'trailer3-b-prof.webp',
      text:'Back at the Office. &ldquo;A question,&rdquo; says the Professor, &ldquo;is not evidence.&rdquo; &mdash; &ldquo;So I need data?&rdquo; &mdash; &ldquo;Eventually. First you need <i>permission</i> to acquire data.&rdquo;', voice:'vo-narr-act3-02.mp3' },
    { src:'trailer3-c-h27.webp',
      html:'<svg viewBox="0 0 1672 941" style="position:absolute;inset:0;width:100%;height:100%;"><g font-family="Fraunces, Georgia, serif" font-weight="700" font-size="17" fill="#2a1d10">' +
        // Same problem as Form P-1, plus one of its own: at 21px the longest label ran
        // clean off the right-hand edge of the paper. Sized to the narrowest line the
        // sheet gives (the second one) and set to the angle of the printed rules.
        '<text transform="translate(556,396) rotate(10.5)">INSTRUMENT EXISTS</text>' +
        '<text transform="translate(520,458) rotate(10.5)">HUMANS MAY BE APPROACHED</text>' +
        '<text transform="translate(485,521) rotate(10.5)">SAMPLE DRAWN</text>' +
        '<text transform="translate(450,584) rotate(10.5)">RESPONSES ACQUIRED</text></g></svg>',
      text:'Somewhere above the desk, a pneumatic tube clears its throat. <b>Form H-27: Request to Approach Human Beings.</b> Forty-seven pages. Four empty boxes. &ldquo;Try not to alarm them.&rdquo;', voice:'vo-narr-act3-03.mp3' },
    { src:'trailer3-d-montage.webp',
      html: label(25, 4, 'Survey Lab &middot; Emergency Dept.') + label(75, 4, 'The Ethics Tribunal') + label(25, 53, 'The Mensa &middot; Sampling Ceremony') + label(75, 53, 'The Fieldwork Arena'),
      text:'Four departments, one box each: an emergency ward for injured questions, a tribunal that fears persons, a lottery with a dress code, and a game show nobody wants to be on.', voice:'vo-narr-act3-04.mp3' },
    { src:'trailer3-e-cast.webp',
      html:'<div style="position:absolute;left:50%;top:53%;transform:translateX(-50%);text-align:center;color:#e0b458;font-family:\'JetBrains Mono\',monospace;font-size:clamp(10px,1.4vw,22px);letter-spacing:.5em;text-transform:uppercase;text-shadow:0 2px 8px #000;">Starring</div>',
      text:'A nurse who has seen too many double-barrels. A tribunal of three (one asleep). A herald of randomness. A woman who lives entirely on air. And a professor, already preparing her next objection.', voice:'vo-narr-act3-05.mp3' },
    { src:'campus-map.webp',

        '<div class="il-title"><div class="kicker">The Secret of the Lost Codebook</div><div class="act">ACT III</div><div class="rule"></div><div class="big">Apparently We Need Data</div><div class="sub">Four boxes. Four departments. One very tired student.</div></div>',
      text:'', voice:'vo-narr-act3-06.mp3' }
  ];
})();
</script>

<script>
(function(){
  // Preloaded quietly behind the logo/title screens so Act I and the trailer
  // don't pop in mid-scene the first time they're needed.
  var ACT1_IMAGES = [
    'campus-map.webp', 'map-sign.webp', 'corridor-archway-bg.webp', 'corridor-fall-bg.webp', 'corridor-gate-bg.webp',
    'corridor-room1-bg.webp', 'corridor-room2-bg.webp', 'corridor-room3-bg.webp', 'corridor-room4-bg.webp',
    'icon-bingocard.png', 'icon-blackink.webp', 'icon-cc-duck.png', 'icon-cc-magnifyingglass.png', 'icon-cc-znameplate.png',
    'icon-hourglass.png', 'icon-likertdie.png', 'icon-mug.png', 'icon-pen.png', 'icon-question.png', 'icon-citationslip.png',
    'icon-raffledrum.webp', 'icon-stamp.png', 'icon-usb.png', 'lecture-bg.webp', 'office-bg-empty.webp', 'prof-office.webp', 'mouth-prof-office.webp',
    'patch-hourglass.png', 'patch-likertdie.png', 'patch-mug.png', 'patch-penjar.png', 'patch-stamp.png', 'patch-usb.png',
    'pond-bg.webp', 'pond-bg-falsified.webp', 'sprite-citationcounter.webp', 'sprite-doorman.png',
    'vossberg-lecturing.webp', 'vossberg-pointing.webp', 'vossberg-walking.webp', 'sprite-bingocard.png', 'sprite-glow.webp', 'sprite-steam.png',
    'trailer-panel1-deadline.webp', 'trailer-panel2-protagonist.webp', 'trailer-panel2b-spiral.webp', 'trailer-panel3-rumor.webp', 'trailer-panel4-legend.webp', 'trailer-panel5-arrival.webp',
    'icon-folder.png', 'trailer-cast-act1.webp'
  ];
  // Everything each act needs, so the game can load the current act up front (with a
  // progress bar) and quietly fetch the next one in the background while it's played.
  var ACT_ASSETS = window.CODEBOOK_ACT_ASSETS = {
    act1: ACT1_IMAGES.concat([
      'title-theme.mp3', 'voices-act1.mp3', 'office-bgm.mp3', 'lecture-bgm.mp3',
      'rig-prof-head.webp', 'rig-prof-torso.webp', 'rig-prof-upperarm.webp', 'rig-prof-forearm.webp', 'rig-prof-thigh.webp', 'rig-prof-shin.webp', 'mouth-doorman.webp', 'mouth-vossberg-lecturing.webp', 'mouth-vossberg-pointing.webp',
      'rig-doorman-head.webp', 'rig-doorman-torso.webp', 'rig-doorman-upperarm.webp', 'rig-doorman-forearm.webp', 'rig-doorman-thigh.webp', 'rig-doorman-shin.webp'
    ]),
    act2: ['sprite-tobi-walk.png','sprite-kira.png','sprite-feldstrom.png','sprite-fellow.png','sprite-tobi.png',
           'sprite-profg.png','mouth-marx.webp','mouth-durkheim.webp','mouth-weber.webp',
           'vo-marx-verse.mp3','vo-durkheim-verse.mp3','vo-weber-verse.mp3','profg-slimrap.mp3',
           'profg-panel-stage.webp','profg-panel-close.webp','profg-panel-micdrop.webp',
           'il2-slip.webp','il2-rooms.webp','il2-cast.webp','library-bg.webp', 'hall-bg.webp',
           'workshop-bg.webp', 'accelerator-panel.webp', 'sprite-feldstrom-bored.webp', 'seminar-bg.webp'],
    act5: ['sprite-tobi-walk.png','sprite-kira.png','sprite-feldstrom.png','sprite-registrar.png','sprite-tobi.png','sprite-skeleton-gap.png','il5-rooms.webp','il5-chute.webp','il5-cast.webp','outro-1-walk.webp','outro-2-months.webp','outro-3-letter.webp','outro-4-r2.webp','outro-5-verdict.webp','outro-6-monkey.webp','gapregistry-bg.webp', 'writingroom-bg.webp', 'lecture-bg.webp', 'vossberg-lecturing.webp'],
    act4: ['sprite-tobi-walk.png','sprite-kira.png','sprite-clerk.png','il4-seal.webp','il4-rooms.webp','il4-cast.webp','basement-bg.webp', 'delegation-bg.webp', 'bureau-bg.webp'],
    act3: [
      'voices-act3.mp3', 'campus-map.webp', 'trailer3-a-folder.webp', 'trailer3-b-prof.webp', 'trailer3-c-h27.webp', 'trailer3-d-montage.webp', 'trailer3-e-cast.webp',
      'surveylab-bg.webp', 'ethics-bg.webp', 'mensa-bg.webp', 'fieldwork-bg.webp',
      'icon-qcard-satisfaction.png', 'icon-qcard-policy.png', 'icon-qcard-lectures.png', 'icon-qcard-support.png',
      'mouth-nurse.webp', 'mouth-judge-chair.webp', 'mouth-judge-keeper.webp', 'mouth-officer.webp', 'mouth-director.webp',
      'sprite-nurse.png', 'sprite-judge-keeper.webp', 'sprite-judge-chair.webp', 'sprite-judge-rep.webp', 'sprite-officer.webp', 'sprite-director.png', 'rig-nurse-head.webp', 'rig-nurse-torso.webp', 'rig-nurse-upperarm.webp', 'rig-nurse-forearm.webp', 'rig-nurse-thigh.webp', 'rig-nurse-shin.webp', 'rig-director-head.webp', 'rig-director-torso.webp', 'rig-director-upperarm.webp', 'rig-director-forearm.webp', 'rig-director-thigh.webp', 'rig-director-shin.webp', 'rig-officer-head.webp', 'rig-officer-torso.webp', 'rig-officer-upperarm.webp', 'rig-officer-forearm.webp', 'rig-officer-thigh.webp', 'rig-officer-shin.webp',
      'icon-h27form.png', 'icon-calendarpage.png', 'icon-reminderpostcards.png', 'icon-ballotbox.webp', 'icon-ballotbox-wrapped.webp',
      'icon-consentform-plain.png', 'icon-redactedbundle.png', 'icon-altquestionnaire.png', 'icon-wrongsamplelist.png',
      'icon-pseudostudentlist.png', 'icon-lunchbag.png', 'icon-incentivevoucher.png', 'icon-scissors.png'
    ].concat(Object.keys(window.CODEBOOK_VO || {}).map(function(k){ return window.CODEBOOK_VO[k]; }))
  };

  var PANELS = [
    { src:'trailer-panel1-deadline.webp', text:'Every research project starts the same way: a deadline, an empty folder, and nothing else.', voice:'vo-narr-opening-01.mp3' },
    { src:'trailer-panel2-protagonist.webp', text:'This is you, on your fourth topic change this semester. Your advisor’s patience is now measured in single digits.', voice:'vo-narr-opening-02.mp3' },
    { src:'trailer-panel2b-spiral.webp', text:'By week nine the topic has changed eleven times, the corkboard needs its own corkboard, and sleep has become a rumor of its own.', voice:'vo-narr-opening-03.mp3' },
    { src:'trailer-panel3-rumor.webp', text:'Word travels, in hushed tones, of a professor who can turn any bad idea into a real one. If you can survive seven seconds of her patience.', voice:'vo-narr-opening-04.mp3' },
    { src:'trailer-panel4-legend.webp', text:'They say she keeps a Codebook. No one’s seen it. Everyone’s heard of it. Most who go looking are still working on their dissertations.', voice:'vo-narr-opening-05.mp3' },
    { src:'trailer-panel5-arrival.webp', text:'This is where it starts. Again.', voice:'vo-narr-opening-06.mp3' },
    { src:'trailer-cast-act1.webp',
      text:'A professor with seven seconds of patience. A lecturer who reads her course out for her. A skeptic who has read one book about swans. A doorman who is also, in some sense, the door. And a skeleton, still waiting on Reviewer 2.',
      title:'<div style="position:absolute;left:50%;top:57%;transform:translateX(-50%);color:#e0b458;font-family:\'JetBrains Mono\',monospace;font-size:clamp(10px,1.4vw,22px);letter-spacing:.5em;text-transform:uppercase;text-shadow:0 2px 8px #000;">Starring</div>', voice:'vo-narr-opening-07.mp3' },
    { src:'trailer-panel5-arrival.webp', text:'',
      title:'<div class="il-veil"></div><div class="il-title"><div class="kicker">The Secret of the Lost Codebook</div><div class="act">ACT I</div><div class="rule"></div><div class="big">The Question</div><div class="sub">One professor. Seven seconds. Bring something sharper than a topic.</div></div>' }
  ];

  var splash = document.getElementById('bootSplash');
  var logoEl = document.getElementById('bootLogo');
  var titleEl = document.getElementById('bootTitle');
  var beginEl = document.getElementById('bootBegin');
  var trailerImg = document.getElementById('trailerImg');
  var trailerCaption = document.getElementById('trailerCaption');
  var trailerHint = document.getElementById('trailerHint');
  var titleCard = document.getElementById('bootTitleCard');
  var musicEl = document.getElementById('bootMusic');
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var stage = 'logo'; // 'logo' -> 'title' -> 'trailer' -> gone
  var narr = null;    // narrator track for the current panel
  var panelIndex = -1;
  var preloadDone = false, minTitleTimeElapsed = false, logoTimer = null;
  var musicStarted = false;

  function startMusic(){
    if (musicStarted || !musicEl) return;
    musicStarted = true;
    musicEl.volume = 0.2;   // sits under the narrator
    var p = musicEl.play();
    if (p && p.catch) p.catch(function(){ musicStarted = false; }); // blocked until a real user gesture; next click retries
  }
  function fadeOutMusic(){
    if (!musicEl || musicEl.paused) return;
    var steps = 10, i = 0, startVol = musicEl.volume;
    var iv = setInterval(function(){
      i++;
      musicEl.volume = Math.max(0, startVol * (1 - i / steps));
      if (i >= steps){ clearInterval(iv); musicEl.pause(); }
    }, reduced ? 0 : 40);
  }

  function maybeShowBegin(){
    if (preloadDone && minTitleTimeElapsed) beginEl.classList.add('show');
  }
  function goToTitle(){
    clearTimeout(logoTimer);
    if (stage !== 'logo') return;
    stage = 'title';
    logoEl.classList.remove('show');
    setTimeout(function(){
      titleEl.classList.add('show');
      setTimeout(function(){ minTitleTimeElapsed = true; maybeShowBegin(); }, reduced ? 0 : 900);
    }, reduced ? 0 : 500);
  }
  // The act loads while the trailer plays (see the bottom of this script). If the trailer
  // ends first -- a fast reader, or Escape -- hold on its last frame with the bar showing
  // what is left, and go in the moment it is there.
  var actReady = false, waitingForAct = false;
  function closeSplash(){
    if (narr){ narr.pause(); narr = null; }
    if (!actReady){
      if (waitingForAct) return;
      waitingForAct = true;
      stage = 'loading';
      trailerCaption.classList.remove('show'); trailerHint.classList.remove('show');
      bootBar.classList.remove('hide');
      window.CODEBOOK_PRELOAD(actList, function(f){ window.CODEBOOK_LOADBAR_SET(bootBar, actLabel, f); }, function(){
        actReady = true; closeSplash();
      });
      return;
    }
    fadeOutMusic();
    splash.style.transition = 'opacity .5s ease';
    splash.style.opacity = '0';
    setTimeout(function(){ splash.remove(); CODEBOOK_START(); }, reduced ? 0 : 500);
  }
  function nextPanel(){
    panelIndex++;
    if (panelIndex >= PANELS.length){ closeSplash(); return; }
    if (narr){ narr.pause(); narr = null; }
    trailerCaption.classList.remove('show');
    trailerHint.classList.remove('show');
    trailerImg.style.transition = reduced ? 'none' : 'opacity .5s ease';
    trailerImg.style.opacity = '0';
    titleCard.classList.remove('show');
    setTimeout(function(){
      var p = PANELS[panelIndex];
      trailerImg.src = p.src;
      titleCard.innerHTML = p.title || '';
      requestAnimationFrame(function(){
        trailerImg.style.opacity = '1';
        if (p.title) titleCard.classList.add('show');
        trailerCaption.textContent = p.text;
        trailerCaption.style.display = p.text ? '' : 'none';
        setTimeout(function(){
          trailerCaption.classList.add('show'); trailerHint.classList.add('show');
          if (p.voice){
            var mine = panelIndex, a = window.CODEBOOK_VOICE(p.voice); narr = a;
            a.addEventListener('ended', function(){ if (stage === 'trailer' && panelIndex === mine) nextPanel(); });
            a.play().catch(function(){});
          }
        }, 250);
      });
    }, reduced ? 0 : 350);
  }
  function startTrailer(){
    stage = 'trailer';
    titleEl.classList.remove('show');
    beginEl.classList.remove('show');
    panelIndex = -1;
    nextPanel();
  }
  function onTitleClick(){
    if (!beginEl.classList.contains('show')) return;
    startTrailer();
  }
  splash.addEventListener('click', function(){
    startMusic();
    if (stage === 'logo'){ goToTitle(); return; }
    if (stage === 'title'){ onTitleClick(); return; }
    if (stage === 'trailer'){ nextPanel(); return; }
  });
  document.addEventListener('keydown', function(e){
    if (!document.getElementById('bootSplash')) return;
    startMusic();
    if (e.code === 'Escape' && stage === 'trailer'){ e.preventDefault(); closeSplash(); return; }
    if (e.code !== 'Space') return;
    e.preventDefault();
    splash.click();
  });

  // ?play=actN previews one interlude on its own without touching the save, and
  // ?play=outro previews the ending. Handy for reviewing the cutscenes without playing
  // three acts to reach them: act2, act3, act4, act5, outro.
  var PREVIEWS = {
    act2:  { panels:function(){ return window.CODEBOOK_ACT2_INTERLUDE; }, list:'act2', label:'Act II' },
    act3:  { panels:function(){ return window.CODEBOOK_ACT3_INTERLUDE; }, list:'act3', label:'Act III' },
    act4:  { panels:function(){ return window.CODEBOOK_ACT4_INTERLUDE; }, list:'act4', label:'Act IV' },
    act5:  { panels:function(){ return window.CODEBOOK_ACT5_INTERLUDE; }, list:'act5', label:'Act V' }
  };
  // ?start=N seeds a save at the top of act N and drops you on the map. Testing only --
  // it overwrites the existing save, which is why it says so and why it is a URL you have
  // to type rather than a button. Each act's seed carries everything the act needs, so
  // every puzzle in it is actually solvable from a standing start.
  var ACT_SEEDS = (function(){
    var one   = ['question','folder','pen','mug','likertdie','hourglass','usb','stamp',
                 'magnifyingglass','bingocard','raffle','blackink','worksheets','chalk'];
    var two   = one.concat(['slip','readinglist','altcard','enrolreg','stepladder','blankcard',
                            'nobelproc','accentcard','altpaper','grandphrase']);
    var three = two.concat(['rateprint','pseudolist','examrecords','redacted']);
    var four  = three.concat(['resultprint','cleandata','ticket']);
    var five  = four.concat(['interpretation']);
    var f1 = { whirlpoolDone:true, lectureDone:true, pondDone:true, philosopherConvinced:true,
               profAtOffice:true, lecturerGone:true, actRenumberMigrated:true };
    var f2 = Object.assign({}, f1, { corridorDone:true });
    var f3 = Object.assign({}, f2, { libraryDone:true, hallDone:true, workshopDone:true,
               seminarDone:true, actIIDone:true, wsExtension:true, wsTapeOff:true, wsScoped:true,
               slipSealed:true, h27issued:true, act2IntroSeen:true });
    var f4 = Object.assign({}, f3, { surveyDone:true, ethicsDone:true, mensaDone:true,
               fieldworkDone:true, actIIIDone:true, provenanceGiven:true, act3IntroSeen:true });
    var f5 = Object.assign({}, f4, { statsDone:true, delegationDone:true, bureauDone:true,
               actIVDone:true, resultHolds:true, act4IntroSeen:true });
    return { '1': { inventory:[], flags:{ actRenumberMigrated:true } },
             '2': { inventory:one,   flags:f2 },
             '3': { inventory:two,   flags:f3 },
             '4': { inventory:three, flags:f4 },
             '5': { inventory:five,  flags:f5 } };
  })();
  var startMatch = /[?&]start=([1-5])/.exec(location.search);
  if (startMatch){
    var seed = ACT_SEEDS[startMatch[1]];
    // The folder's label tracks progress, and Act III onwards it reads differently.
    try { localStorage.setItem('codebook_save_v1', JSON.stringify(seed)); } catch(e){}
    location.replace(location.pathname);
    return;
  }

  // ?room=<id> drops you straight into a room, and ?room=workshop&acc=1 opens the
  // Accelerator on arrival. Seeds an Act II save first so the room has something to work
  // with -- a written mechanism, the hook pole, the register -- then cleans the URL the
  // same way ?start does, carrying the intent through sessionStorage so a reload does not
  // re-seed on top of whatever you were doing.
  var roomMatch = /[?&]room=([a-z0-9]+)/.exec(location.search);
  if (roomMatch){
    var rseed = JSON.parse(JSON.stringify(ACT_SEEDS['2']));
    rseed.inventory = rseed.inventory.concat(['mechanismcard','enrolreg','stepladder']);
    // No interludes on a debug link: you asked for a room, not a cutscene.
    rseed.flags.act2IntroSeen = rseed.flags.act3IntroSeen = true;
    rseed.flags.act4IntroSeen = rseed.flags.act5IntroSeen = true;
    rseed.flags.predictionSlip = { junk:0,
      known:'Six sources that exist and say what you think they say.', knownSound:true,
      mechanism:'Attending lectures means repeatedly meeting worked examples, so students practise the kind of reasoning the exam rewards.',
      mechanismSound:true };
    try {
      localStorage.setItem('codebook_save_v1', JSON.stringify(rseed));
      sessionStorage.setItem('cb_goroom', roomMatch[1]);
      if (/[?&]acc=1/.test(location.search)) sessionStorage.setItem('cb_openacc', '1');
      if (/[?&]post=1/.test(location.search)) sessionStorage.setItem('cb_tobipost', '1');
    } catch(e){}
    location.replace(location.pathname);
    return;
  }

  var pvMatch = /[?&]play=([a-z0-9]+)/.exec(location.search);
  if (pvMatch && pvMatch[1] === 'outro' && window.CODEBOOK_PLAY_OUTRO){
    splash.remove();
    window.CODEBOOK_PLAY_OUTRO();
    return;
  }
  if (pvMatch && PREVIEWS[pvMatch[1]] && PREVIEWS[pvMatch[1]].panels()){
    var pvDef = PREVIEWS[pvMatch[1]];
    splash.remove();
    var pv = new Audio('title-theme.mp3'); pv.loop = true; pv.volume = 0.45;
    pv.play().catch(function(){ document.addEventListener('click', function(){ pv.play().catch(function(){}); }, { once:true }); });
    window.CODEBOOK_PLAY_INTERLUDE(pvDef.panels(), function(){ pv.pause(); location.href = location.pathname; },
      { preload: ACT_ASSETS[pvDef.list], label: pvDef.label });
    return;
  }

  // Load the act the save is in (the opening trailer and the map are in act1's list, so
  // an Act II save loads those plus Act II), then fetch the other act in the background.
  var save = null;
  try { save = JSON.parse(localStorage.getItem('codebook_save_v1')); } catch(e){}
  var inAct3 = !!(save && save.flags && save.flags.corridorDone);
  // Three stages, so nobody waits on the whole act before the first click:
  //   1. the trailer alone (its panels and voices-intro.mp3, about 3 MB) gates "Click to
  //      begin". Not the title music: #bootMusic streams it, and it is 3 MB on its own;
  //   2. the act the save is in loads while the trailer plays; closeSplash() waits on it
  //      with a bar only if the trailer ends first;
  //   3. then the other act, quietly.
  var introList = PANELS.map(function(p){ return p.src; })
    .filter(function(x, i, a){ return x && a.indexOf(x) === i; })
    .concat(['voices-intro.mp3']);
  var actList = inAct3 ? ACT1_IMAGES.concat(ACT_ASSETS.act3) : ACT_ASSETS.act1;
  var laterList = inAct3 ? ACT_ASSETS.act1 : ACT_ASSETS.act3;
  var actLabel = 'Loading ' + (inAct3 ? 'Act III' : 'Act I');
  splash.insertAdjacentHTML('beforeend', window.CODEBOOK_LOADBAR_HTML());
  var bootBar = splash.querySelector('.cb-load');
  window.CODEBOOK_PRELOAD(introList, function(f){ window.CODEBOOK_LOADBAR_SET(bootBar, 'Loading', f); }, function(){
    bootBar.classList.add('hide');
    setTimeout(function(){ preloadDone = true; maybeShowBegin(); }, 400);
    window.CODEBOOK_PRELOAD(actList, null, function(){
      actReady = true;
      window.CODEBOOK_PRELOAD(laterList); // next act, quietly
    });
  });

  logoEl.classList.add('show');
  logoTimer = setTimeout(goToTitle, reduced ? 0 : 2200);
  startMusic(); // works if the browser allows it; otherwise the first click/keypress retries
})();
</script>
