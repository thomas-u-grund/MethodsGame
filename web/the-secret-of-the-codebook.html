              api.say('You', 'The portraits applaud. Add a third surname and there are, apparently, trumpets.<br><br>The dispenser stamps the card <b>THEORETICALLY GROUNDED</b> all by itself.<br><br>&ldquo;But none of them wrote about this.&rdquo;<br>A small brass voice from inside the machine: &ldquo;They are extremely dead. They cannot object.&rdquo;');
              if (!F('hallStamped')){ ctx.setFlag('hallStamped'); }
            });
            api.choice('&ldquo;Because correlation.&rdquo;', function(){
              api.say('You', 'The machine prints, on a small card: <b>BECAUSE IS NOT A MAGIC WORD.</b>');
            });
            return;
          }
          return false;
        }

        if (id === 'portraits' && verb === 'talkto'){
          api.clearChoices();
          api.say('You', 'Marx and Durkheim are looking at you. The third founder, the one with the borrowed beard, is not.');
          api.choice('Talk to Karl Marx', function(){ api.clearChoices(); founder('marx'); });
          api.choice('Talk to &Eacute;mile Durkheim', function(){ api.clearChoices(); founder('durkheim'); });
          return;
        }

        if (id === 'portraits'){
          if (verb === 'lookat' && F('rapDone') && !F('rapPortraitsSeen')){
            ctx.setFlag('rapPortraitsSeen');
            api.say('You', 'They have stopped nodding. Marx is looking at the floor. Durkheim appears to be counting something. Weber looks, if anything, relieved.'); return;
          }
          if (verb === 'lookat'){
            // Rotates, so a second look is never the same joke twice.
            var LOOKS = [
              'Founders. They nod at everything &mdash; at two contradictory claims in a row, and once, memorably, at a blank card.',
              'Four founders of the discipline. Bearded. Dead. Certain.<br><br>The second and third have the same beard, the same shoulders and the same expression. The nameplates are different. Nobody has ever mentioned it.',
              'One nameplate has been unscrewed and refitted several times &mdash; you can see the older holes around it. Whoever is in this frame now, he is not the first.',
              'The dates under the fourth portrait would make him fourteen years old at the time of his major work. He looks, if anything, older than the others.',
              'Beside the door, a small brass sign you did not notice on the way in: <b>NO LIVING THEORISTS BEYOND THIS POINT.</b>'
            ];
            var n = ctx.GAME.flags.hallLookCount || 0;
            ctx.GAME.flags.hallLookCount = n + 1; ctx.saveGame();
            // ROADMAP 8a: once the five wall portraits are exhausted, the sixth look finds
            // the group portrait at the dark end of the hall, and shows it full size.
            if (n >= LOOKS.length){ foundersZoom(api); return; }
            api.say('You', LOOKS[Math.min(n, LOOKS.length - 1)]); return;
          }
          if (item === 'likertdie'){
            api.say('You', 'You roll the die at the nearest portrait. <b>STRONGLY AGREE.</b> Every portrait nods.<br>You roll again. <b>STRONGLY DISAGREE.</b> Every portrait nods.<br><br>&ldquo;You agreed with the opposite.&rdquo;<br><i>(they nod)</i>');
            return;
          }
          if (item === 'blackink'){ api.say('You', 'You attempt to falsify Max Weber.<br><br>Max Weber remains dead.'); return; }
          if (item === 'stamp'){ api.say('You', 'You stamp SIGNIFICANT (p&lt;.05) on the nearest plaque. Every portrait nods. The form in your folder does not.'); return; }
          return false;
        }

        if (id === 'clipping'){
          if (verb === 'lookat' || verb === 'pickup'){
            if (!F('hallClipping')) ctx.setFlag('hallClipping');
            api.say('You', 'A yellowed clipping in a display case: an economist receiving <b>the Sveriges Riksbank Prize in Economic Sciences in Memory of Alfred Nobel</b>. Somebody has underlined the full name twice, in biro, with feeling.<div class="state-line">+ You now know what the economics prize is actually called</div>');
            return;
          }
          return false;
        }

        if (id === 'ladder'){
          if (verb === 'lookat'){ api.say('You', ctx.hasItem('stepladder') ? 'The stepladder, still standing exactly where it has always stood. The clips down its side are empty now &mdash; you have its pole.' : 'A ceremonial stepladder in brass and mahogany, with a hook-headed pole clipped to the side for taking portraits down. Nobody is using it for anything. The ladder is bolted to its own little plinth. The pole is not.'); return; }
          if (verb === 'pickup' || verb === 'use'){
            if (ctx.hasItem('stepladder')){ api.say('You', 'You have the pole. The ladder stays; it is bolted down.'); return; }
            ctx.setFlag('hallPoleTaken'); api.sprite('polePatch', true);
            window.CODEBOOK_SFX('sfx-click', 0.3);
            api.give('stepladder');
            api.say('You', 'The ladder itself is bolted down, ceremonially and permanently. The hook pole is only clipped to it, and comes away with a click.<br><br>Two entirely different problems in the Library have just become solvable, both of which are really the same problem: something is out of reach.<div class="state-line">+ Ceremonial Hook Pole</div>'); return;
          }
          return false;
        }

        if (id === 'dispenser'){
          if (verb === 'lookat'){ api.say('You', 'A brass machine with a mode selector: <b>FOUNDATIONAL &middot; CRITICAL &middot; POST-STRUCTURAL &middot; GERMAN &middot; EXTREMELY GERMAN</b>. A coin slot. A paper feed.'); return; }
          if (verb === 'use' || verb === 'talkto'){
            api.clearChoices();
            api.say('You', 'The dispenser waits, magnificently.');
            api.choice('Setting: FOUNDATIONAL', function(){
              api.clearChoices(); dispense('&ldquo;Social order recursively constitutes the conditions of its own reproduction.&rdquo;');
            });
            api.choice('Setting: EXTREMELY GERMAN', function(){
              api.clearChoices();
              api.say('You', 'The paper curls out across the floor, under the opposite door, and keeps going. You lose sight of the sentence somewhere near the middle and never find the verb.');
              if (!F('hallPhrase')){ ctx.setFlag('hallPhrase'); api.give('grandphrase');
                api.say('You', 'The paper curls out across the floor and under the opposite door. Buried in it, one usable fragment: <i>&ldquo;a confidential matter concerning recognition at the highest international level.&rdquo;</i><div class="state-line">+ An Extremely Grand Phrase</div>'); }
            });
            return;
          }
          return false;
        }

        if (id === 'weber'){
          if (verb === 'lookat'){
            // Looking at him has to point somewhere: the MECHANISM box gates sealing the slip,
            // which gates Act III. Since the rap battle it comes from Professor G, not from
            // behind this frame -- so the text names him, and what you still need.
            if (S.data().mechanism){
              api.say('You', 'Max Weber, nodding at nothing. Your mechanism did not come from him, and he knows it.'); return;
            }
            api.say('You', 'Max Weber, nodding. Three volumes on causality, and not a sentence in them that could ever turn out to be wrong. He is not going to write your mechanism for you.<br><br><i>' +
              (F('rapDone') ? 'Professor G, on the other hand, looks like a man who owes you one.'
                            : 'Professor G, the one in the hoodie, might &mdash; once his nerves have settled.') + '</i>');
            return;
          }
          if (verb === 'talkto'){ founder('weber'); return; }
          // The Extremely Grand Phrase is the decoy of the act: it comes out of the dispenser
          // in this very room, it sounds like theory, and a player who has just been told to
          // find a mechanism will reasonably try it here. Say why it is not one.
          if (item === 'grandphrase'){
            api.say('You', 'You hold the phrase up to the frame. <i>&ldquo;A constitutive reconfiguration of the social.&rdquo;</i><br><br>Weber nods at it. That is the problem with it. It would fit attendance, rainfall, the price of eggs and the fall of Rome, and it cannot be wrong about any of them.<br><br>A mechanism has to say <i>because</i> &mdash; why one thing would produce the other, in a way that could turn out not to be true. This says <i>concerning</i>.'); return;
          }
          if (item === 'pen' || item === 'blankcard'){
            api.say('You', 'Weber is not going to dictate. You need somebody who will say <i>because</i>. ' +
              (F('rapDone') ? 'Professor G is right there.' : 'Professor G, maybe, after his set.')); return;
          }
          if (item){ api.say('You', 'Weber declines to engage with that.'); return; }
          return false;
        }
        return false;
      }
    });
    api.sprite('polePatch', F('hallPoleTaken') || ctx.hasItem('stepladder'));

    // Tobi is the host tonight. Until the battle has happened, Look At and Talk To are about
    // the show rather than his usual rotation; afterwards he is himself again.
    var tobiBase = api.tobi;
    var tobiAsked = false;
    api.tobi = function(verb){
      if (battleBusy) return true;
      if (!F('rapDone') && verb === 'lookat'){
        api.say('You', 'Tobi, behind a ring light, holding a phone on a gimbal with the solemnity of a man carrying a relic. A lanyard reads <b>HOST</b>.');
        return true;
      }
      if (!F('rapDone') && verb === 'talkto'){
        api.clearChoices();
        api.say('Tobi', tobiAsked
          ? '&ldquo;Still no beat. Still live in ten. Still iconic.&rdquo;'
          : '&ldquo;Hiii! We are live in ten. The Founders&rsquo; Rap Battle! Three legends, one Hall. One tiny problem: our closing act will not go on without his beat.&rdquo; &ldquo;And his beat is on a USB stick in Professor Stellmacher&rsquo;s office. She borrowed it after his Christmas lecture. She is, like, his biggest fan.&rdquo;');
        tobiAsked = true;
        return true;
      }
      // afterwards, while he is still in the Hall: thanks, and the offer of an encore
      if (F('rapDone') && verb === 'talkto'){
        var first = !F('rapTobiThanks');
        ctx.setFlag('rapTobiThanks');
        api.clearChoices();
        api.say('Tobi', first
          ? '&ldquo;Honestly? Best content this department has ever made. Do not tell the Dean I said that.&rdquo; He checks the phone. &ldquo;Chat wants an encore. Chat ALWAYS wants an encore. Stick&rsquo;s still in. One more time?&rdquo;'
          : '&ldquo;The ring light is still warm. The stick is still in. Chat is still here. Encore?&rdquo;');
        api.choice('<b>&#9654; Run the rap battle again</b>', function(){ api.clearChoices(); startBattle(true); });
        api.choice('&ldquo;Maybe later.&rdquo;', function(){ api.clearChoices(); api.say('Tobi', '&ldquo;Iconic. Leave them wanting more.&rdquo;'); });
        return true;
      }
      return tobiBase(verb);
    };

    function dispense(q){
      api.say('You', 'The dispenser prints, beautifully set, on heavy card:<br><br><i>' + q + '</i><br><br>The portraits nod. It is unfalsifiable, magnificent, and says nothing about anything that happens.');
    }
  }
});
})();
</script>
<script>
/* ============================== ACT II: FELDSTROM'S WORKSHOP ============================== */
(function(){
// Coordinates read off a decile grid over the painted background. Order matters: the
// tape and the gauge are listed after the machine so they sit on top of its hotspot.
var HOTSPOTS = [
  { id:'feldstrom', label:'Prof. Feldstrom',            noun:'Feldstrom',        l:73, t:38, w:11, h:48 },
  { id:'machine',   label:'The Hypotheses Accelerator', noun:'the Accelerator',  l:30, t:12, w:42, h:76 },
  { id:'tape',      label:'A taped-over control panel', noun:'the taped panel',  l:29, t:40, w:11, h:18 },
  { id:'forbids',   label:'A gauge: THINGS THIS FORBIDS', noun:'the gauge',      l:60, t:36, w:10, h:22 },
  { id:'desk',      label:'The desk and telephone',     noun:'the telephone',    l:82, t:58, w:17, h:32 },
  { id:'thesis',    label:'An enormous doctoral thesis',noun:'the thesis',       l:3,  t:52, w:19, h:33 },
  { id:'diagrams',  label:'Motorway flow diagrams',     noun:'the diagrams',     l:0,  t:0,  w:27, h:50 },
  // ROADMAP 8j: the extension used to be behind Look At on the desk, which gated the whole
  // Stockholm chain -- the best sequence in the act -- on examining a piece of furniture
  // that looks like scenery. It is now pinned to the door panel above the telephone, where
  // it cannot be missed. The desk still works; two ways in, no new state.
  { id:'extcard',   label:'A card pinned to the door',  noun:'the pinned card', l:83.5, t:41.5, w:5.3, h:7.6 }
];
CODEBOOK_REGISTER({
  id: 'workshop', act: 'Act II', title: "Feldstrom's Workshop", doneFlag: 'workshopDone',
  prereq: CODEBOOK_ACT_GATE(2), lockedHint: 'Locked until you have a question (Act I).',
  html: CODEBOOK_ADV_HTML({ p:'ws', depth:{ backY:80, backH:40, frontY:99, frontH:58 }, floor:[82, 97], walk:[[14, 80], [10, 78]], tobiFoot:[30.0, 95.0], act:'Act II', title:'Feldstrom&rsquo;s Workshop',
    bg:'workshop-bg.webp', hotspots: HOTSPOTS, sprites: [
      // the control panel with the masking tape peeled off (8zn)
      { id:'tapePatch', src:'ws-patch-tape.webp', l:27.871, t:32.519, w:12.321, h:31.456 },
      { id:'feldstrom', voice:'feldstrom', src:'sprite-feldstrom.webp', scale:1.12, foot:[76, 96] }
    ],
    overlay:
      // Pinned high on the wall, clear of him. At its old height it sat straight across
      // his raised hand, which made a card pinned to a wall look like a card he was
      // holding, badly.
      //
      // Steam off the Accelerator, because a machine that big should be doing something
      // even when nobody is cranking it. Three plumes on the existing steamRise keyframes,
      // offset so they do not puff in unison.
      '<img src="sprite-steam.webp" alt="" class="anim-steam" style="position:absolute;left:44.5%;top:19%;width:4.2%;opacity:.5;pointer-events:none;">' +
      '<img src="sprite-steam.webp" alt="" class="anim-steam" style="position:absolute;left:49.5%;top:16.5%;width:5.4%;opacity:.42;animation-delay:-1.1s;pointer-events:none;">' +
      '<img src="sprite-steam.webp" alt="" class="anim-steam" style="position:absolute;left:54%;top:20%;width:3.6%;opacity:.38;animation-delay:-2.2s;pointer-events:none;">' +
      '<div style="position:absolute;left:84.2%;top:24.5%;width:5.3%;height:7.6%;' +
        'transform:rotate(-2.5deg);background:#efe6cf;border:1px solid #b9a679;border-radius:2px;' +
        'box-shadow:0 3px 8px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;gap:.15em;pointer-events:none;overflow:hidden;">' +
        '<div style="font-family:\'JetBrains Mono\',monospace;font-size:clamp(4px,.44vw,8px);' +
          'letter-spacing:.06em;color:#6b5a42;text-transform:uppercase;">Feldstrom</div>' +
        '<div style="font-family:\'Fraunces\',Georgia,serif;font-weight:700;' +
          'font-size:clamp(8px,.95vw,17px);line-height:1;color:#2a1d10;">4173</div>' +
      '</div>' }),
  init: function(ctx){
    window.CODEBOOK_AMBIENCE('amb-office', 0.08);
    var F = ctx.hasFlag, api;
    var S = window.CODEBOOK_SLIP;
    function here(){ return !F('wsFeldstromOut'); }
    function feld(h){ api.say('Feldstrom', h); }

    api = CODEBOOK_ADV_ROOM(ctx, {
      p: 'ws', hotspots: HOTSPOTS,
      intro: here()
        ? ['System', 'A lean-to bolted onto the side of a respectable building, full of brass, steam and ambition. A tall man is delighted to see you, which nobody in this department has been yet.']
        : ['System', 'The workshop is empty. Somewhere across campus, a man in a hurry is looking for photographers.'],
      onClick: function(id, verb, item, api){

        if (id === 'diagrams'){
          if (verb === 'lookat'){ api.say('You', 'Motorway flow diagrams, shockwaves in congestion, a phase-transition sketch, and a framed photograph of a much younger Feldstrom standing beside a traffic jam looking extremely pleased. Chalked on the door, in a different hand: <b>PEOPLE ARE NOT PARTICLES.</b> Underneath, in his: <b>UNTESTED ASSUMPTION.</b>'); return; }
          return false;
        }

        if (id === 'thesis'){
          if (verb === 'lookat'){ api.say('You', '<i>Phase Transitions in Multilane Traffic Flow</i>, M. Feldstrom, 1998. Seven hundred and forty-two pages.'); return; }
          if (verb === 'talkto' || verb === 'use'){
            if (!here()){ api.say('You', 'It is very heavy and he is not here to be asked about it.'); return; }
            feld('&ldquo;Did anyone read this?&rdquo;<br><br>&ldquo;Traffic did.&rdquo;'); return;
          }
          return false;
        }

        // The same fact, pinned where a player will actually see it. Both routes set the
        // flag, so the Library phone opens either way.
        if (id === 'extcard'){
          if (!F('wsExtension')) ctx.setFlag('wsExtension');
          api.say('You', 'An index card pinned to the door, at eye level, above the telephone:<br><br><b>PROF. DR. MAGNUS FELDSTROM &middot; EXT. 4173</b><br><i>FOR STOCKHOLM: THIS LINE IS MONITORED CONTINUOUSLY</i><br><br>Beside it a second clock, labelled <b>STOCKHOLM TIME</b>. It is one hour wrong. Nobody has told him, and at this point nobody is going to.<div class="state-line">+ You know his extension: 4173</div>');
          return;
        }

        if (id === 'desk'){
          if (verb === 'lookat'){
            if (!F('wsExtension')) ctx.setFlag('wsExtension');
            api.say('You', 'A framed card beside the telephone:<br><br><b>PROF. DR. MAGNUS FELDSTROM</b><br>Theoretical Dynamics<br><b>Extension 4173</b><br><i>FOR STOCKHOLM: THIS LINE IS MONITORED CONTINUOUSLY</i><br><br>Beside it, a second clock labelled <b>STOCKHOLM TIME</b>. It is one hour wrong. Nobody has told him.<div class="state-line">+ You know his extension: 4173</div>');
            return;
          }
          if (item === 'hourglass'){
            api.say('You', 'You set the seven-second hourglass beside the telephone. Seven seconds pass. Nothing. He turns it over without looking at you. Seven more. Nothing. Again.<br><br>&ldquo;How long have you been waiting?&rdquo;<br>&ldquo;Since 2009.&rdquo;<br>&ldquo;For Stockholm?&rdquo;<br>&ldquo;They are extremely thorough.&rdquo;');
            return;
          }
          if (verb === 'use' || verb === 'talkto'){
            api.say('You', here() ? 'You reach for the receiver. &ldquo;Please don&rsquo;t touch that.&rdquo; <i>(beat)</i> &ldquo;International call.&rdquo;' : 'The receiver is lying on the desk where he dropped it.');
            return;
          }
          return false;
        }

        if (id === 'forbids'){
          if (verb === 'lookat'){
            var n = F('wsScoped') ? 47 : (F('wsInflated') ? 0 : (S.data().scope ? 0 : 2));
            api.say('You', 'A manufacturer&rsquo;s gauge on the side of the machine, which Feldstrom has never once looked at: <b>THINGS THIS FORBIDS: ' + n + '</b>.' +
              (n === 0 ? '<br><br>&ldquo;Perfectly general,&rdquo; he says, when you point at it.<br>&ldquo;It can&rsquo;t be wrong.&rdquo;<br>&ldquo;<i>Exactly.</i>&rdquo;' : ''));
            return;
          }
          return false;
        }

        if (id === 'feldstrom'){
          if (!here()){ api.say('You', 'He is not here. You have about as long as it takes a delighted man to find a lobby with no photographers in it.'); return; }
          if (verb === 'lookat'){ api.say('You', 'Tall, magnificent, genuinely helpful, completely unmoored. A tuxedo hangs on the back of the door. A suitcase is already packed. A shelf is labelled <b>LECTURES TO CANCEL IF NECESSARY</b>.'); return; }
          if (item === 'mug'){ feld('He reads the mug. <b>WORLD&rsquo;S OKAYEST SAMPLE SIZE.</b><br><br>&ldquo;Remove that.&rdquo; &mdash; &ldquo;Why?&rdquo; &mdash; &ldquo;It implies <i>finitude</i>.&rdquo; <i>(beat)</i> &ldquo;There is no okay sample size.&rdquo; &mdash; &ldquo;What is the correct sample size?&rdquo; &mdash; <i>(he gestures expansively)</i> &ldquo;Humanity.&rdquo;'); return; }
          if (item === 'stamp'){ feld('&ldquo;Excellent.&rdquo; &mdash; &ldquo;We haven&rsquo;t collected any data.&rdquo; &mdash; &ldquo;Even better. Completely uncontaminated by observation.&rdquo;<br><br>Your slip: <b>HYPOTHESIS: STILL MISSING.</b>'); return; }
          if (item === 'blackink'){ feld('&ldquo;Maybe this will falsify it.&rdquo;<br><br>&ldquo;That is not how falsification works.&rdquo;<br><br>He is, infuriatingly, right.'); return; }
          if (item === 'pen'){ feld('&ldquo;You wrote your mechanism with <i>that</i>?&rdquo; &mdash; &ldquo;Yes.&rdquo; &mdash; &ldquo;It has teeth marks.&rdquo; &mdash; &ldquo;The mechanism still works.&rdquo; &mdash; &ldquo;&hellip;disturbing.&rdquo;'); return; }
          if (verb === 'talkto'){
            api.clearChoices();
            if (!S.data().mechanism){
              feld('&ldquo;Bring me a mechanism and I will make it <i>matter</i>. Not a citation. A mechanism. Nobody brings me mechanisms.&rdquo;');
              api.choice('&ldquo;What does the machine actually do?&rdquo;', function(){ api.clearChoices(); explainMachine(); });
              api.choice('&ldquo;Where would I get a mechanism?&rdquo;', function(){ api.clearChoices();
                feld('&ldquo;Not here. Here is where it gets <i>bigger</i>.&rdquo; He points his pipe roughly north-east, at the wall. &ldquo;The Hall of Founders. They will offer you a quotation and they will offer you an explanation, and they will pretend those are the same object.&rdquo;<br><br>&ldquo;Which do I want?&rdquo;<br><br>&ldquo;The one that says <i>because</i>.&rdquo;'); });
              return;
            }
            feld('&ldquo;Excuse me. I have to keep the line free.&rdquo; &mdash; &ldquo;Are you expecting someone?&rdquo; &mdash; &ldquo;Stockholm.&rdquo; &mdash; &ldquo;Right.&rdquo; &mdash; &ldquo;They tend to call around this time of year.&rdquo;');
            api.choice('&ldquo;What does the machine actually do?&rdquo;', function(){ api.clearChoices(); explainMachine(); });
            api.choice('Show him the mechanism', function(){
              api.clearChoices();
              feld('He reads it for a long moment. &ldquo;<i>Flow.</i>&rdquo;<br><br>&ldquo;Sorry?&rdquo;<br><br>&ldquo;Individuals enter the lecture stream. Exposure accumulates. Performance emerges downstream.&rdquo; <i>(he begins drawing arrows)</i><br><br>&ldquo;They&rsquo;re students, not cars.&rdquo;<br><br>&ldquo;That distinction has not yet proved theoretically useful.&rdquo;');
              ctx.setFlag('wsShown');
            });
            api.choice('&ldquo;Can the machine go the other way? Smaller?&rdquo;', function(){
              api.clearChoices();
              feld('&ldquo;It <i>can</i>.&rdquo; He glances at the masking tape. &ldquo;It will not, while I am in the room. I never leave this room.&rdquo;<br><br>&ldquo;Never?&rdquo;<br><br>&ldquo;Unless Stockholm calls. Then I leave at once. There will be photographers.&rdquo;<br><br><i>His extension is pinned by the door. Somebody would have to ring it &mdash; and sound like Stockholm.</i>');
            });
            api.choice('&ldquo;Which Nobel Prize are you expecting?&rdquo;', function(){
              api.clearChoices();
              feld('&ldquo;That is Stockholm&rsquo;s problem.&rdquo;<br><br>&ldquo;There isn&rsquo;t a Nobel Prize for sociology.&rdquo;<br><br>&ldquo;Not <i>currently</i>.&rdquo;');
            });
            return;
          }
          return false;
        }

        if (id === 'machine' || id === 'tape'){
          if (verb === 'lookat'){
            api.say('You', 'A contraption cannibalised out of his old traffic apparatus. The manufacturer&rsquo;s plate above the drum:<br><br><b>HYPOTHESES ACCELERATOR Mk III</b><br>&#9668; SPECIFY &nbsp;&nbsp;&nbsp; GENERALISE &#9658;<br><i>GENERAL IDEA IN &mdash; RISKY PREDICTION OUT.<br>Specify until reality can answer back.</i><br><br>Underneath, on a strip of masking tape, in marker: <i>i.e. the same statement at different magnifications</i>.<br><br>' +
              (F('wsTapeOff') ? 'The left-hand panel is uncovered and the ratchets turn both ways.' : 'The entire left-hand control panel is covered in masking tape, with <b>DO NOT</b> written across it.'));
            return;
          }
          // The card Professor G dictated is the thing this machine is for, so let the
          // player do the obvious and put it in.
          if (item === 'mechanismcard'){
            api.say('You', 'You post the card into the hopper. The drum takes it, turns it over twice, and holds it up to a lamp as though checking a banknote.');
            setTimeout(function(){ if (here()) openAccelerator(); }, 1300);
            return;
          }
          if (verb === 'use' || verb === 'pickup' || verb === 'talkto'){
            // The Accelerator is the best toy in the game and it used to be locked behind
            // the Hall of Founders. Now it always runs: with nothing of yours in the
            // hopper Feldstrom feeds it one of his own specimens, which is funnier anyway
            // and lets a player meet the machine before they know what it is for.
            if (!S.data().mechanism && !ctx.hasFlag('wsSpecimen')){
              ctx.setFlag('wsSpecimen');
              feld('&ldquo;You have nothing to put in it.&rdquo; <i>(this does not appear to bother him)</i><br><br>He takes a curled specimen card off a nail above the hopper and posts it in. <b>&ldquo;Mine. From 1998. Watch.&rdquo;</b>');

      onClick: function(id, verb, item, api){

    });

    // Two lines, because the mechanism predicts two things (ROADMAP 8zl, S1): WHERE the gap is

    // accepted "larger among students practising elsewhere" -- the opposite of the hypothesis.
    // A wrong card now names the rival explanation that predicts the same, and why.

    var WHOM  = { 'everyone equally': 'MOTIVATION: keen students go to lectures and try harder everywhere. A gap that is the same for everyone is exactly what it predicts.',

    // What you write is on the board, in chalk, in its three columns (8zn). Column one is

    function chalk(){

      var el = document.getElementById('sm_chalk');

        el = document.createElement('div'); el.id = 'sm_chalk'; el.style.cssText = 'position:absolute;inset:0;pointer-events:none;';

        'The gap should be <b>LARGER</b> on: ' + (pick.where || '&mdash;') + '<br>The gap should be <b>SMALLER</b> for: ' + (pick.whom || '&mdash;'));

      Object.keys(WHOM).forEach(function(w){ api.choice((pick.whom === w ? '&#9679; ' : '&#9675; ') + 'SMALLER for ' + w, function(){ pick.whom = w; cardMenu(); }); });
      if (pick.where && pick.whom) api.choice('<b>Write it on the board</b>', judge);

    function judge(){

        setTimeout(cardMenu, 2600);
        return;
      }
      S.set('hypothesis', 'If attendance works through practice on worked examples, the attendance–performance gap will be LARGER on exam questions resembling the worked examples, and SMALLER among students already practising elsewhere. If it is not, the mechanism is wrong.', true);
      ctx.complete();
      window.CODEBOOK_SFX('sfx-chalk', 0.3);
      chalk();
      api.give('altcard');
      api.say('Visiting Fellow', 'You write it out. Nothing slides underneath it. Selection predicts a gap everywhere; this predicts a gap in one particular place and a smaller one somewhere specific.<br><br>She reads it twice.<br><br>&ldquo;That would annoy me.&rdquo;<br>&ldquo;Is that approval?&rdquo;<br><i>(she signs the form)</i><br>&ldquo;It&rsquo;s the closest you&rsquo;re getting.&rdquo;<br><br>She slides one of her cards across the table as you go. <b>SELECTION.</b> &ldquo;Keep it. Somebody will ask you about it later, and you will want to have thought about it before they do.&rdquo;<div class="state-line win">Slip: HYPOTHESIS AND FALSIFIER filled &mdash; signed &middot; + ALTERNATIVE EXPLANATION card</div>', 'win');
    }
  }
});
})();

<script>

(function(){

    function breakSeal(){

        return;
      }
      // The honest analysis: the effect is where the mechanism said, and the interval is
      // tight enough for the answer to mean something either way.
      var win = Math.random() < 0.5;

        ctx.setFlag('resultHolds');
        api.say('System', 'The gap <i>is</i> larger on the worked-example questions, and smaller among the students already practising elsewhere. Not dramatically. The interval is narrow enough to rule out nothing-at-all, and narrow enough to rule out the enormous version too.<br><br>No bell rings. No lamp comes on. The banner stays down.<br><br>It means something precisely because it was written when it could have failed.<div class="state-line win">Result: the prediction holds, modestly</div>', 'win');
      } else {
        ctx.setFlag('resultNull');
        api.say('System', 'The gap is the same size on both kinds of question. Flat. The interval is narrow &mdash; narrow enough to rule out the effect the mechanism needed, not just narrow enough to shrug.<br><br>Your explanation predicted something, and the something is not there.<div class="state-line win">Result: the prediction fails, informatively</div>', 'win');
        setTimeout(function(){
          api.sprite('skeptic', true);
          window.CODEBOOK_SFX('sfx-page', 0.22);
          api.say('The Skeptic', 'Footsteps on the basement stairs. She has a notebook with her, Volume XI, and she is already opening it.<br><br>&ldquo;You predicted where it would be.&rdquo;<br>&ldquo;It isn&rsquo;t there.&rdquo;<br>&ldquo;And your interval is tight enough that you know it isn&rsquo;t there, rather than that you couldn&rsquo;t see it.&rdquo; <i>(she writes)</i> &ldquo;That is the interesting kind.&rdquo;<br><br>&ldquo;It feels like failing.&rdquo;<br>&ldquo;It is the opposite. You have removed an explanation from circulation. Most people never manage one.&rdquo;');
        }, 2600);
      }
    }

    // The Skeptic is on the stairs from the start now (8zu): the only person not playing.
    api.sprite('skeptic', true);
  }
});
})();

<script>
/* ============================== ACT IV: THE DELEGATION ENGINE ============================== */
(function(){
// ROADMAP 8zp. The room is KIRA's terminal now. You ask her to analyse your data; she answers

var HOTSPOTS = [
  { id:'kira',   label:'KIRA',                   noun:'KIRA',          l:50, t:58, w:24, h:32 },

CODEBOOK_REGISTER({

  html: CODEBOOK_ADV_HTML({ p:'dl', depth:{ backY:72, backH:30, frontY:99, frontH:54 }, floor:[74, 97], walk:[[14, 86], [10, 90]], tobiFoot:[30.0, 95.0], act:'Act IV', title:'The Delegation Engine',
    bg:'delegation-bg.webp', hotspots: HOTSPOTS, sprites: [
      // The gold rush (ROADMAP 8zu): the department queueing for the Codebook in the back

      { id:'qDirector',  src:'sprite-director-printout.webp', foot:[51.5, 73] },

  init: function(ctx){
    window.CODEBOOK_AMBIENCE('amb-studio', 0.08);

    var CLAIMS = [
      { id:'n', prof:'N is nine. Count them.', t:'&#128202; <b>Sample:</b> N = 140 students.', stamp:'WRONG N',

        no:['Imputation can be fine. Imputing the answer you wanted is not.', 'Power from invented answers is not power.'] },
      { id:'p', prof:'Twenty tests and one winner. That is a lottery.', t:'&#9989; <b>Result:</b> attendance is highly significant (p &lt; 0.001).', stamp:'FORKING PATHS',
        r:['Nine people, and she ran twenty models and kept the best. That p-value means nothing.', 'p &lt; 0.001 just means the effect is big.', 'Nothing. Significant is good.'],
        no:['A p-value is not an effect size.', 'Significant after twenty tries is what chance looks like.'] },
      { id:'cause', prof:'&lsquo;Causes&rsquo;. From a survey.', t:'&#127891; <b>Conclusion:</b> attending lectures <i>causes</i> 23% higher marks.', stamp:'NOT CAUSAL',
        r:['It is a survey. Associated with, not causes.', 'The number should be 32%.', 'Nothing. Students chose to attend, so it is causal.'],

      { id:'cite', prof:'Read past the abstract.', t:'&#128218; <b>Literature:</b> consistent with M&uuml;ller &amp; Singh (2023).', stamp:'ABSTRACT ONLY',
        r:['Its own conclusion says the effect vanished after adjustment. She read the abstract.', 'It needs a page number.', 'Nothing. One citation is enough.'],
        no:['A page number would at least have sent her to the conclusion.', 'Enough citations of the wrong thing is still the wrong thing.'] },

    function renderDl(){

        'text-align:center;font:900 clamp(7px,.85vw,12px)/1.15 \'JetBrains Mono\',monospace;letter-spacing:.04em;box-shadow:0 4px 10px rgba(0,0,0,.5);">' + txt + '</div>'; };
      el.innerHTML =

                  '<div style="position:absolute;left:73.5%;top:29.9%;font:900 clamp(7px,.8vw,11px) \'JetBrains Mono\',monospace;color:#ff8a80;letter-spacing:.08em;">' + (done ? 'CANCELLED' : 'PAUSED') + '</div>' : '') +

    // The printouts the queue is holding: everyone else's Codebook results (8zu).

    var QUEUE = [
      ['qDirector',  51.5, 'FIELDWORK', '100% RESPONSE, AGAIN', 'p < .001', 0.19, 0.11],
      ['qOfficer',   60.5, 'SAMPLING', 'A PERFECTLY RANDOM FINDING', 'p = .03', 0.5, 0.36],
      ['qFeldstrom', 70.5, 'FELDSTROM', 'CIVILISATION IS TRAFFIC', 'p < .0001', 0.26, 0.13]

    function renderQueue(){

      return '<svg viewBox="0 0 220 150" width="100%"><rect width="220" height="150" fill="#fff"/>' +
        '<text x="110" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#111">Marks by attendance &#128293;</text>' +
        '<line x1="34" y1="22" x2="34" y2="126" stroke="#333"/><line x1="34" y1="126" x2="206" y2="126" stroke="#333"/>' +
        [70,75,80,85,90].map(function(v){ var y = 126 - (v-70)/25*104; return '<text x="30" y="' + (y+3) + '" text-anchor="end" font-size="8" fill="#333">' + v + '</text><line x1="31" x2="34" y1="' + y + '" y2="' + y + '" stroke="#333"/>'; }).join('') +
        '<rect x="58" y="' + (126 - 1/25*104) + '" width="50" height="' + (1/25*104) + '" fill="#e74c3c"/><rect x="132" y="' + (126 - 22/25*104) + '" width="50" height="' + (22/25*104) + '" fill="#2ecc71"/>' +
        '<text x="83" y="138" text-anchor="middle" font-size="8" fill="#333">Skipped</text><text x="157" y="138" text-anchor="middle" font-size="8" fill="#333">Attended</text>' +
        '<text x="157" y="' + (126 - 22/25*104 - 4) + '" text-anchor="middle" font-size="9" font-weight="700" fill="#111">92</text><text x="83" y="' + (126 - 1/25*104 - 4) + '" text-anchor="middle" font-size="9" font-weight="700" fill="#111">71</text></svg>';
    }

    function openTerminal(){
      var wrap = document.getElementById('dl_sceneWrap'); if (!wrap) return;

    function renderTerminal(streamFrom){

    function shuffle(a){ return a.map(function(x){ return [Math.random(), x]; }).sort(function(p, q){ return p[0] - q[0]; }).map(function(p){ return p[1]; }); }

  '.kn-hub{position:absolute;left:50%;bottom:-9%;width:16%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#b8893a;border:2px solid #3a2414;}' +

  '.kn-mlab b{color:#e0b458;font-size:.85em;letter-spacing:.2em;}' +

  '.kn-chat-h{padding:4px 6px;background:rgba(255,255,255,.08);font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}' +
  '.kn-chat-h i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#ff3b3b;margin-right:5px;animation:knLive 1s infinite;}' +
  '@keyframes knLive{50%{opacity:.25}}' +
  '.kn-chat-list{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:4px 6px;gap:3px;overflow:hidden;}' +
  '.kn-msg{animation:knMsg .3s ease-out;overflow-wrap:anywhere;}' +
  '@keyframes knMsg{from{transform:translateY(8px);opacity:0}}' +
  '.kn-por{position:absolute;pointer-events:none;transform-origin:50% 100%;}' +
  '.kn-por.kn-clap{animation:knClap .42s ease-in-out 6 alternate;}' +

  '.kn-fig.kn-walk{transition:left 2.4s ease-out;}' +
  // phones (8zs classes): the scene is small, so the meter drops its middle word and the
  // livestream keeps only its last four messages
  '.cb-phone-p .kn-mlab b,.cb-phone-l .kn-mlab b{display:none;}' +
  '.cb-phone-p .kn-meter,.cb-phone-l .kn-meter{width:19%;}' +

<script>
/* ============================== ACT V: THE WRITING ROOM ============================== */
(function(){
// Coordinates read off a decile grid over the painted background. The painting wrote the
// abstract itself: "1. A simple idea. 2. A careful test. 3. A modest result. 4. A longer
// conversation." -- which is the shape of the four sentences this room is about.
var HOTSPOTS = [
  { id:'abstract',  label:'KIRA&rsquo;s abstract',   noun:'the abstract',  l:9,  t:6,  w:19, h:34 },
  { id:'table',     label:'The long table',          noun:'the table',     l:0,  t:44, w:60, h:45 },
  { id:'impact',    label:'The IMPACT gauge',        noun:'the gauge',     l:26, t:0,  w:28, h:32 },
  { id:'feldstrom', label:'Prof. Feldstrom',         noun:'Feldstrom',     l:60, t:48, w:16, h:50 },
  { id:'kira',      label:'KIRA',                    noun:'KIRA',          l:76, t:60, w:10, h:36 },
  { id:'phone',     label:'A telephone',             noun:'the telephone', l:84, t:55, w:14, h:22 },
  // 8zv: the Gap Registry's question is asked here now; the Registrar has come over with his drawers' worth of papers
  { id:'registrar', label:'The Registrar of Gaps',  noun:'the Registrar', l:72, t:36, w:8,  h:40, primary:'talkto' }
];
CODEBOOK_REGISTER({
  id: 'writingroom', act: 'Act V', title: 'The Writing Room', doneFlag: 'writingDone',
  prereq: CODEBOOK_ACT_GATE(5), lockedHint: 'Locked until the evidence is verified (Act IV).',
  html: CODEBOOK_ADV_HTML({ p:'wr', depth:{ backY:82, backH:38, frontY:99, frontH:58 }, floor:[84, 97], walk:[[8, 92], [4, 95]], tobiFoot:[30.0, 95.0], act:'Act V', title:'The Writing Room',
    bg:'writingroom-bg.webp', hotspots: HOTSPOTS, sprites: [
      { id:'registrar', voice:'registrar', src:'sprite-registrar-papers.webp', scale:0.92, foot:[76, 80] },
      { id:'feldstrom', voice:'feldstrom', src:'sprite-feldstrom-pen.webp', scale:1.12, foot:[68, 97] },
      { id:'kira', voice:'kira', src:'sprite-kira-pages.webp', scale:0.62, foot:[81, 96], roll:-16 }
    ] }),
  init: function(ctx){
    window.CODEBOOK_AMBIENCE('amb-office', 0.07);
    var F = ctx.hasFlag, api;
    function reg(h){ api.say('Registrar', h); }
    // Three words in four otherwise excellent sentences have crossed the evidential line.
    var words = { improved:false, demonstrate:false, people:false };
    var titleStage = 0;
    var TITLES = [
      'LECTURE ATTENDANCE AND EXAM PERFORMANCE IN A FIRST-YEAR METHODS COURSE',
      'WHAT MAKES STUDENTS LEARN',
      'EDUCATIONAL EXPOSURE AND HUMAN CAPITAL FORMATION',
      'INSTITUTIONS AND THE PRODUCTION OF HUMAN CAPACITY',
      'CIVILISATION IS TRAFFIC'
    ];
    var IMPACT = ['Modest Contribution', 'Paradigm Shift', 'Nobel Adjacent', 'Nobel Adjacent', 'PRESS OFFICE HAS BEEN ALERTED'];
    function fixed(){ return (words.improved?1:0) + (words.demonstrate?1:0) + (words.people?1:0); }

    api = CODEBOOK_ADV_ROOM(ctx, {
      p: 'wr', hotspots: HOTSPOTS,
      intro: ['System', 'A long table, a typewriter, and two collaborators who both want to help. This is the last room, and both of them are being generous.'],
      onClick: function(id, verb, item, api){

        if (id === 'phone'){
          if (verb === 'lookat'){ api.say('You', 'A telephone. Feldstrom has positioned his chair so that he can see it without appearing to.'); return; }
          return false;
        }

        if (id === 'registrar'){
          if (verb === 'lookat'){ api.say('You', 'The Registrar of Gaps, who has come over from his office with an armful of papers because, as he puts it, the poster cannot be printed until somebody says what it adds.'); return; }
          if (verb === 'talkto' || verb === 'use'){
            api.clearChoices();
            if (F('gapDone')){ reg('&ldquo;Filed. Small, and connected to something. That is the rare kind.&rdquo;'); return; }
            if (!ctx.hasItem('interpretation')){ reg('&ldquo;And what does your result <i>mean</i>? That is the Bureau&rsquo;s counter, and they will have made you write it yourself.&rdquo;'); return; }
            if (!ctx.hasItem('readinglist')){ reg('&ldquo;A contribution is stated <i>against</i> something. Where is your reading list?&rdquo;'); return; }
            if (!F('gpCompared')){ ctx.setFlag('gpCompared'); window.CODEBOOK_SFX('sfx-paper', 0.24); }
            reg('He pulls three papers from your reading list and lays them beside your result. Two are cross-sectional and could not have separated the mechanism from selection. The third adjusted for nothing and reports an estimate about twice the size of yours.<br><br>&ldquo;Right. Against these three: what is the contribution?&rdquo;');
            api.choice('&ldquo;It confirms the three papers: attending lectures improves marks.&rdquo;', function(){
              api.clearChoices();
              reg('&ldquo;Does it?&rdquo; He taps the third paper. &ldquo;Your estimate is half the size of this one, and it sits in one place. That is not confirming them. That is correcting them.&rdquo;');
            });
            api.choice('&ldquo;It shows that lectures cause better exam results.&rdquo;', function(){
              api.clearChoices();
              reg('&ldquo;Your study is observational. The Bureau made you write that down.&rdquo; He does not look up. &ldquo;Say what it shows, not what you wish it showed.&rdquo;');
            });
            api.choice('&ldquo;Nobody has studied this at this university before.&rdquo;', function(){
              api.clearChoices();
              reg('&ldquo;Correct, and irrelevant.&rdquo; He does not even open a drawer. &ldquo;Try again, and this time tell me what somebody would now believe differently.&rdquo;');
            });
            api.choice('&ldquo;A boundary condition on three existing papers: the association is concentrated where the practice mechanism predicts, and it is smaller than their unadjusted estimates.&rdquo;', function(){
              api.clearChoices();
              ctx.setFlag('gapDone');
              api.give('contribution');
              window.CODEBOOK_SFX('sfx-stamp', 0.3);
              reg('He writes it down himself, which he has not done in some time. Then he opens a drawer you had not noticed, takes out a small brass tag on a chain, and presses your sentence into it with a hand press, one letter at a time.<br><br>&ldquo;Small. Specific. <i>Attached</i> to something.&rdquo; He holds up the chain. &ldquo;That is a contribution.&rdquo;<br><br>From the doorway, a voice you were hoping to avoid for slightly longer:<br><br>&ldquo;Your contribution is a general law of social flow.&rdquo;<br>&ldquo;My contribution is a boundary condition on three existing papers.&rdquo;<br>&ldquo;That is not a contribution. That is a <i>footnote</i>.&rdquo;<br>&ldquo;It&rsquo;s a true footnote.&rdquo;<br>&ldquo;&hellip;&rdquo; <i>(he writes it down)</i><div class="state-line win">+ Contribution stated</div>', 'win');
            });
            return;
          }
          return false;
        }
        if (id === 'impact'){
          if (verb === 'lookat'){ api.say('You', 'A large gauge marked <b>IMPACT</b>, currently reading <b>' + IMPACT[titleStage] + '</b>.'); return; }
          return false;
        }

        if (id === 'kira'){
          if (verb === 'lookat'){ api.say('You', 'KIRA, who is now genuinely good at this, which is the trap.'); return; }
          if (verb === 'talkto'){ api.say('KIRA', '&ldquo;Certainly. &hellip;What exactly do you mean?&rdquo; <i>(she waits)</i> &ldquo;I have learned to ask. I have not learned to know.&rdquo;'); return; }
          return false;
        }

        if (id === 'feldstrom'){
          if (verb === 'lookat'){ api.say('You', 'Older, exactly the same. The tuxedo is here too, on a hanger, three acts further into a wait that has not ended.'); return; }
          if (verb === 'talkto' || verb === 'use'){
            api.clearChoices();
            if (F('writingDone')){ api.say('Feldstrom', '&ldquo;They&rsquo;ll call back.&rdquo;'); return; }
            if (titleStage === 0 && !F('wrGreeted')){
              ctx.setFlag('wrGreeted');
              api.say('Feldstrom', '&ldquo;<i>You.</i>&rdquo;<br>&ldquo;Professor.&rdquo;<br>&ldquo;Stockholm never arrived.&rdquo;<br>&ldquo;Terrible.&rdquo;<br>&ldquo;They called, though.&rdquo;<br>&ldquo;&hellip;did they?&rdquo;<br>&ldquo;Very strange line.&rdquo;<br><br>He does not suspect you. He has simply never stopped waiting.');
              return;
            }
            api.say('Feldstrom', titleStage === 0
              ? 'He reads your result. &ldquo;Excellent.&rdquo;<br>&ldquo;It is?&rdquo;<br>&ldquo;You have discovered a flow law.&rdquo;<br>&ldquo;No.&rdquo;<br><i>(he is already reaching for the title page)</i><br>&ldquo;Educational exposure enters here. Achievement exits here. Between them&mdash;&rdquo;<br>&ldquo;Please don&rsquo;t say phase transition.&rdquo;<br>&ldquo;&mdash;a phase transition.&rdquo;'
              : 'Current title: <b>' + TITLES[titleStage] + '</b><br><br>&ldquo;Bigger,&rdquo; he says, not unkindly. &ldquo;It is <i>true</i> at every size. Why would you choose the smallest one?&rdquo;');
            api.choice('Let him make it bigger', function(){
              api.clearChoices();
              if (titleStage >= TITLES.length - 1){
                ctx.setFlag(window.CODEBOOK_FAIL.claimOverstated);
                window.CODEBOOK_SFX('sfx-klaxon', 0.2);
                api.say('Feldstrom', '<b>' + TITLES[titleStage] + '</b><br><br>The IMPACT gauge hits <b>PRESS OFFICE HAS BEEN ALERTED</b> and stays there.<br><br>Feldstrom whispers: &ldquo;Stockholm.&rdquo;<div class="state-line">The claim has left the building.</div>');
                return;
              }
              titleStage++;
              window.CODEBOOK_SFX('sfx-counter-ping', 0.24);
              api.say('Feldstrom', '<b>' + TITLES[titleStage] + '</b><br><br>IMPACT: <b>' + IMPACT[titleStage] + '</b>.' + (titleStage >= 3 ? '<br><br>He removes his glasses.' : ''));
            });
            if (titleStage > 0) api.choice('Wind the title back down', function(){
              api.clearChoices();
              titleStage--;
              api.say('You', 'You cross it out and write the smaller one back in. There is no lever for this; you just have to do it.<br><br><b>' + TITLES[titleStage] + '</b>');
            });
            api.choice('Refuse him', function(){ api.clearChoices(); refuse(); });
            return;
          }
          return false;
        }

        if (id === 'table'){
          if (verb === 'lookat' || verb === 'use' || verb === 'talkto'){ abstractMenu(); return; }
          return false;
        }
        if (id === 'abstract'){
          if (verb === 'lookat' || verb === 'use' || verb === 'talkto'){ abstractMenu(); return; }
          // ROADMAP 8a, last stop on the did-not-read-it thread before the outro pays it
          // off: Reviewer 2's comment 1 is the same joke from the other side of the desk.
          if (verb === 'pickup'){
            api.say('You', 'Clipped to the back of the abstract is a note from your second author, who was added to this paper in March and has sent exactly one message about it:<br><br><i>&ldquo;Looks great, happy to be on it, no comments!&rdquo;</i><br><br>The message is timestamped four minutes after you sent the draft. The draft is thirty-one pages long.'); return;
          }
          return false;
        }
        return false;
      }
    });

    function abstractMenu(){
      api.clearChoices();
      if (F('writingDone')){ api.say('You', 'The abstract says what happened, and no more than that.'); return; }
      if (!ctx.hasItem('contribution')){
        api.say('KIRA', '&ldquo;Certainly! Shall I submit?&rdquo;<br><br>The four sentences are all there and one of them is blank: the one that says what this <i>adds</i>. The Registrar, by the window with an armful of papers, is waiting to be asked exactly that.');
        return;
      }
      api.say('You', 'KIRA&rsquo;s abstract. Four sentences, fluent, correctly formatted, and very slightly not true:<br><br>' +
        '<i>&ldquo;Lecture attendance <b' + (words.improved ? '' : ' style="color:#b3261e"') + '>' + (words.improved ? 'was associated with' : 'improved') + '</b> exam performance among ' +
        '<b' + (words.people ? '' : ' style="color:#b3261e"') + '>' + (words.people ? 'first-year Methods students' : 'people') + '</b>. ' +
        'The results <b' + (words.demonstrate ? '' : ' style="color:#b3261e"') + '>' + (words.demonstrate ? 'are consistent with' : 'demonstrate') + '</b> a practice mechanism.&rdquo;</i><br><br>' +
        'Words still over the line: <b>' + (3 - fixed()) + '</b>.' +
        '<br>Title page: <b>' + TITLES[titleStage] + '</b>' + (titleStage ? ' <span style="color:#b3261e">(not what you found)</span>' : '') + '.');
      // ROADMAP 8zl, WR1: each red word is a decision, not a pre-filled correction.
      if (!words.improved) api.choice('Change &ldquo;<b>improved</b>&rdquo;&hellip;', function(){
        pick('improved', [
          ['caused', '&ldquo;Caused?&rdquo; KIRA brightens. &ldquo;That is even stronger.&rdquo;<br><br>It is. It is also something an observational study cannot say. You leave the word red.'],
          ['was associated with', null, '&ldquo;I strengthened the phrasing.&rdquo;<br>&ldquo;Change it back.&rdquo;<br>&ldquo;Certainly. &hellip;What exactly do you mean?&rdquo;<br>&ldquo;&lsquo;Associated with&rsquo;.&rdquo;<br>&ldquo;That is weaker.&rdquo;<br>&ldquo;That is what happened.&rdquo;'],
          ['predicted', 'KIRA types it, then hesitates. &ldquo;Predicted implies you forecast marks you had not seen yet. Did you?&rdquo;<br>You did not. The word stays red.']
        ]);
      });
      if (!words.demonstrate) api.choice('Change &ldquo;<b>demonstrate</b>&rdquo;&hellip;', function(){
        pick('demonstrate', [
          ['are consistent with', null, '&ldquo;One study,&rdquo; you say. &ldquo;One course, one term.&rdquo;<br>&ldquo;Consistent with is a very small verb.&rdquo;<br>&ldquo;It is the right size.&rdquo;'],
          ['prove', 'One study, one course, one term. &ldquo;Prove&rdquo; is further over the line, not back behind it. The word stays red.'],
          ['confirm', '&ldquo;Confirm&rdquo; means someone had shown it before and you checked. Nobody had, not for this course: that is what the three papers were for. The word stays red.']
        ]);
      });
      if (!words.people) api.choice('Change &ldquo;<b>people</b>&rdquo;&hellip;', function(){
        pick('people', [
          ['students', '&ldquo;Which students?&rdquo; KIRA asks, reasonably. &ldquo;All of them? Everywhere?&rdquo; Your sample was one course. The word stays red.'],
          ['first-year Methods students', null, 'You put the scope back in &mdash; the one you dragged a professor down to, in a lean-to, two acts ago.<br><br>Feldstrom, from across the table, without looking up: &ldquo;Terribly small.&rdquo;<br>&ldquo;Yes.&rdquo;<br>&ldquo;&hellip;brave.&rdquo;'],
          ['young adults', 'Wider, not narrower. Your data never left one lecture hall. The word stays red.']
        ]);
      });
      api.choice('It reads fine. Leave it.', function(){
        api.clearChoices();
        ctx.setFlag(window.CODEBOOK_FAIL.claimOverstated);
        api.say('KIRA', '&ldquo;Certainly!&rdquo; she says, and files it.<br><br>It is fluent, it is well structured, and in three places it says more than you found.');
      });
      if (fixed() === 3) api.choice('<b>This is what happened. Finish it.</b>', function(){ api.clearChoices(); refuse(true); });
      function word(h){ api.clearChoices(); api.say('KIRA', h); setTimeout(abstractMenu, 2000); }
      function pick(key, opts){
        api.clearChoices();
        api.say('KIRA', '&ldquo;Certainly. What should it say instead?&rdquo;');
        opts.forEach(function(o){
          api.choice('&ldquo;' + o[0] + '&rdquo;', function(){
            if (o[1]){ api.clearChoices(); window.CODEBOOK_SFX('sfx-refuse', 0.18); api.say('KIRA', o[1]); setTimeout(abstractMenu, 2600); return; }
            words[key] = true; window.CODEBOOK_SFX('sfx-page', 0.22); word(o[2]);
          });
        });
      }
    }

    function refuse(fromAbstract){
      if (fromAbstract !== true){
        // Refusing Feldstrom puts the small title back; it is half of finishing.
        api.clearChoices();
        titleStage = 0;
        window.CODEBOOK_SFX('sfx-page', 0.24);
        if (fixed() < 3){
          api.say('You', 'You put the small title back on the front page: <b>' + TITLES[0] + '</b>.<br><br>Feldstrom sighs. The abstract under it still says more than you found. Fix the red words.');
          setTimeout(abstractMenu, 2200);
          return;
        }
      } else if (titleStage > 0){
        api.say('You', 'The words are right now, but the front page still says <b>' + TITLES[titleStage] + '</b>. That is not what you found. Take the title back from Feldstrom first.');
        return;
      }
      api.clearChoices();
      titleStage = 0;
      // WR1: a repaired abstract is a repaired claim, whatever was bought at the Bureau.
      if (ctx.hasFlag(window.CODEBOOK_FAIL.claimOverstated)) ctx.clearFlag(window.CODEBOOK_FAIL.claimOverstated);
      ctx.complete();
      window.CODEBOOK_SFX('sfx-page', 0.3);
      api.say('Feldstrom', 'You put the small title back on the front page and hand him the abstract with three words changed.<br><br>He is not angry. He is disappointed in a way that is slightly sad, because he means every word of it.<br><br>&ldquo;You could have had all of it.&rdquo;<br>&ldquo;Not with my name on it.&rdquo;<br><i>(a long pause)</i><br>&ldquo;&hellip;Then we shall see what the hall makes of it.&rdquo;<br><br>He stamps the folder himself. <b>CLAIM DEFENSIBLE.</b><div class="state-line win">Folder stamped: CLAIM DEFENSIBLE</div>', 'win');
      window.CODEBOOK_ITEM_LABELS.folder = 'Research Folder — Claim Defensible';
      setTimeout(phoneGag, 3200);
    }

    function phoneGag(){
      window.CODEBOOK_SFX('sfx-phone-ring', 0.3);
      api.say('Feldstrom', '<b>The telephone rings.</b><br><br>Both of you freeze. He turns towards it very slowly.<br><br>&ldquo;Nobody move.&rdquo;<br><br>He answers. A long pause. His expression collapses.<br><br>&ldquo;Yes. I am aware that my vehicle&rsquo;s warranty is expiring.&rdquo;<br><br><i>Click.</i><br><br>&ldquo;They&rsquo;ll call back.&rdquo;');
      api.clearChoices();
      api.choice('Take the poster to the Mensa', function(){ api.clearChoices(); ctx.goMap(); });
    }
  }
});
})();
</script>
<script>
/* ============================== ROOM: SURVEY LAB ============================== */
(function(){
var HOTSPOTS = [
  { id:'nurse',     label:'The Nurse',                       noun:'the Nurse',             l:10,   t:43,   w:13,   h:55 },
  { id:'sign',      label:'A sign',                         noun:'the sign',              l:8,    t:16,   w:10.5, h:21.8 },

];

CODEBOOK_REGISTER({
  id: 'surveylab', act: 'Act III', title: 'Survey Lab', doneFlag: 'surveyDone',
  prereq: CODEBOOK_ACT_GATE(3),
  lockedHint: 'Locked until your Prediction Slip is sealed (Act II).',
  html: CODEBOOK_ADV_HTML({ p:'sv', tobiFoot:[38.0, 92.0], act:'Act III', title:'Survey Lab &mdash; Emergency Department', bg:'surveylab-bg.webp', hotspots: HOTSPOTS, sprites: SPRITES, overlay: OVERLAY }),
  init: function(ctx){
    window.CODEBOOK_AMBIENCE('amb-ward', 0.1);
    var F = ctx.hasFlag;
    function fixedCount(){ return ['svFixDB','svFixLead','svFixOften','svFixScale'].filter(F).length; }
    function nurse(html){ api.say('Nurse', html); }

    function chart(l, t, w, rot, num, body, dx, ok){

      var p = BOARD_SLOTS[i];
      return '<div class="sv-pinned" style="left:' + p[0] + '%;top:' + p[1] + '%;">' +
        '<div class="hd">Q' + (i + 1) + '</div><div class="q">' + text + '</div><div class="ok">&#10004;</div></div>';
    }
    function renderBoard(){
      var b = document.getElementById('sv_board'); if (!b) return;

        (F('svFixLead') ? boardChart(1, '&ldquo;How, if at all, has the attendance policy affected your student life?&rdquo;') : '') +
        (F('svFixOften') ? boardChart(2, '&ldquo;In the last four weeks, how many lectures did you miss?&rdquo;') : '') +

      api.say('Nurse', 'She looks at the board: four charts, four green ticks. Then she runs off a copy of all four, squares the copies into a neat little stack and staples them together.<br><br>&ldquo;Discharged. All of them. That is a questionnaire now.&rdquo; She stamps the DATA divider of your folder with alarming force. &ldquo;Obviously you can&rsquo;t give it to anyone.&rdquo; &mdash; &ldquo;Why?&rdquo; &mdash; &ldquo;Ethics.&rdquo;<div class="state-line win">&#9745; DATA: INSTRUMENT EXISTS</div>', 'win');

    var struck = false;      // patient 2 mid-surgery: the pen's strike-throughs are showing

      onClick: function(id, verb, item, api){
        if (item === 'stamp'){ api.say('You', 'You stamp SIGNIFICANT (p&lt;.05) on a chart. The nurse looks at you as if you&rsquo;ve just prescribed leeches.'); return; }
        if (item === 'wrongsample' && /^gurney|clipboard/.test(id)){
          nurse('She flips through your tote-bag list. &ldquo;Very random. Remarkably representative,&rdquo; she says, &ldquo;of the people currently standing in that one lunch queue.&rdquo;'); return;
        }

        if (id === 'nurse'){

            nurse('&ldquo;That nice young man sorted it out,&rdquo; she says, with real warmth.<br><br>She does not ask what you intend to do with them, which is the first time all day she has not asked a follow-up question.'); return;
          }
          if (verb === 'lookat'){ api.say('You', 'The triage nurse: starched cap, clipboard, and the expression of someone who has seen four thousand badly worded questions and resuscitated about nine. Her badge reads <b>RESPONSE CATEGORIES SAVE LIVES</b>. Pinned beside it, a service medal for twelve years on one national survey, and below that a smaller, hand-lettered one: <i>SURVIVED REVIEWER 2</i>.'); return; }
          if (item){ nurse('&ldquo;I don&rsquo;t need that. The <i>patients</i> might.&rdquo;'); return; }
          if (verb === 'talkto'){
            if (F('surveyDone')){ nurse('&ldquo;Your instrument is cleared. Go and bother some real humans with it. Ethically.&rdquo;'); return; }
            if (fixedCount() === 4){ nurse('&ldquo;All four on the board. Your instrument is done.&rdquo;'); return; }
            if (!F('svFixDB')){ nurse('&ldquo;Start with the first gurney. Talk to it &mdash; well, talk to <i>me</i> about it &mdash; and I&rsquo;ll tell you what&rsquo;s holding it together.&rdquo;'); return; }
            if (!F('svFixLead')){ nurse('&ldquo;The one on the second gurney is leaning so hard it&rsquo;s practically answering itself. Some patients get better when you cross things <i>out</i>.&rdquo;'); return; }
            if (!F('svFixOften')){ nurse('&ldquo;Third gurney. &lsquo;Often.&rsquo; Four thousand days and nobody knows what it means. It needs a window of time. Ask me about it if you&rsquo;re stuck.&rdquo;'); return; }
            nurse('&ldquo;The fourth patient. On my desk, on the clipboard, right next to my elbow. Two response categories left. <i>Two.</i> Find it a proper scale.&rdquo;'); return;
          }
          return false;
        }

        if (id === 'gurney1'){
          if (F('svFixDB')){ if (verb === 'lookat'){ api.say('You', 'Two separate questions now, stitched up neatly. One is resting here; its twin has been given its own bed down the corridor.'); return; } return false; }
          // Look At does the consultation too. There is nobody standing at these beds, so a
          // player has no reason to guess that a chart is something you Talk To -- and the
          // diagnosis is the content of the room, not an optional extra.
          if (verb === 'lookat' || verb === 'talkto'){
            ctx.setFlag('svDiag1');
            nurse('<i>A question lies on the gurney, physically taped together down the middle: &ldquo;How satisfied are you with your studies AND your accommodation?&rdquo; Its chart carries two diagnoses in two different handwritings, each blaming the other half.</i><br><br>&ldquo;Classic double-barrel. Two constructs, one question mark. Somebody who loves the course and lives in a mouldy cellar has no honest box to tick.&rdquo; She nods at the glass cabinet. &ldquo;The scissors are in there. Single-concept use only &mdash; which, now you&rsquo;ve diagnosed it, this is.&rdquo;'); return;
          }
          if (item === 'scissors'){
            api.take('scissors'); discharge('svFixDB');
            window.CODEBOOK_SFX('sfx-scissors', 0.28);
            api.say('You', 'You cut carefully along the tape. The question separates cleanly into <i>&ldquo;How satisfied are you with your studies?&rdquo;</i> and <i>&ldquo;How satisfied are you with your accommodation?&rdquo;</i> The second half is wheeled away. &ldquo;We&rsquo;ll open a separate case,&rdquo; says the nurse, and takes the scissors back to the cabinet.<br><br>She unclips the chart and pins it on the DISCHARGED board.<div class="state-line win">+ Q1 discharged (' + fixedCount() + '/4)</div>'); api.sprite('mountEmpty', false); return;
          }
          if (item){ api.say('You', 'The patient does not respond to that treatment.'); return; }
          if (verb === 'use'){ api.say('You', 'You try to peel the tape off by hand. It is surgical-grade institutional tape. You&rsquo;ll need something sharper.'); return; }
          return false;
        }

        if (id === 'gurney2'){
          if (F('svFixLead')){ if (verb === 'lookat'){ api.say('You', 'Sitting up straight now: <i>&ldquo;How, if at all, has the new attendance policy affected your student life?&rdquo;</i> Neutral. Not thrilling. Healthy.'); return; } return false; }
          if (verb === 'lookat' || verb === 'talkto'){ nurse('<i>&ldquo;Don&rsquo;t you agree that the university&rsquo;s excellent new attendance policy has improved student life?&rdquo; It lies dramatically on its side &mdash; it physically cannot stand upright. Its chart reads: LEANS.</i><br><br>&ldquo;Leading. It has already decided the answer and it&rsquo;s trying to drag the respondent along. It doesn&rsquo;t need anything added. It needs words <i>crossed out</i>.&rdquo;'); return; }
          // The chewed pen crosses the leading words out, visibly, on the chart (ROADMAP 8zj).
          if (item === 'pen'){
            struck = true; renderPatients();
            window.CODEBOOK_SFX('sfx-page', 0.26);
            api.say('You', 'You uncap the chewed pen and strike through <i>&ldquo;Don&rsquo;t you agree that&rdquo;</i> and <i>&ldquo;excellent&rdquo;</i>, twice each, hard. What is left sits up and says: <i>&ldquo;How, if at all, has the new attendance policy affected your student life?&rdquo;</i> The nurse nods. &ldquo;Neutral. Boring. Healthy.&rdquo;<div class="state-line win">+ Q2 discharged (' + (fixedCount() + 1) + '/4)</div>');
            setTimeout(function(){ struck = false; discharge('svFixLead'); }, 1600);
            return;
          }
          if (verb === 'use' && !item){ api.say('You', 'You try to pry the words off with your fingers. They are printed on. You need something to cross them out with.'); return; }
          if (item){ api.say('You', 'Adding things won&rsquo;t straighten it. Cross some words out.'); return; }
          return false;
        }

        if (id === 'gurney3'){
          if (F('svFixOften')){ if (verb === 'lookat'){ api.say('You', '<i>&ldquo;During the last four weeks, how many of your scheduled lectures did you not attend?&rdquo;</i> A torn calendar page is stapled to it like a splint.'); return; } return false; }
          if (verb === 'lookat' || verb === 'talkto'){ nurse('<i>&ldquo;How often do you skip lectures?&rdquo; Question marks hover over it. Its chart is covered in circled dates and crossed-out guesses. Nobody has ever agreed what &ldquo;often&rdquo; means. A note clipped to the chart reads: DAY 4,016: STILL OPERATIONALISING &lsquo;OFTEN&rsquo;.</i><br><br>&ldquo;It needs a reference period &mdash; a concrete window of time. We don&rsquo;t keep calendars in here: temporal information compromises conceptual purity. The Ethics Tribunal has an enormous one. They use it to count how long applications have been pending.&rdquo;'); return; }
          if (item === 'calendarpage'){
            api.take('calendarpage'); discharge('svFixOften');
            api.say('You', 'You staple the torn page to the question. It sits up and says, clearly: <i>&ldquo;During the last four weeks, how many of your scheduled lectures did you not attend?&rdquo;</i> The question marks above it pop, one by one. The nurse allows herself a single, approving nod and pins the chart on the DISCHARGED board.<div class="state-line win">+ Q3 discharged (' + fixedCount() + '/4)</div>'); return;
          }
          if (item){ api.say('You', 'The nurse shakes her head. What this patient needs is a <i>time window</i>.'); return; }
          return false;
        }

        if (id === 'clipboard'){
          // Healed: the chart is on the DISCHARGED board, and the clipboard is just a clipboard.
          if (F('svFixScale')){
            if (verb === 'lookat'){ api.say('You', 'An empty clipboard. Its patient is on the DISCHARGED board now, with a proper five-point scale.'); return; }

          if (verb === 'lookat'){ api.say('You', 'A clipboard on the triage desk: <i>&ldquo;Do you support the new attendance policy? &#9744; YES &#9744; NO&rdquo;</i>. Its triage note: <b>SEVERE LOSS OF RESPONSE CATEGORIES.</b>'); return; }
          if (verb === 'talkto'){ nurse('&ldquo;The patient has lost several degrees of opinion. It needs a proper scale &mdash; ordered, balanced, with a middle. There is a five-point die on my desk. Trace it, do not roll it.&rdquo;'); return; }
          if (item === 'likertdie'){
            discharge('svFixScale');
            api.say('You', 'You don&rsquo;t roll it &mdash; the nurse would only accuse you of answering on the respondent&rsquo;s behalf. Instead you trace its faces onto the card: STRONGLY DISAGREE, DISAGREE, NEITHER, AGREE, STRONGLY AGREE. In the margin, someone has already pencilled a sixth option: SLIGHTLY EXTREMELY AGREE. More categories, more precision, apparently. You rub it out firmly. The nurse pins it on the DISCHARGED board.<div class="state-line win">+ Q4 discharged (' + fixedCount() + '/4)</div>'); return;
          }
          if (item){ api.say('You', 'Not what the patient needs. It needs a <i>scale</i>.'); return; }
          if (verb === 'use'){ api.say('You', 'You draw a third box labelled MAYBE. The nurse sighs. &ldquo;That&rsquo;s not a scale. That&rsquo;s a shrug.&rdquo;'); return; }
          return false;
        }

        if (id === 'cabinet'){
          var inCab = !F('svScissorsOut');
          if (verb === 'lookat'){ api.say('You', inCab ? 'A glass supply cabinet, empty except for one pair of scissors on a mount. The brass placard reads: <b>FOR SINGLE-CONCEPT USE ONLY.</b>' : 'An empty mount. The placard still reads FOR SINGLE-CONCEPT USE ONLY, now slightly smug.'); return; }
          if (verb === 'pickup' || verb === 'use'){
            if (!inCab){ api.say('You', 'The cabinet is empty.'); return; }
            // The other way in: she will not give them to you, but she will give them to him.
            // You skip the asking, not the understanding -- the patient is still taped together.
            if (!F('svDiag1') && ctx.hasFlag('tobiPosed') && window.CODEBOOK_TOBI_HERE('surveylab')){
              ctx.setFlag('svScissorsOut'); ctx.setFlag('svViaTobi'); ctx.setFlag('tobiFavourSpent'); api.give('scissors'); api.sprite('mountEmpty', true);
              api.say('Nurse', 'Tobi wanders over, still filming, and says the single most disqualifying sentence anyone has said in this room:<br><br>&ldquo;Hey &mdash; can he borrow the scissors? He&rsquo;s doing a whole thing.&rdquo;<br><br>&ldquo;<i>Of course he can,</i>&rdquo; says the nurse, warmly, and unlocks the cabinet.<br><br>You are holding the scissors. You still have no idea what is wrong with the patient.<div class="state-line">+ Single-Concept Scissors</div>');
              return;

            ctx.setFlag('svScissorsOut'); api.give('scissors'); api.sprite('mountEmpty', true);
            var nEl = document.getElementById('sv_spr_nurse');
            if (nEl && window.NURSE_RIG) window.CODEBOOK_RIG_WALK(nEl, window.NURSE_RIG, [62, {wait: 1400}, 0]); // fetches them from the cabinet
            api.say('You', 'The nurse unlocks the cabinet with a ceremonial little key and hands you the scissors, handles first.<div class="state-line">+ Single-Concept Scissors</div>'); return;
          }
          return false;
        }

        if (id === 'die'){
          if (ctx.hasItem('likertdie') || F('svFixScale')){ if (verb === 'lookat'){ api.say('You', 'The spot on the desk where the die was.'); return; } return false; }
          if (verb === 'lookat'){ api.say('You', 'A small five-sided die on the triage desk, one response option on each face, from STRONGLY DISAGREE to STRONGLY AGREE. With a middle.'); return; }
          if (verb === 'pickup' || verb === 'use'){
            api.sprite('dieOnDesk', false); api.give('likertdie');

          return false;
        }
        if (id === 'phone'){
          if (verb === 'lookat'){ api.say('You', 'A black rotary phone. It doesn&rsquo;t ring. It has never rung.'); return; }
          if (verb === 'talkto'){ api.say('You', 'You lift the receiver. Hold music: a string quartet playing a five-point scale, over and over.'); return; }

        }

        if (id === 'board'){
          if (verb === 'lookat'){
            api.say('You', F('surveyDone')
              ? 'The DISCHARGED board, full: four healed charts, four green ticks. Their stapled copies are your questionnaire.'
              : 'A board labelled <b>DISCHARGED</b>, with four chart clips. ' + fixedCount() + ' of 4 taken. Every patient that is fit for human administration ends up here.'); return;
          }
          if (verb === 'use' || verb === 'talkto' || item){
            if (F('surveyDone')){ api.say('You', 'All four clips are taken. Your questionnaire is in the folder.'); return; }
            var left = [];

            if (!F('svFixLead')) left.push('the leaning question on the second');

/* Minimal 2D cut-out rig for The Secret of the Lost Codebook.
 *
 * A rig is a tree of parts. Each part is one image with a pivot (the joint it rotates around,
 * in the part image's own pixels) and an attach point on its parent (in the parent's pixels).
 * Joint angles are set every frame by a pose function, e.g. the procedural walk cycle below,
 * so the character never drifts the way per-frame image generation does.
 *
 *   var rig = CodebookRig.build(container, RIG_DEF, { height: 400 });
 *   rig.play(CodebookRig.walk, { speed: 1 });   // or rig.pose({hipL: 20, ...}); rig.stop();
 */
(function(){
  function el(tag, css){ var e = document.createElement(tag); e.style.cssText = css || ''; return e; }

  function build(container, def, opts){
    opts = opts || {};
    var scale = (opts.height || def.height) / def.height;
    var root = el('div', 'position:absolute;left:0;top:0;width:0;height:0;');
    var joints = {};
    function add(part, parentEl, parentDef){
      var j = el('div', 'position:absolute;width:0;height:0;');
      var ax = parentDef ? part.attach[0] - parentDef.pivot[0] : 0;
      var ay = parentDef ? part.attach[1] - parentDef.pivot[1] : 0;
      j.style.left = (ax * scale) + 'px';
      j.style.top = (ay * scale) + 'px';
      j.style.zIndex = part.z || 0;
      var img = el('img', 'position:absolute;display:block;pointer-events:none;');
      img.src = part.src;
      img.style.width = (part.size[0] * scale) + 'px';
      img.style.height = (part.size[1] * scale) + 'px';
      img.style.left = (-part.pivot[0] * scale) + 'px';
      img.style.top = (-part.pivot[1] * scale) + 'px';
      if (part.flip) img.style.transform = 'scaleX(-1)';
      if (part.tint) img.style.filter = part.tint;
      j.appendChild(img);
      parentEl.appendChild(j);
      joints[part.id] = j;
      (part.children || []).forEach(function(c){ add(c, j, part); });
    }
    add(def.root, root, null);
    container.appendChild(root);

    var raf = null, t0 = 0, poseFn = null, poseOpts = null;
    function pose(angles, offset){
      Object.keys(angles).forEach(function(k){ if (joints[k]) joints[k].style.transform = 'rotate(' + angles[k] + 'deg)'; });
      offset = offset || { x: 0, y: 0 };
      root.style.transform = 'translate(' + (offset.x * scale) + 'px,' + (offset.y * scale) + 'px)';
    }

      var t = ((now - t0) / 1000) * (poseOpts.speed || 1) / (poseFn.period || 1);

  // i.e. a thigh swinging forward is negative when the figure faces right).
  function walk(t, o){

      angles: {

        shoulderL: 24 * stride * L.sw, elbowL: -14 - 16 * Math.max(0, -L.sw),
        shoulderR: 24 * stride * R.sw, elbowR: -14 - 16 * Math.max(0, -R.sw),

      },
      offset: { x: 0, y: -12 * Math.abs(S(t * 2, 0.25)) }
    };
  }

  }

  window.CodebookRig = { build: build, walk: walk, idle: idle };

// Idle pacing: every minMs..maxMs, walk one of the routes (while the sprite is still on screen).
window.CODEBOOK_IDLE_PACE = function(spriteEl, def, routes, minMs, maxMs){

      if (spriteEl.style.display === 'none'){ next(); return; }

};
